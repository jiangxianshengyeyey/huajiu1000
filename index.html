{"id":20,"cat":"老物件","theme":"顶针","img":"80年代农家灯下，一位老奶奶手上戴着黄铜顶针正在缝补衣裳，针脚细密，顶针在灯光下泛着暗光，旁边放着针线筐和碎布，暖黄的灯光照着花白的头发，怀旧写实。","vid":"镜头特写戴着顶针的手指推针穿过布料，针脚一行行延伸，灯光在顶针上闪动，老奶奶神情专注。","copy":"铜顶针戴了几十年，针脚一行行，把补丁缝成了花。后来眼睛花了，针穿不过去，顶针在筐里躺着。","tags":"#顶针 #80年代 #乡愁记忆 #怀旧 #童年 #回忆 #上热门"},
{"id":21,"cat":"老物件","theme":"蒲扇","img":"80年代夏天的农家院子里，一位老爷爷躺在竹椅上，手里摇着一把泛黄的蒲扇，旁边放着西瓜和茶壶，树影婆娑，蝉鸣阵阵，傍晚的光线金黄柔和，怀旧写实。","vid":"镜头从蒲扇特写缓缓拉远，老爷爷慢慢摇扇，扇影在脸上晃动，树影摇动，蝉声阵阵。","copy":"蒲扇摇一下，风就过来了，蚊子也散了。爷爷扇着扇着，就扇走了一个夏天。如今扇子还在柜顶，风凉了，扇子也旧了。","tags":"#蒲扇 #80年代 #童年 #乡愁记忆 #怀旧 #回忆 #上热门"},
{"id":22,"cat":"老物件","theme":"草帽","img":"80年代夏天的麦田里，一位农民戴着草帽弯腰割麦，帽檐下汗水顺着脸颊流下，麦浪金黄，远处是村庄的树影，烈日当空，光线强烈，怀旧写实的农忙场景。","vid":"镜头从草帽上方缓缓下移，农民直起腰擦汗，麦浪在风中起伏，草帽的阴影遮住半张脸。","copy":"草帽遮着太阳，帽檐下是庄稼人的脸。汗珠子一颗颗砸进土里，秋天才有了分量。如今草帽挂在墙上，麦浪里的影子远了。","tags":"#草帽 #80年代 #农村 #乡愁记忆 #怀旧 #回忆 #上热门"},
{"id":23,"cat":"老物件","theme":"蓑衣","img":"80年代江南农村的雨里，一位农夫穿着棕褐色蓑衣戴着斗笠，扛着锄头走在田埂上，雨丝斜织，水田里泛着涟漪，远山朦胧，灰绿色调，怀旧写实的雨景。","vid":"镜头从雨丝特写拉开，农夫穿蓑衣的背影在雨中前行，雨水顺着蓑衣往下淌，脚步踩出泥印。","copy":"雨打蓑衣，噼啪响，人却走得稳稳当当。爷爷说，淋过雨才懂得雨。如今蓑衣挂在门后，雨淋不到它了。","tags":"#蓑衣 #80年代 #农村 #乡愁记忆 #怀旧 #回忆 #上热门"},

{"id":26,"cat":"老物件","theme":"的确良","img":"80年代集市上，一位穿的确良衬衣的姑娘站在布料摊前，白衬衣在阳光下微微反光，衣领挺括，摊上摆着各色花布，她伸手摸着布料，光线明亮，怀旧写实的市集场景。","vid":"镜头从布料特写摇起，姑娘摸摸衣角又放下，衣摆在风里轻轻飘动，阳光下布面泛着光。","copy":"的确良的衣领挺括，穿上是头一回体面。如今衣柜挂满，惦记的还是那一件。","tags":"#的确良 #80年代 #乡愁记忆 #怀旧 #回忆 #童年 #上热门"},

{"id":28,"cat":"老物件","theme":"喇叭裤","img":"80年代城市街头，两个青年穿着喇叭裤花衬衫，戴着蛤蟆镜站在街边，裤脚宽大拖地，脚下是水泥路面，身后停着二八自行车，阳光明晃晃，怀旧写实的街头场景。","vid":"镜头从裤脚特写摇起，青年迈步走路，喇叭裤脚左右甩动，阳光打在花衬衫上，街景在身后流动。","copy":"喇叭裤裤脚一甩，街上的人都要多看一眼。那是爸爸的青春，烫着卷发，哼着歌。如今他头发白了，裤腿早找不见了。","tags":"#喇叭裤 #80年代 #回忆 #乡愁记忆 #怀旧 #童年 #上热门"},
{"id":29,"cat":"老物件","theme":"布拉吉","img":"80年代夏天的校园里，一个小姑娘穿着碎花布拉吉连衣裙在操场上转圈，裙摆飞起来，辫子上扎着红绸带，阳光明媚，旁边是红砖教学楼，怀旧写实的童趣场景。","vid":"镜头跟随小姑娘转圈的动作，裙摆飞扬，红绸带在发间飘动，阳光透过树叶洒下光斑。","copy":"碎花布拉吉一转，裙摆就开成一朵花。那是我第一次照镜子，也是第一次觉得好看。如今裙子短了，穿不进了。","tags":"#布拉吉 #80年代 #童年 #回忆 #乡愁记忆 #怀旧 #上热门"},
{"id":30,"cat":"老物件","theme":"头巾","img":"80年代北方农村，一位妇女围着碎花头巾在院子里晾晒衣服，头巾一角被风吹起，她踮脚把衣裳挂上衣绳，阳光强烈，院子里的老枣树投下影子，怀旧写实。","vid":"镜头从晾衣绳拉起，头巾被风吹起一角，妇女抬手整理，阳光在她脸上晃动，衣角随风摆动。","copy":"花头巾一角被风掀起，妈妈的模样定格在院里。后来头巾换了白发，风也懒得掀它了。","tags":"#头巾 #80年代 #农村 #乡愁记忆 #怀旧 #回忆 #上热门"},

{"id":32,"cat":"老物件","theme":"卡带录音机","img":"80年代青年宿舍，一台双卡录音机放在桌上，旁边堆着磁带，一个青年跟着音乐打拍子，穿喇叭裤花衬衫，墙上贴着明星海报，窗户透进黄昏的光，怀旧写实。","vid":"镜头从旋转的磁带缓缓拉远，青年随着音乐扭动，录音机指示灯闪烁，音箱微微震动，光线昏黄。","copy":"录音机一响，磁带转着转着，院子就活了。借来的磁带，藏着不敢说的心事。如今按键按下去，只有沙沙的空转。","tags":"#卡带录音机 #80年代 #回忆 #乡愁记忆 #怀旧 #童年 #上热门"},
{"id":33,"cat":"老物件","theme":"随身听","img":"80年代末的绿皮火车上，一个少年靠着车窗戴着有线耳机听随身听，窗外田野飞驰而过，阳光在脸上流动，随身听放在膝盖上，画面安静，怀旧写实的旅途场景。","vid":"镜头从窗外飞驰的田野摇回少年，他闭眼听歌，手指跟着节奏轻点，阳光在脸上明暗交替。","copy":"耳机一戴，铁轨和田野都是我的。半年的早饭，换来了一个世界。如今手机装得下所有歌，却装不下那年的心跳。","tags":"#随身听 #80年代 #童年 #回忆 #乡愁记忆 #怀旧 #上热门"},

{"id":40,"cat":"老物件","theme":"蜡烛","img":"80年代停电的夜晚，农家桌上点着一支红蜡烛，烛泪顺着烛身流下，一家人围坐吃晚饭，烛光在每个人脸上晃动，墙上映着大大的影子，怀旧写实。","vid":"镜头从烛火特写缓缓拉远，烛光在家人脸上跳动，有人夹菜有人笑，影子在墙上轻轻摇晃。","copy":"停电的夜，蜡烛一点，满墙都是影子。一家人挤在一起，影子也跟着晃。如今灯不灭了，那种挤着的暖也没了。","tags":"#蜡烛 #80年代 #童年 #乡愁记忆 #怀旧 #回忆 #上热门"},

{"id":42,"cat":"老物件","theme":"汽灯","img":"80年代乡村打谷场上，一盏汽灯高挂在木杆上，发出白亮的光，场院里人们忙着打场扬场，人影在灯下来回穿梭，麦粒纷飞，夜色笼罩，怀旧写实。","vid":"镜头从汽灯的光晕缓缓拉远，人们在灯下挥锹扬场，人影在光里晃动，麦粒在灯下纷纷落下。","copy":"汽灯一挂，打谷场亮成白昼。人们扬场到半夜，麦粒落成金山。如今灯锈了，场也荒了，那股热闹沉进麦堆里了。","tags":"#汽灯 #80年代 #农村 #乡愁记忆 #怀旧 #回忆 #上热门"},

{"id":46,"cat":"老物件","theme":"手炉","img":"80年代寒冬的农家堂屋，一位老奶奶抱着铜手炉烤火，手炉里炭火微红，她把手拢在炉上，炉盖刻着花纹，窗外飘着雪，屋内光线昏暗温暖，怀旧写实。","vid":"镜头从手炉里微红的炭火拉起，老奶奶拢着双手取暖，炭火明灭，窗外的雪静静飘落。","copy":"铜手炉捂在怀里，炭火一明一灭。奶奶的手拢在炉盖上，说这样就不冷。如今炉子传给了我，捂炉的人却留在了那年冬天。","tags":"#手炉 #80年代 #乡愁记忆 #怀旧 #回忆 #农村 #上热门"},
{"id":47,"cat":"老物件","theme":"汤婆子","img":"80年代冬天的农家床上，一只圆圆的铜汤婆子放在被窝里，一位小女孩睡前用脚丫碰了碰，母亲帮她掖被角，油灯昏黄，画面温暖，怀旧写实。","vid":"镜头从汤婆子特写缓缓拉远，小女孩钻进被窝，脚碰到汤婆子缩了一下，母亲笑着掖好被角。","copy":"汤婆子塞进被窝，脚一伸，暖到天亮。妈妈掖被角的手，比汤婆子还暖。如今她掖不动了，被窝冷了我才想起。","tags":"#汤婆子 #80年代 #童年 #乡愁记忆 #怀旧 #回忆 #上热门"},
{"id":48,"cat":"老物件","theme":"暖水袋","img":"80年代冬夜的书桌前，一个红色的橡胶暖水袋放在膝盖上，少年趴着写作业，旁边是煤油灯和作业本，窗玻璃上结着冰花，灯光昏黄，怀旧写实。","vid":"镜头从冰花窗玻璃摇向少年，他搓搓手把暖水袋挪近，笔尖在纸上沙沙响，呵出的白气在灯下散开。","copy":"红暖水袋暖着手，煤油灯暖着眼。作业写完了，灯芯挑短了，我的童年也短了。","tags":"#暖水袋 #80年代 #童年 #乡愁记忆 #怀旧 #回忆 #上热门"},
{"id":49,"cat":"老物件","theme":"火筷子","img":"80年代北方农家炉子旁，一双铁火筷子插在炉边，一位老爷爷夹起一块炭添进炉膛，火星溅起，炉火映红他的脸，旁边放着小板凳，光线温暖，怀旧写实。","vid":"镜头从炉膛火光特写拉起，火筷子夹着炭块落下，火星四溅，老人的脸被火光映得通红。","copy":"火筷子夹起炭，火星子噼啪溅。爷爷说，火要有人添，家要有人回。如今筷子生了锈，添火的人歇了。","tags":"#火筷子 #80年代 #乡愁记忆 #怀旧 #农村 #回忆 #上热门"},

{"id":51,"cat":"老物件","theme":"铁锅","img":"80年代农家土灶上，一口黑铁锅架在灶膛上，锅里热气腾腾，母亲拿着锅铲翻炒，灶火映亮锅底，蒸汽升腾，厨房里飘着饭香，光线温暖，怀旧写实。","vid":"镜头从锅里升腾的蒸汽缓缓下移，母亲翻炒的动作利落，火光映着锅底，蒸汽在光里翻滚。","copy":"黑铁锅架在灶上，锅底被火舔了几十年。贴的饼子焦黄，炒的菜喷香。如今锅锈了，灶也凉了，那股锅气随烟囱散了。","tags":"#铁锅 #80年代 #乡愁记忆 #怀旧 #农村 #童年 #上热门"},
{"id":52,"cat":"老物件","theme":"土灶","img":"80年代农村厨房，土灶上坐着大铁锅，灶膛里柴火熊熊，一位老奶奶蹲在灶前添柴，火光照亮她的脸，灶台上摆着油盐罐，烟囱里飘出炊烟，怀旧写实。","vid":"镜头从灶膛火光拉起，老奶奶往灶里添柴，火苗蹿高，烟气顺着烟囱上升，锅里热气腾腾。","copy":"土灶膛里柴火正旺，噼啪声伴着饭香。一灶火，一顿饭，一家人。如今灶拆了，那口烟囱孤零零站在雨里。","tags":"#土灶 #80年代 #农村 #乡愁记忆 #怀旧 #回忆 #上热门"},

{"id":61,"cat":"老物件","theme":"算盘","img":"80年代供销社的柜台上，一把老算盘摆在账本旁，一位老会计戴着老花镜噼里啪啦拨算盘珠，手指飞快，旁边的顾客等着结账，日光灯下，怀旧写实。","vid":"镜头从算盘珠特写摇起，老会计的手指上下翻飞，算盘珠噼啪作响，账本上的字密密麻麻。","copy":"算盘珠噼啪一响，账就清清楚楚了。会计的手指上下翻飞，一分钱都不差。如今计算器一按，那珠响熄在了指头间。","tags":"#算盘 #80年代 #乡愁记忆 #怀旧 #回忆 #农村 #上热门"},

{"id":133,"cat":"老场景·店铺","theme":"磨刀摊","img":"磨刀匠扛着长凳走街串巷，凳上绑着磨刀石和砂轮，他弓腰推刀在石上蹭磨，水花飞溅，旁边围几个家庭主妇递菜刀，午后阳光照在磨刀石上，怀旧写实。","vid":"镜头跟拍磨刀匠推刀的动作，刀刃在石面上闪光，水珠在光里飞溅，吆喝声随风飘远。","copy":"磨剪子嘞戗菜刀——那声吆喝一响，全巷子的菜刀就亮了。如今刀子钝了，却再没人应声了。","tags":"#磨刀摊 #80年代 #怀旧 #回忆 #乡愁记忆 #上热门"},
{"id":134,"cat":"老场景·店铺","theme":"剃头挑子","img":"剃头挑子走街串巷，一头是烧水的炉子脸盆架，一头是工具箱和凳子，师傅给老人剃光头，围布雪白，皂角水沫在头顶，夕阳把师徒影子拉长，怀旧写实。","vid":"镜头从炉子缓摇到剃头师傅的手，推剪在头皮上行走，夕阳下影子在地面拉长移动。","copy":"剃刀贴着头皮一走，皂角沫就落了一地。后来发廊开了好几家，剃头挑子早不串村了。","tags":"#剃头挑子 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},
{"id":135,"cat":"老场景·店铺","theme":"货郎担","img":"货郎挑着两箱货走村串户，箱里装针线、纽扣、头绳、小镜子，孩子们围上来踮脚看，货郎摇着拨浪鼓，村口大槐树下，土路扬尘，午后阳光明亮，怀旧写实。","vid":"镜头跟着货郎的脚步平移，孩子们围拢的动静，拨浪鼓摇动，阳光在货箱玻璃面上闪烁。","copy":"拨浪鼓咚咚一摇，孩子们就追出了院门。如今货郎早不来了，村口只剩老槐树。","tags":"#货郎担 #80年代 #怀旧 #童年 #乡愁记忆 #上热门"},
{"id":136,"cat":"老场景·店铺","theme":"糖画摊","img":"糖画摊，师傅舀一勺糖浆在铁板上挥洒，勾出龙凤花鸟，竹签一压一铲，金黄的糖画立在草靶上，孩子围满摊前眼巴巴看着，炉火和糖香弥漫，怀旧写实。","vid":"镜头特写糖浆在铁板上流淌成画，师傅手腕轻转，糖画在阳光下透亮，孩子伸手接过。","copy":"糖勺一提，手腕一转，龙凤就落在了铁板上。如今糖画进了庙会，画糖的师傅换了年轻人。","tags":"#糖画摊 #80年代 #童年 #回忆 #怀旧 #上热门"},
{"id":137,"cat":"老场景·店铺","theme":"捏面人摊","img":"捏面人摊，师傅手指搓捏彩色面团，片刻捏出孙悟空猪八戒，草棍上插满各色面人，孩子踮脚围着看，工具箱里颜料和竹签，街角阳光斜照，怀旧写实。","vid":"镜头从面人特写缓拉，师傅手指捏揉的动作，彩色面团在指间翻飞，阳光照亮成品。","copy":"面团在指头间一揉一捏，孙悟空就跳了出来。如今捏面人的师傅眼睛花了，摊前换成了拍照的人。","tags":"#捏面人摊 #80年代 #童年 #回忆 #怀旧 #上热门"},
{"id":138,"cat":"老场景·店铺","theme":"吹糖人摊","img":"吹糖人摊，师傅捏一小团麦芽糖吹气，鼓成糖泡再捏成老鼠公鸡，草靶上插满糖人，炉上小锅熬着糖浆，孩子们围成一圈，傍晚光线昏黄温暖，怀旧写实。","vid":"镜头从糖锅缓推，师傅鼓腮吹气糖泡渐大，指尖捏出造型，炉火在脸上明灭。","copy":"鼓着腮帮子一吹，糖泡就鼓成了老鼠。如今吹糖人成了绝活，孩子们只在手机里看。","tags":"#吹糖人摊 #80年代 #童年 #回忆 #怀旧 #上热门"},
{"id":139,"cat":"老场景·店铺","theme":"爆米花摊","img":"老式爆米花机架在炭炉上，师傅摇着手柄看气压表，孩子们捂着耳朵退后几步，砰一声巨响，白烟腾起，米花喷进长布袋，香气四溢，傍晚光线，怀旧写实。","vid":"镜头定在爆米花机前，师傅摇柄的动作，锅盖掀开瞬间白烟爆出，孩子们捂耳躲闪的剪影。","copy":"砰的一声，白烟一冒，米香就灌满了巷子。如今爆米花有各种口味，就是没那声动静了。","tags":"#爆米花摊 #80年代 #童年 #回忆 #怀旧 #上热门"},
{"id":140,"cat":"老场景·店铺","theme":"棉花糖摊","img":"棉花糖机嗡嗡转动，糖丝飞絮般绕上竹签，越滚越大成一朵云，孩子们举着棉花糖舔，脸上沾着糖丝，机器旁边围满人，阳光下糖丝发亮，怀旧写实。","vid":"镜头从糖丝特写缓拉，竹签在糖絮中转动，越滚越大的棉花糖，孩子接过舔一口。","copy":"糖丝嗡嗡地转，竹签上就长出了一朵云。如今一朵糖云五块钱，甜还是甜，就是缺了那时候的欢喜。","tags":"#棉花糖摊 #80年代 #童年 #回忆 #怀旧 #上热门"},
{"id":141,"cat":"老场景·店铺","theme":"冰棍摊","img":"冰棍摊，木箱裹着棉被，掀开盖热气扑面，里面躺着绿豆冰棍和奶油冰棍，卖冰棍的大妈拿小锤敲冰砖，孩子递上两分钱，树荫下光线斑驳，怀旧写实。","vid":"镜头从棉被箱缓推，大妈掀盖取冰棍的动作，孩子接过冰棍舔一口，树影在摊前晃动。","copy":"棉被一掀，冰棍的白气直冒。两分钱一根，舔一口能凉一个下午。如今冰棍进了冰箱，那股子盼头却凉了。","tags":"#冰棍摊 #80年代 #童年 #回忆 #怀旧 #上热门"},
{"id":142,"cat":"老场景·店铺","theme":"烤红薯摊","img":"街头烤红薯摊，大铁桶改的炉子，炉膛里红薯烤得流油，摊主用铁夹翻动，热气扑脸，旁边堆着几只烤好的红薯，冬天傍晚路灯初亮，暖光与冷气交织，怀旧写实。","vid":"镜头从炉口缓推，摊主夹出红薯掰开，热气腾腾升起，路灯下白气在光里翻涌。","copy":"铁夹一夹，掰开就一股热香扑脸。如今路灯下还有摊子，捧着的人却换了。","tags":"#烤红薯摊 #80年代 #童年 #回忆 #怀旧 #上热门"},
{"id":143,"cat":"老场景·店铺","theme":"糖葫芦摊","img":"糖葫芦摊，草靶上插满红亮的山楂糖葫芦，师傅在铁锅里滚糖浆，一串串冰糖葫芦晾在板上，孩子们围着挑，阳光照得糖衣透亮，怀旧写实。","vid":"镜头从糖葫芦特写缓拉，师傅给山楂裹糖浆的动作，糖衣在阳光下闪闪发亮，孩子伸手去够。","copy":"糖衣一脆，咬一口酸得眯眼。如今糖葫芦穿得整齐，却少了从草靶上拔下来的欢喜。","tags":"#糖葫芦摊 #80年代 #童年 #回忆 #怀旧 #上热门"},
{"id":144,"cat":"老场景·店铺","theme":"瓜子摊","img":"瓜子摊，大木桶里堆满葵花籽，摊主拿秤称瓜子，报纸卷成漏斗装瓜子，顾客买了边走边嗑，摊边围满人，午后阳光明亮，地上瓜子壳一层，怀旧写实。","vid":"镜头从瓜子堆特写缓拉，摊主秤瓜子的动作，瓜子从漏斗滑进纸包，阳光照亮飞舞的瓜子皮。","copy":"报纸一卷，五分钱的瓜子就满了兜。现在瓜子论斤买，嗑出来的还是那个香。","tags":"#瓜子摊 #80年代 #怀旧 #回忆 #童年 #上热门"},
{"id":145,"cat":"老场景·店铺","theme":"馄饨摊","img":"夜晚馄饨摊，小推车上一口大锅咕嘟冒泡，摊主左手托皮右手挑馅，手指一捏一个馄饨，碗里撒葱花虾皮，白汽在灯泡下翻腾，食客围坐小板凳，怀旧写实。","vid":"镜头从翻滚的锅缓推，摊主包馄饨的手指动作，白汽在昏黄灯光中升腾，勺子舀起馄饨入碗。","copy":"手指一捏，一个馄饨就下了锅。皮薄汤鲜，深夜的一碗能暖到脚心。如今这样的摊子，灯火越来越稀了。","tags":"#馄饨摊 #80年代 #怀旧 #回忆 #乡愁记忆 #上热门"},
{"id":146,"cat":"老场景·店铺","theme":"凉粉摊","img":"凉粉摊，大盆里凉粉白嫩颤悠，摊主用漏勺刨成条，浇上蒜汁辣椒油，白瓷碗里红绿相间，遮阳棚下食客站着吃，树影斑驳，午后闷热光线，怀旧写实。","vid":"镜头从凉粉盆缓推，刨刀刮下凉粉条，辣椒油浇下泛光，食客吸溜入口，树影轻晃。","copy":"漏勺一刮，凉粉条就滑进了碗。现在的凉粉加了各种料，可再没当年那股子滑溜劲儿了。","tags":"#凉粉摊 #80年代 #怀旧 #回忆 #童年 #上热门"},
{"id":147,"cat":"老场景·店铺","theme":"豆腐脑摊","img":"豆腐脑摊，木桶里豆腐脑白嫩如脂，摊主用铜片一片片舀进碗里，浇上卤汁和辣油，撒香菜，桌上摆着调料瓶，清晨光线柔和，蒸汽微腾，怀旧写实。","vid":"镜头从木桶缓推，铜片削豆腐脑的动作，卤汁淋下热气升起，晨光在碗沿发光。","copy":"铜片一起一落，豆腐脑就稳稳进了碗。后来那摊子收了，热气腾腾的早晨也远了。","tags":"#豆腐脑摊 #80年代 #怀旧 #回忆 #童年 #上热门"},
{"id":148,"cat":"老场景·店铺","theme":"油条摊","img":"清晨油条摊，大油锅翻滚，师傅抻面下锅，油条在油里膨胀金黄，竹夹翻动，旁边架子上晾着炸好的油条，油烟气与晨光交织，食客排队等候，怀旧写实。","vid":"镜头从油锅缓推，面团入锅瞬间翻滚膨胀，师傅夹起金黄油条，油花在晨光中闪烁。","copy":"面团一抻下锅，油花就翻腾起来。现在油条机器也能炸，却炸不出那双手的香。","tags":"#油条摊 #80年代 #怀旧 #回忆 #童年 #上热门"},
{"id":149,"cat":"老场景·店铺","theme":"茶水摊","img":"街口茶水摊，大茶缸里泡着粗茶叶，盖着木盖，摊主用长柄勺舀茶倒进粗瓷碗，桌上摆着几个碗，行路人坐下歇脚，树荫下光线斑驳，蝉鸣阵阵，怀旧写实。","vid":"镜头从大茶缸缓推，长柄勺舀起茶水倒入粗瓷碗，水汽在光中升起，路人仰头喝尽。","copy":"长柄勺一舀，粗瓷碗就满了。一分钱一碗，喝下去整个人都舒坦。后来那茶缸子不知扔在了哪个墙角。","tags":"#茶水摊 #80年代 #怀旧 #回忆 #乡愁记忆 #上热门"},
{"id":150,"cat":"老场景·店铺","theme":"修伞摊","img":"修伞摊，师傅坐在街边，膝盖上摊开一把破伞，铁丝穿骨架，手指翻飞，周围挂满修好的油纸伞和布伞，阳光透过伞面漏下光斑，工具散落一地，怀旧写实。","vid":"镜头从伞骨特写缓拉，师傅穿铁丝撑开伞面的动作，阳光透过伞布洒下光点。","copy":"伞骨一穿一撑，破伞又挺了起来。现在伞坏就换新的，修伞摊的招牌摘了下来。","tags":"#修伞摊 #80年代 #怀旧 #回忆 #乡愁记忆 #上热门"},
{"id":151,"cat":"老场景·店铺","theme":"猪市","img":"猪市，竹栏里猪崽哼哼乱窜，买卖人蹲在栏边捏摸议价，称钩吊起小猪过秤，地上泥泞，草帽斗笠晃动，正午烈日下尘土飞扬，嘈杂人声，怀旧写实。","vid":"镜头横移过猪栏，卖猪人拎起猪崽过秤，小猪挣扎蹬腿，尘土在日光中扬起。","copy":"猪崽一上秤，蹬着腿地叫。买卖全在袖筒里比划，成交了才露手。现在散养的猪少了，赶猪市的人也没了。","tags":"#猪市 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},
{"id":152,"cat":"老场景·店铺","theme":"牛市","img":"牛市，几头大黄牛拴在木桩上，买主掰开牛嘴看牙口，双手在袖筒里比价，牛贩子叼着旱烟袋，地上牛粪和干草，天空辽阔，午后光线强烈，怀旧写实。","vid":"镜头从牛头特写缓拉，买主掰牛嘴看牙，袖筒里比划手指，牛尾巴甩动赶蝇，日光刺眼。","copy":"牛嘴一掰看牙口，价钱在袖筒里一摸一递。现在牛都进了屠宰场，那只袖筒再没伸出来过。","tags":"#牛市 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},
{"id":153,"cat":"老场景·店铺","theme":"粮市","img":"粮市，麻袋一字排开，粮贩子抓一把麦粒看成色，过秤记账，大秤杆高高挑起，农民蹲在粮袋旁等着结账，集市人声鼎沸，阳光炽烈，怀旧写实。","vid":"镜头从粮袋缓推，粮贩抓起麦粒细看的动作，大秤杆起落，麦粒从指缝滑落闪光。","copy":"麦粒从指缝一漏，成色好坏心里就清了。后来收粮都过机器，那杆老秤锈在了墙根。","tags":"#粮市 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},
{"id":154,"cat":"老场景·店铺","theme":"集市","img":"乡村集市，摊位密布，花布、农具、锅碗、糖果摆满长街，人群摩肩接踵，吆喝声此起彼伏，孩子骑在父亲肩头看热闹，尘土在阳光里飞扬，怀旧写实。","vid":"镜头从街口缓推入集市，人流涌动穿行，摊主吆喝招手的动作，阳光在摊位布棚上晃动。","copy":"一入集，吆喝声就灌满了耳朵。兜里几块钱，能从街头花到街尾。如今集市还在赶，人却走得稀了。","tags":"#集市 #80年代 #怀旧 #乡愁记忆 #童年 #上热门"},
{"id":155,"cat":"老场景·店铺","theme":"庙会","img":"庙会，红灯笼高挂，香火缭绕，戏台前人头攒动，糖画风车泥人摆满摊位，老人烧香祈福，孩子举着风车跑，庙宇飞檐在蓝天映衬下，暖阳普照，怀旧写实。","vid":"镜头缓缓上摇，从香火人群到庙宇飞檐，风车在孩子手中转动，阳光透过香烟洒下光柱。","copy":"香火一燃，庙门前就挤满了人。风车在头顶呼呼地转，转走了多少年。如今庙会还办着，挤在前头的都是新面孔了。","tags":"#庙会 #80年代 #怀旧 #童年 #乡愁记忆 #上热门"},
{"id":156,"cat":"老场景·店铺","theme":"戏台","img":"村口土戏台，红布幕布拉开，演员粉墨登场，锣鼓铿锵，台下人山人海，老人坐前排板凳，孩子骑在墙头，灯光照在台上，尘土在光束中飞扬，怀旧写实。","vid":"镜头从台下人群缓推，演员甩袖亮相的动作，锣鼓声起，台上灯光把身影拉长。","copy":"锣鼓一敲，台下的人就静了。花旦的水袖一甩，多少心事都甩进了戏里。后来戏台拆了，唱戏的人散了。","tags":"#戏台 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},
{"id":157,"cat":"老场景·店铺","theme":"说书场","img":"说书场，老艺人手拿醒木一拍，茶碗在桌上震动，折扇一抖开讲，台下听众围坐凝神，烟袋锅子明灭，土屋里油灯昏黄，人影投在墙上，怀旧写实。","vid":"镜头从醒木特写缓拉，说书人拍桌抖扇的动作，油灯火焰摇曳，墙上人影晃动。","copy":"醒木一拍，满屋子的耳朵都竖了起来。现在故事都装进了手机，说书人的醒木落了灰。","tags":"#说书场 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},
{"id":158,"cat":"老场景·店铺","theme":"杂耍摊","img":"杂耍摊，艺人头顶叠碗走钢丝，脚下踩独轮车，孩子们仰头看得入神，铜锣一敲讨赏钱，围观人群里三层外三层，午后阳光刺眼，尘土飞扬，怀旧写实。","vid":"镜头缓缓上摇，艺人头顶叠碗的平衡动作，独轮车转动，阳光照在碗沿发亮，人群仰头。","copy":"头顶的碗叠得老高，看得人攥紧了拳头。现在杂耍都上了电视，却没人在现场喊好了。","tags":"#杂耍摊 #80年代 #怀旧 #童年 #回忆 #上热门"},
{"id":159,"cat":"老场景·店铺","theme":"卖艺摊","img":"街头卖艺摊，壮汉胸口碎大石，围观者惊呼后退，旁边徒弟举着铜锣收钱，地上铺着红布道具，路灯昏黄，人影围成大圈，烟尘在光中浮动，怀旧写实。","vid":"镜头从围观人群缓推，锤落石碎的瞬间，人群后退惊呼，灯光在烟尘中打亮。","copy":"大锤一落，石头应声裂成两半。卖艺人挣的是玩命的钱，看的人只图个热闹。后来那锤子，再没砸下去过。","tags":"#卖艺摊 #80年代 #怀旧 #回忆 #乡愁记忆 #上热门"},
{"id":160,"cat":"老场景·店铺","theme":"耍猴摊","img":"街头耍猴摊，老艺人敲锣指挥，小猴子翻跟头戴帽子作揖，围观的孩子咯咯笑，猴子捧着碗讨钱，树下光影斑驳，锣声清脆，怀旧写实。","vid":"镜头跟随小猴子翻跟头，猴子作揖讨钱的动作，锣在阳光下反光，人群围拢。","copy":"铜锣一敲，猴子就翻着跟头讨钱。孩子们笑得前仰后合，摊前围得里三层外三层。后来猴子上山了，锣声也听不见了。","tags":"#耍猴摊 #80年代 #童年 #回忆 #怀旧 #上热门"},
{"id":161,"cat":"老场景·店铺","theme":"小卖部","img":"村口小卖部，木头货架上摆着酱油、火柴、电池和糖果，玻璃柜台擦得锃亮，老板娘嗑瓜子记账，孩子递上攒下的零钱买糖，门口挂着手写招牌，黄昏光线温暖，怀旧写实。","vid":"镜头从货架缓推，老板娘从玻璃罐里夹糖的动作，孩子摊开手心的硬币，夕阳斜照进柜台。","copy":"玻璃罐一掀，糖纸就沙沙地响。攒了三天的钢镚，就为这一颗甜。现在超市的糖随便挑，甜却不一样了。","tags":"#小卖部 #80年代 #童年 #回忆 #怀旧 #上热门"},
{"id":162,"cat":"老场景·店铺","theme":"烟酒铺","img":"烟酒铺，木柜台上摆着散酒坛和大前门香烟，墙上贴着烟标酒标，老板用提子打散酒，玻璃柜台下摆着老酒瓶，黄昏灯光昏黄，酒香飘散，怀旧写实。","vid":"镜头从酒坛缓推，提子舀酒倒入瓶中的动作，酒液在光下透亮，柜台灯影晃动。","copy":"提子一提，散酒就满了瓶。大前门一撕，爷几个的龙门阵就摆开了。后来那铺子关了，酒香只留在梦里。","tags":"#烟酒铺 #80年代 #怀旧 #回忆 #乡愁记忆 #上热门"},
{"id":163,"cat":"老场景·店铺","theme":"肉铺","img":"老肉铺，案板上摆着大块猪肉，老板抡刀剁排骨，肉钩挂着一排肉，墙上写着肉价，买肉人挑肥拣瘦，木案泛着油光，日光灯照得肉色鲜亮，怀旧写实。","vid":"镜头从肉钩缓推，老板抡刀剁肉的动作，肉块在案板上弹动，油光在灯光下闪烁。","copy":"剁刀一落，案板都跟着颤。过年割二斤肉，孩子在灶台边转了八圈。现在肉随时能买，那股子馋劲却提不起来了。","tags":"#肉铺 #80年代 #怀旧 #童年 #回忆 #上热门"},
{"id":164,"cat":"老场景·店铺","theme":"鱼市","img":"鱼市，木盆里活鱼蹦跳，水花四溅，卖鱼人捞鱼过秤，地上湿漉漉泛着水光，买主蹲下挑鱼，晨光斜照，水汽升腾，人声嘈杂，怀旧写实。","vid":"镜头从木盆缓推，卖鱼人捞起鱼过秤，鱼尾甩动水珠飞溅，晨光在水面上闪亮。","copy":"木盆一响，鱼尾巴甩得水花四溅。捞起来过秤，活蹦乱跳才算新鲜。现在鱼都养在超市的玻璃缸里，那股子水汽找不回了。","tags":"#鱼市 #80年代 #怀旧 #回忆 #乡愁记忆 #上热门"},
{"id":165,"cat":"老场景·店铺","theme":"菜市场","img":"老菜市场，竹筐里堆满青菜萝卜，摊主吆喝叫卖，秤杆高挑，买主讨价还价，地面湿漉，顶棚漏下光柱，人声鼎沸，晨光中水汽弥漫，怀旧写实。","vid":"镜头从菜摊缓移，摊主称菜找零的动作，光柱在摊位上移动，人群在光影中穿行。","copy":"天一亮，叫卖声就响成一片。五分钱一把青菜，还能饶你两根葱。现在买菜进了超市，讨价还价的声气没了。","tags":"#菜市场 #80年代 #怀旧 #回忆 #乡愁记忆 #上热门"},
{"id":166,"cat":"老场景·店铺","theme":"早市","img":"天蒙蒙亮的早市，摊位刚摆开，油条豆浆热气腾腾，卖菜人挑着担子进场，买主拎着篮子挑拣，晨雾未散，路灯还亮着，光线清冷又温暖，怀旧写实。","vid":"镜头从晨雾中缓推，摊主揭开蒸笼白汽升腾，路灯逐渐熄灭，天色渐亮。","copy":"天没亮，摊子就支了起来。油锅一热，白汽顶着路灯往上升。现在早市还开着，赶早的人没从前多了。","tags":"#早市 #80年代 #怀旧 #回忆 #乡愁记忆 #上热门"},
{"id":167,"cat":"老场景·店铺","theme":"夜市","img":"夏夜夜市，灯泡一串串亮起，摊位上摆着衣服杂货小吃，人群溜达闲逛，扇子摇动，蚊虫绕着灯泡飞，烧烤摊白烟升腾，暖黄灯光连成一片，怀旧写实。","vid":"镜头从灯串缓推，摊主翻动烤串的动作，白烟在灯光中翻卷，人群影影绰绰。","copy":"灯泡一亮，一条街就活了。凉风一吹，汗味都散了。现在夜市搬进了商场，少了那份露天里的自在。","tags":"#夜市 #80年代 #怀旧 #回忆 #乡愁记忆 #上热门"},
{"id":168,"cat":"老场景·店铺","theme":"瓜摊","img":"夏日瓜摊，大板车上堆满绿皮西瓜，老板拍瓜听声，切开的西瓜红瓤黑籽，插着竹签卖，孩子们围着看，树荫下光线斑驳，蒲扇摇动，蝉鸣阵阵，怀旧写实。","vid":"镜头从切开的西瓜特写缓拉，老板拍瓜听响，刀落瓜开汁水迸溅，树影在摊前晃动。","copy":"手一拍，耳朵一听，就知道瓜熟没熟。刀一落，红瓤就裂到了头。现在西瓜切好装盒卖，拍一拍听一听的讲究没人讲了。","tags":"#瓜摊 #80年代 #童年 #回忆 #怀旧 #上热门"},
{"id":169,"cat":"老场景·店铺","theme":"水果摊","img":"水果摊，竹筐里摆着苹果橘子梨，老板娘拿秤称果，孩子踮脚够果筐，遮阳伞下水果鲜亮，阳光透过伞布，果香四溢，青石板上光影斑驳，怀旧写实。","vid":"镜头从果筐缓推，老板娘称果装袋的动作，阳光在果皮上滑动发亮，孩子伸手接过。","copy":"竹筐一摆，果香就飘了一条街。称一斤苹果，回家一人分一个。现在水果论箱买，分着吃的那份甜也淡了。","tags":"#水果摊 #80年代 #怀旧 #童年 #回忆 #上热门"},
{"id":170,"cat":"老场景·店铺","theme":"酱菜摊","img":"酱菜摊，一口口大缸摆开，缸里腌着萝卜黄瓜疙瘩头，老板娘用竹夹夹菜称重，酱油色亮泽，缸沿泛着盐霜，老远就闻到酱香，街角光线昏黄，怀旧写实。","vid":"镜头从酱缸缓推，竹夹夹起酱菜滴着酱汁，老板娘抖秤，阳光在缸面上泛光。","copy":"酱缸一掀，咸香就勾住了鼻子。夹一筷子萝卜干，能下三碗饭。现在酱菜进了罐头瓶，少了掀开缸盖那一口扑鼻。","tags":"#酱菜摊 #80年代 #怀旧 #回忆 #乡愁记忆 #上热门"},
{"id":171,"cat":"老场景·店铺","theme":"学校教室","img":"老教室，木课桌刻满字迹，水泥黑板用粉笔写着板书，老师戴眼镜讲课，孩子们双手背后端坐，窗台摆着墨水瓶煤油灯，阳光透过木窗斜照，粉笔灰在光里飘，怀旧写实。","vid":"镜头从黑板缓推，老师写板书的粉笔动作，粉笔灰在光柱中飘落，窗外树影摇动。","copy":"黑板擦一响，粉笔末就落了一头。木头课桌刻着字，一坐就是一下午。现在教室装上了投影，粉笔灰再也扬不起来了。","tags":"#学校教室 #80年代 #童年 #回忆 #怀旧 #上热门"},
{"id":172,"cat":"老场景·店铺","theme":"操场","img":"学校操场，土操场扬起尘土，孩子们跳绳、踢毽子、丢沙包，篮球架锈迹斑斑，旗杆上红旗飘动，操场边杨树成排，午后阳光炽烈，影子拉长，怀旧写实。","vid":"镜头从旗杆缓摇到操场，孩子们奔跑跳跃的动作，尘土在光里飞扬，影子随太阳移动。","copy":"上课铃一响，魂还在操场上飞。跳绳踢毽子丢沙包，一跑就是一身汗。现在操场铺了塑胶，孩子们却都低头看手机。","tags":"#操场 #80年代 #童年 #回忆 #怀旧 #上热门"},
{"id":173,"cat":"老场景·店铺","theme":"图书室","img":"学校图书室，木书架上摆满旧书，管理员戴袖套整理图书，孩子趴在桌上看小人书，窗边光线明亮，灰尘在光柱中浮动，墙上贴着标语，宁静安详，怀旧写实。","vid":"镜头从书架缓推，孩子翻书页的动作，书页在光中翻动，窗外阳光缓缓移动。","copy":"书页一翻，故事就从纸上站了起来。一本小人书传遍了全班，角都卷没了。现在图书室里摆着新书，却没人传着看了。","tags":"#图书室 #80年代 #童年 #回忆 #怀旧 #上热门"},
{"id":174,"cat":"老场景·店铺","theme":"医务室","img":"学校医务室，白墙白柜，桌上摆着红药水瓶和体温计，穿白大褂的校医给小孩擦红药水，孩子咧嘴忍着，窗户透进明亮光线，药水味道弥漫，怀旧写实。","vid":"镜头从药瓶缓推，校医蘸药水涂抹的动作，孩子龇牙的表情，窗外光把白墙照亮。","copy":"红药水一蘸，疼得人龇牙咧嘴。嘴上说着不疼，眼泪在眼眶里打转。现在医务室的药水瓶子还在，校医却换成了陌生人。","tags":"#医务室 #80年代 #童年 #回忆 #怀旧 #上热门"},
{"id":175,"cat":"老场景·店铺","theme":"大队部","img":"大队部，土墙上刷着标语，门口挂木牌，屋里有广播喇叭、电话和老式办公桌，干部戴草帽进门开会，桌上摆搪瓷缸，午后阳光透过木窗，墙上挂锦旗，怀旧写实。","vid":"镜头从门口缓推，干部掀门帘进门的动作，桌上搪瓷缸被端起，光柱在屋内移动。","copy":"喇叭一响，村里的事就传遍了。干部端着搪瓷缸，一开会就是一下午。后来喇叭还挂在杆上，喊话的人却没了。","tags":"#大队部 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},
{"id":176,"cat":"老场景·店铺","theme":"广播站","img":"广播站，桌上摆着老式话筒和唱片机，广播员对着话筒播报，墙头大喇叭挂在高杆上，窗外村庄炊烟袅袅，午间阳光照进小屋，声音仿佛能传遍田野，怀旧写实。","vid":"镜头从话筒缓拉，广播员调音的动作，窗外喇叭在风中轻晃，阳光在桌面上移动。","copy":"音乐一放，全村就跟着哼。午间的大喇叭，是庄稼人的钟表。后来广播站关门了，那个声音留在了田埂上。","tags":"#广播站 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},
{"id":177,"cat":"老场景·店铺","theme":"水塔","img":"村头红砖水塔高高矗立，塔顶水池，塔身爬满藤蔓，孩子们在塔下的水龙头排队接水，水花飞溅，土路泛着水光，午后光线强烈，塔影拉长，怀旧写实。","vid":"镜头从塔顶缓摇到塔下，孩子拧开水龙头水花四溅，塔影在地面随太阳移动。","copy":"龙头一拧，水就哗哗地冲出来。孩子们排着队，等着接一桶凉。现在水塔生了锈，排队的人早散光了。","tags":"#水塔 #80年代 #怀旧 #乡愁记忆 #童年 #上热门"},
{"id":178,"cat":"老场景·店铺","theme":"机井","img":"村口机井，铁管井口出水哗哗，抽水机哒哒响，人们挑着扁担排队接水，水桶碰撞叮当，水花溅湿地面，柳树荫下光线斑驳，怀旧写实。","vid":"镜头从井口缓推，水桶接满提起，扁担颤悠挑走，水珠在阳光下闪亮。","copy":"水泵一响，凉水就直往桶里窜。挑回家倒进缸，喝一口甜到心底。后来井还在，水却没人挑了。","tags":"#机井 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},
{"id":179,"cat":"老场景·店铺","theme":"打谷场","img":"村口打谷场，碌碡碾过麦穗，麦粒簌簌落下，大人扬场，麦糠随风飘散，孩子们在草垛间钻来钻去，夕阳把整个场院染成金色，怀旧写实。","vid":"镜头从碌碡缓拉，扬场的麦粒在风中划出弧线，夕阳金光照亮扬起的麦糠。","copy":"碌碡一滚，麦粒就簌簌地落。扬场的木锨一甩，麦糠就飞上了天。后来场院盖了房，打谷的吆喝声散了。","tags":"#打谷场 #80年代 #怀旧 #乡愁记忆 #童年 #上热门"},
{"id":180,"cat":"老场景·店铺","theme":"晒谷场","img":"晒谷场，金黄谷子摊满一地，老人拿木耙翻晒，鸡鸭在一旁啄食，场上竹匾晒着干菜，头顶蓝天白云，阳光炽烈，谷粒在光里闪亮，怀旧写实。","vid":"镜头从谷粒特写缓拉，木耙翻动谷粒，鸡群啄食追赶，阳光在谷面上流动。","copy":"木耙一推，谷粒就在日头下翻了个身。晒三天收进屋，一年的心就落了地。后来晒谷场也铺了水泥，那股谷香却寻不回了。","tags":"#晒谷场 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},
{"id":181,"cat":"老场景·店铺","theme":"稻田","img":"稻田，绿油油稻浪随风起伏，农民弯腰插秧，泥水没过小腿，头上草帽晃动，远处青山如黛，天边白云，午后阳光热烈，水田映着天光，怀旧写实。","vid":"镜头从稻浪缓推，农民弯腰插秧的动作，水田倒影随波纹晃动，阳光在水面闪烁。","copy":"秧苗往泥里一插，水花就溅上了裤腿。弯腰一天，脊背晒成了铜色。现在田里没人插秧了，都等着机器下地。","tags":"#稻田 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},
{"id":182,"cat":"老场景·店铺","theme":"麦田","img":"金色麦田一望无际，麦浪翻滚，农民挥镰割麦，麦捆一排排立着，孩子们跟在后面拾麦穗，远处村庄炊烟，夕阳把麦田染成橘红，怀旧写实。","vid":"镜头从麦浪缓推，镰刀割麦的动作，麦穗在风中起伏，夕阳在麦芒上闪光。","copy":"镰刀一挥，麦子就齐刷刷地倒。拾穗的孩子跟在后面，捡得比谁都欢。现在收麦都开着收割机，弯腰的日子成了相片。","tags":"#麦田 #80年代 #怀旧 #乡愁记忆 #童年 #上热门"},
{"id":183,"cat":"老场景·店铺","theme":"菜园","img":"农家菜园，竹篱笆围着，豆角黄瓜爬满架，白菜萝卜一行行，老人提水浇菜，水瓢扬起水花，清晨露珠在叶上闪光，晨光柔和，怀旧写实。","vid":"镜头从菜架缓推，水瓢浇下水珠飞溅，露珠在叶片上滚动，晨光透过篱笆洒下。","copy":"水瓢一扬，水珠就洒在了叶子上。豆角黄瓜摘一把，晚饭就添了一个菜。后来菜园荒了半边，父亲提水的身影也没了。","tags":"#菜园 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},
{"id":184,"cat":"老场景·店铺","theme":"猪圈","img":"农家猪圈，几头肥猪拱着食槽，猪食槽里拌着菜叶糠，主人提桶倒食，猪崽抢食哼哼，圈墙爬满青苔，午后阳光斜照，泥地踩得发亮，怀旧写实。","vid":"镜头从食槽缓推，猪群拱食的动作，主人提桶倒食，泥地反光随光线变化。","copy":"食槽一敲，猪崽就哼哼地围上来。喂了一年，就等过年那一声刀响。后来圈空了，年味也没了那声响。","tags":"#猪圈 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},
{"id":185,"cat":"老场景·店铺","theme":"牛棚","img":"村口牛棚，老黄牛卧在干草上反刍，主人拿木梳给牛刷毛，牛棚梁上挂着干草，土墙缝隙漏光，黄昏光线昏黄，牛尾巴轻甩，怀旧写实。","vid":"镜头从牛头特写缓拉，主人刷牛毛的动作，牛尾巴甩动赶蝇，黄昏光在棚内移动。","copy":"木梳一刷，牛尾巴就舒服地甩起来。牛是半个家当，犁地拉车都指望它。后来棚里空了，那把木梳挂在墙钉上再没人伸手去够。","tags":"#牛棚 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},
{"id":186,"cat":"老场景·店铺","theme":"鸡舍","img":"农家小院鸡舍，母鸡带着小鸡啄食，公鸡站在墙头打鸣，主人撒玉米粒，鸡群扑棱翅膀抢食，晨光中鸡毛泛亮，土墙边稻草堆，怀旧写实。","vid":"镜头从鸡群缓推，主人撒食鸡群抢食的动作，公鸡扑翅打鸣，晨光把鸡毛照亮。","copy":"鸡一叫，天就亮了半边。撒一把玉米，鸡群扑棱着翅膀抢食。现在鸡都在笼里养着，满院撒食的光景没了。","tags":"#鸡舍 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},
{"id":187,"cat":"老场景·店铺","theme":"鱼塘","img":"村头鱼塘，水面波光粼粼，养鱼人划着小木船撒鱼食，鱼群翻腾抢食，塘边柳树垂枝，竹竿钓者静坐，午后阳光在水面碎成金点，怀旧写实。","vid":"镜头从水面缓推，撒食的动作带起鱼群翻跃，水波金光扩散，柳影在水面晃动。","copy":"鱼食一撒，水面就炸开了花。养一年，过年捞起来分给邻家。后来鱼塘填平盖了楼，捞鱼的笑声沉在了水下。","tags":"#鱼塘 #80年代 #怀旧 #乡愁记忆 #童年 #上热门"},
{"id":188,"cat":"老场景·店铺","theme":"村口大槐树","img":"村口大槐树，树冠如盖，树下石碾石凳，老人摇蒲扇下棋，孩子围着树捉迷藏，树上挂着一口钟，傍晚光线透过树隙洒下光斑，怀旧写实。","vid":"镜头从树冠缓摇到树下，老人摇扇下棋的动作，光斑在石凳上移动，钟绳轻晃。","copy":"蒲扇一摇，树荫下就坐满了人。村里的新闻，都在树底下过一遍。如今树还在，树下的老人却凑不齐了。","tags":"#村口大槐树 #80年代 #怀旧 #乡愁记忆 #童年 #上热门"},
{"id":189,"cat":"老场景·店铺","theme":"老宅院","img":"老宅院，青砖灰瓦，木门铜环，院里天井漏下天光，晾衣绳上挂着衣服，老人坐在门槛上择菜，石阶泛着青苔，午后的光柔和安静，怀旧写实。","vid":"镜头从院门缓推，老人择菜的动作，天井光柱缓缓移动，晾衣绳上衣服轻摆。","copy":"门槛一坐，太阳就晒到了脚边。择一把菜，逗一逗猫，半天就过去了。如今院门锁着，推开也听不见有人应。","tags":"#老宅院 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},
{"id":190,"cat":"老场景·店铺","theme":"祠堂","img":"老祠堂，飞檐翘角，木柱斑驳，堂内挂着祖宗牌位和匾额，香火袅袅，老人带着孩子上香，天井里光柱明亮，尘埃在光中浮动，怀旧写实。","vid":"镜头从匾额缓摇到牌位，老人上香的动作，香烟在光柱中缓缓上升，光影沉静。","copy":"香一燃，烟就袅袅地往上飘。祖宗的名字，一个个刻在牌位上。如今香还点着，认认真真跪下去的人少了。","tags":"#祠堂 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},
{"id":191,"cat":"老场景·店铺","theme":"火车站台","img":"老火车站台，绿皮火车停靠，汽笛鸣响，站台拥挤，旅客提着行李包裹上下车，车窗探出脑袋挥手，站牌斑驳，蒸汽与阳光交织，怀旧写实。","vid":"镜头从站牌缓推，旅客拎包挤上车的动作，火车缓缓启动，车窗人影挥手，蒸汽升腾。","copy":"汽笛一鸣，站台就乱了。挥手的人追着车窗跑，送走了一程又一程。如今动车快得没工夫挥手，慢车的情分却淡了。","tags":"#火车站台 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},
{"id":192,"cat":"老场景·店铺","theme":"候车室","img":"老候车室，长条木椅坐满旅客，大件行李堆在脚边，有人靠着打盹，有人啃干粮，墙上的时刻表和大钟，天窗漏下光柱，灰尘浮动，怀旧写实。","vid":"镜头从大钟缓推，旅客起身拎包的动作，光柱中尘埃浮动，墙上影子移动。","copy":"大钟的针一圈圈地走，人一拨拨地等。啃一口干粮，眯一觉，天就亮了。如今候车室里刷着手机，等的人不再东张西望了。","tags":"#候车室 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},
{"id":193,"cat":"老场景·店铺","theme":"渡口","img":"老渡口，木船横在河边，艄公撑篙，乘客挑担登船，河水泛着波光，岸边芦苇摇曳，对岸村庄隐约，晨雾未散，朝阳把水面染成金色，怀旧写实。","vid":"镜头从河面缓推，艄公撑篙的动作，船身随水波轻晃，晨光在水面上铺开。","copy":"篙一撑，船就离了岸。河风吹着，船头犁开的浪花哗哗响。后来桥修通了，渡口的船搁浅在苇丛里。","tags":"#渡口 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},
{"id":194,"cat":"老场景·店铺","theme":"码头","img":"老码头，货船靠岸，搬运工扛着麻袋走过跳板，汽笛长鸣，江面货轮来往，岸上堆满货物，缆绳绷紧，夕阳把江水染红，人声嘈杂，怀旧写实。","vid":"镜头从跳板缓推，搬运工扛包走过的动作，江水拍岸，夕阳在波浪上碎成金光。","copy":"汽笛一长鸣，麻袋就压上了肩。汗珠子摔在跳板上，砸出个印子。后来货都走集装箱，码头上的号子也随江水漂走了。","tags":"#码头 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},
{"id":195,"cat":"老场景·店铺","theme":"石桥","img":"老石桥，青石拱桥横跨小河，桥面磨得光滑，石缝长着青草，老人挑担过桥，孩子蹲在桥头看鱼，桥下溪水潺潺，柳树垂条，午后光线柔和，怀旧写实。","vid":"镜头从桥拱缓推，老人挑担过桥，桥下水流闪烁，柳影在水面轻晃。","copy":"桥面磨得溜光，走上去踏实。桥下流水哗哗，柳影子在水里晃。如今桥还老样子，过桥的人却一年比一年少。","tags":"#石桥 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},
{"id":196,"cat":"老场景·店铺","theme":"木桥","img":"乡间木桥，木板铺成，桥身窄窄，桥桩立在水里，行人推着独轮车过桥，桥板吱呀作响，桥下溪流清澈，野花丛生，晨光斜照，怀旧写实。","vid":"镜头从桥头缓移，独轮车碾过桥板晃动，桥板吱呀，溪水在光下闪亮。","copy":"桥板一踩，吱呀一声响。推着独轮车过桥，颤颤悠悠地晃。后来桥桩烂了半截，再也驮不动归乡的脚了。","tags":"#木桥 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},
{"id":197,"cat":"老场景·店铺","theme":"胡同口","img":"老胡同口，砖墙斑驳，门楼旧牌，孩子们在胡同里滚铁环，老大爷坐在门墩上摇扇，晾衣绳横过上空，夕阳把胡同染成金色，影子拉长，怀旧写实。","vid":"镜头从门楼缓推，孩子滚铁环跑过，铁环叮当响，夕阳下影子在地面拉长。","copy":"铁环一滚，叮当声顺着巷子跑。门墩上一坐，一袋烟就抽到日头落。后来铁环锈了，滚它的人也散了各奔东西。","tags":"#胡同口 #80年代 #怀旧 #童年 #回忆 #上热门"},
{"id":198,"cat":"老场景·店铺","theme":"巷子","img":"老巷子，青石板路泛着水光，两侧屋檐低垂，墙头爬满藤蔓，有人推着自行车走过，车铃叮当，巷口晾着衣服，细雨刚停，光线湿润柔和，怀旧写实。","vid":"镜头从巷口缓推，自行车碾过石板，车铃响起，墙头藤蔓在光里轻摆。","copy":"自行车铃一响，巷子里的狗就叫了。青石板上滴着水，晾的衣服在风里摆。后来巷子拓宽了，那份慢却没了。","tags":"#巷子 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},
{"id":199,"cat":"老场景·店铺","theme":"天井","img":"老宅天井，四四方方，天光从头顶漏下，地面铺着青砖，放着一口大水缸，养着几尾鱼，墙角苔藓翠绿，晾着萝卜干，雨后光线清亮，怀旧写实。","vid":"镜头从水缸缓推，水面上光斑晃动，鱼影游动，光柱缓缓移动过青砖地面。","copy":"天光从头顶漏下来，正好落进水缸。缸里的鱼摆着尾巴，一游就是一年。如今缸还在，看鱼的孩子搬去了城里。","tags":"#天井 #80年代 #怀旧 #乡愁记忆 #童年 #上热门"},
{"id":200,"cat":"老场景·店铺","theme":"晒台","img":"屋顶晒台，竹竿上晾满被褥和衣服，老人在台上晒萝卜干、翻酱缸，远处是连片屋顶和烟囱，傍晚夕阳把晒台染成橘色，风吹衣摆，怀旧写实。","vid":"镜头从晒台缓摇到远处屋顶，老人翻晒的动作，被褥在风里鼓起，夕阳缓缓下沉。","copy":"被褥往竹竿上一晾，风就鼓成了帆。翻一翻萝卜干，太阳的味道就收进了缸。如今晒台还在，晒它的人上了年纪。","tags":"#晒台 #80年代 #怀旧 #乡愁记忆 #回忆 #上热门"},{"id":201,"cat":"老行当·手艺","theme":"打铁匠","img":"80年代乡村打铁铺内，赤膊老铁匠抡起大铁锤砸向烧红的铁块，火星四溅，炉膛火焰通红照亮斑驳土墙，风箱在旁呼呼作响，墙上挂满锄头镰刀铁锹，黄昏斜光透过木门，热气蒸腾。","vid":"镜头缓慢推近打铁台，铁锤落下砸出火星四溅，炉火映红铁匠脸庞，风箱拉动烟气升腾，光影随锤击明暗闪烁。","copy":"一锤下去，火星溅了满屋。铁冷了能回炉，人呢，回不去了。","tags":"#打铁匠 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":202,"cat":"老行当·手艺","theme":"木匠","img":"80年代农家院落里，木匠师傅俯身在长条凳上刨木板，刨花卷曲落地，旁边摆着墨斗、凿子、斧头和木工尺，阳光透过树叶洒下斑驳光影，地上堆满刨花与木屑，背景是土坯老屋。","vid":"镜头绕木匠缓慢横移，刨子推出卷曲刨花飘落，墨斗弹线清脆一响，阳光在木屑中浮起细尘。","copy":"刨花卷着落，墨斗线一弹一个准。如今家具成套买，谁还记得刨子的声。","tags":"#木匠 #乡愁记忆 #农村生活 #童年 #回忆 #80年代"},
{"id":203,"cat":"老行当·手艺","theme":"竹匠","img":"80年代竹器作坊，老师傅坐在小凳上剖竹破篾，竹片在他指间翻飞成均匀细条，地上堆着竹筒竹条，墙角立着竹篮竹筛，青翠竹影与土墙相映，午后阳光透过窗棂洒落。","vid":"特写竹刀破开竹节，篾条在指间翻飞弹跳，镜头缓缓后拉露出满屋竹器，阳光在竹面上流动。","copy":"竹刀一划，满屋都是清香。竹器被塑料替了，那双翻飞的手也歇了。","tags":"#竹匠 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":204,"cat":"老行当·手艺","theme":"篾匠","img":"80年代乡村晒场边，篾匠盘腿而坐编织竹筐，青篾在手中交错穿梭，脚边放着劈好的竹篾和半成品篮子，背后是晾晒的稻谷和土墙老房，暖阳斜照，地面投下长长影子。","vid":"特写篾条交错编织逐渐成筐，镜头缓缓上摇至篾匠专注的脸，风吹动晒场谷粒，光影柔和流转。","copy":"青篾在手，编筐又编篓。篓子进了城，篾匠却闲下了。","tags":"#篾匠 #乡愁记忆 #农村生活 #童年 #80年代 #上热门"},
{"id":205,"cat":"老行当·手艺","theme":"石匠","img":"80年代村头采石场，老石匠蹲在巨石前挥锤凿石，錾子敲出点点石粉，身旁放着锤子、錾子和墨线盒，戴草帽穿粗布衣，远处山峦青翠，阳光强烈投下浓重阴影。","vid":"镜头贴近石面拍摄，錾子起落碎石飞溅，石粉在光束中飘散，老石匠手臂青筋鼓起，光影在石纹上流动。","copy":"錾子凿石头，火星石粉一起飞。石头还硬，凿石头的人弯了腰。","tags":"#石匠 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},

{"id":223,"cat":"老行当·手艺","theme":"补锅","img":"80年代乡村补锅摊，师傅拉风箱烧炉火，铁水在小坩埚里翻滚，他将铁水滴在锅底破洞处，用布垫抹平，青烟升起，围观的小孩瞪大眼睛，破锅堆在脚边。","vid":"铁水浇在破洞上滋滋冒烟，师傅快速抹平，镜头缓慢推近，火光映红笑脸。","copy":"铁水滴进锅底，青烟一冒就平了。锅补好了，日子也补出了一道道印。","tags":"#补锅 #乡愁记忆 #农村生活 #80年代 #童年 #上热门"},

{"id":225,"cat":"老行当·手艺","theme":"修伞","img":"80年代街边修伞摊，老师傅拆开破伞骨，换上新伞骨和伞面，铁丝绕紧，身旁堆着各色旧伞和工具，身后是灰砖墙，雨后天晴，阳光穿过晾开的伞面洒下光斑。","vid":"铁丝在伞骨间绕紧，伞面缓缓撑开，镜头环绕拍摄，雨后阳光在伞面上闪烁。","copy":"伞骨换新，铁丝绕紧，伞又撑开了。雨停了，修伞的摊也收了。","tags":"#修伞 #乡愁记忆 #80年代 #回忆 #上热门 #创作者分成计划"},
{"id":226,"cat":"老行当·手艺","theme":"修钢笔","img":"80年代文具店柜台前，师傅对着放大镜修理钢笔笔尖，镊子轻拨金尖，墨水瓶和零件摆满桌面，玻璃柜台下陈列着英雄钢笔，暖黄灯光笼罩小店。","vid":"镊子轻拨笔尖对准缝隙，镜头缓慢推近放大镜里的世界，灯光在笔尖泛光。","copy":"笔尖对正，墨就顺了。字都搬上了屏幕，笔尖的沙沙声谁还记得。","tags":"#修钢笔 #乡愁记忆 #80年代 #回忆 #上热门 #创作者分成计划"},
{"id":227,"cat":"老行当·手艺","theme":"修手表","img":"80年代钟表修理店，老师傅戴着眼罩镜低头修手表，镊子夹起细小零件放入表芯，桌上摊着精密工具和放大镜，玻璃柜台里陈列着手表，店内灯光昏黄温暖。","vid":"镊子夹起齿轮轻放入表芯，镜头极近特写再缓慢拉远，表针开始走动，灯光在金属件上闪烁。","copy":"镊子夹住齿轮，表针又走了。表走得准，修表的人却慢了。","tags":"#修手表 #乡愁记忆 #80年代 #回忆 #上热门"},
{"id":228,"cat":"老行当·手艺","theme":"修收音机","img":"80年代修理铺，师傅低头检修老式收音机，电烙铁点焊线路板，万用表测着元件，桌上堆着拆开的收音机、喇叭和天线，墙上挂着待修的收音机，白炽灯照亮桌面。","vid":"电烙铁冒出轻烟，焊点闪亮，镜头缓慢后拉，收音机里传出沙哑的广播声，灯光明灭。","copy":"旋钮一拧，滋滋声里蹦出人声。收音机修好了，凑在喇叭前的人，耳朵却背了。","tags":"#修收音机 #乡愁记忆 #80年代 #童年 #回忆 #上热门"},
{"id":229,"cat":"老行当·手艺","theme":"修自行车","img":"80年代街边修车摊，师傅蹲在倒立的自行车旁补胎，撬胎棒撬开外胎，锉刀打磨内胎，胶水涂上贴补丁，打气筒立在旁边，身后摆着工具箱和旧轮胎，午后阳光洒在柏油路上。","vid":"撬胎棒撬开外胎，补丁贴上内胎，打气筒压下打气，镜头缓慢移动，阳光在车圈上转动。","copy":"撬胎棒一撬，内胎露出来。补了又补的车，驮着全家人的年头。","tags":"#修自行车 #乡愁记忆 #80年代 #童年 #回忆 #上热门"},
{"id":230,"cat":"老行当·手艺","theme":"修锁配钥匙","img":"80年代小巷锁匠铺，师傅在砂轮前打磨钥匙坯，火花四溅，桌上堆着钥匙坯和锁具，墙上挂满钥匙串，柜台玻璃下摆着老式挂锁，昏黄灯光笼罩小铺。","vid":"钥匙坯在砂轮上磨出火花，镜头特写再拉至师傅眯眼试锁，火花在暗处闪烁。","copy":"钥匙坯在砂轮上嗤嗤冒火。钥匙能配，家门的锁却换了。","tags":"#修锁配钥匙 #乡愁记忆 #80年代 #回忆 #上热门"},
{"id":231,"cat":"老行当·手艺","theme":"货郎","img":"80年代乡村小路，货郎挑着担子摇着拨浪鼓走来，担子里装满针线、纽扣、糖果和杂货，孩子围在身后张望，土路两旁是稻田和土房，阳光明媚。","vid":"拨浪鼓摇响，货郎挑担走来，孩子跑上前围观，镜头跟随前行，阳光在担子上跳跃。","copy":"拨浪鼓一摇，担子一放，孩子围一圈。货郎挑走的是货，留下的是念想。","tags":"#货郎 #乡愁记忆 #农村生活 #童年 #80年代 #回忆"},
{"id":232,"cat":"老行当·手艺","theme":"卖糖葫芦","img":"80年代街头，小贩扛着插满糖葫芦的草靶子叫卖，红亮的山楂裹着糖衣在阳光下闪光，孩子们围着踮脚张望，身后是青砖店铺和自行车流，冬日暖阳。","vid":"糖葫芦在阳光下晶莹闪光，镜头缓慢推近，孩子踮脚伸手，糖衣折射出光点。","copy":"冰糖葫芦嘞——山楂红得发亮。我咬一口，酸酸甜甜，全是那个冬天的味。","tags":"#卖糖葫芦 #乡愁记忆 #童年 #80年代 #回忆 #上热门"},
{"id":233,"cat":"老行当·手艺","theme":"吹糖人","img":"80年代庙会角落，艺人从热锅里揪出糖稀，边吹边捏，糖泡在指尖鼓起变出小马小狗，孩子们围成一圈目不转睛，糖锅冒着热气，背景是热闹的庙会人潮。","vid":"糖稀在艺人指间鼓起变圆，吹出小动物的形状，镜头缓慢推进，热气在光中升腾。","copy":"一口气，糖泡鼓起来，小马就成了。糖人舍不得咬，最后化在舌尖。","tags":"#吹糖人 #乡愁记忆 #童年 #80年代 #回忆 #上热门"},
{"id":234,"cat":"老行当·手艺","theme":"捏面人","img":"80年代集市，艺人指尖揉捏彩色面团，孙悟空在手中逐渐成型，关羽的胡须根根分明，摊前围满大人小孩，彩色面团摆满木盒，午后阳光明亮。","vid":"彩面在指尖揉搓捏塑，孙悟空渐成型，镜头缓慢后拉展现围观的孩童，阳光在彩面上泛光。","copy":"彩面一揉，孙悟空踩着筋斗云。面人揣兜里化了，看捏面人的日子也化了。","tags":"#捏面人 #乡愁记忆 #童年 #80年代 #回忆 #上热门"},
{"id":235,"cat":"老行当·手艺","theme":"画糖画","img":"80年代街头，艺人手持铜勺舀起糖浆，手腕轻转在石板上画出龙和凤，糖丝流畅如墨，围观的孩子屏住呼吸，竹签一压一铲，糖画成型，阳光照在糖画上闪闪发光。","vid":"糖浆从勺尖流出画成龙形，镜头跟随勺尖游走，竹签压上铲起，糖画在光中闪亮。","copy":"勺子一提，糖丝画出条龙。糖画脆，一碰就碎，像极了童年。","tags":"#画糖画 #乡愁记忆 #童年 #80年代 #回忆 #上热门"},
{"id":236,"cat":"老行当·手艺","theme":"做棉花糖","img":"80年代庙会，棉花糖机嗡嗡转动，师傅用竹签在糖丝中旋转缠绕，雪白的糖丝越缠越大像云朵，孩子仰头等着，机器上方糖丝飘舞，阳光透亮。","vid":"糖丝在机器里飞出缠绕成云朵，竹签旋转越缠越大，镜头缓慢推近，糖丝在光中发光。","copy":"竹签一转，糖丝缠成云。云吃进嘴里就没了，那口甜却记了一辈子。","tags":"#做棉花糖 #乡愁记忆 #童年 #80年代 #回忆 #上热门"},
{"id":237,"cat":"老行当·手艺","theme":"卖冰棍","img":"80年代夏天，小贩推着白色冰棍箱，盖着棉被，孩子围着递上毛票，箱上写着冰棍二字，蝉鸣声里，树荫下的土路泛着白光，老冰棍冒着冷气。","vid":"掀开棉被拿出冰棍，孩子接过撕纸咬一口，镜头缓慢推近，冷气在热浪中升腾。","copy":"五分钱一根，棉被掀开直冒凉气。冰棍化了，夏天也没了。","tags":"#卖冰棍 #乡愁记忆 #童年 #80年代 #回忆 #上热门"},
{"id":238,"cat":"老行当·手艺","theme":"卖汽水","img":"80年代小卖部门口，大木箱里汽水瓶泡在冰块中，老板开瓶汽水滋滋冒泡，孩子举着玻璃瓶仰头喝，身后是斑驳的柜台和老式冰柜，夏日午后阳光刺眼。","vid":"瓶盖撬开汽水冒泡，孩子仰头畅饮，镜头缓慢拉远，气泡在光中上浮。","copy":"瓶盖一启，滋儿一声，气泡往上蹿。玻璃瓶收回去了，青春也没收走了。","tags":"#卖汽水 #乡愁记忆 #童年 #80年代 #回忆 #上热门"},
{"id":239,"cat":"老行当·手艺","theme":"卖豆腐脑","img":"80年代清晨街口，小贩揭开木桶盖，白嫩的豆腐脑冒着热气，浇上卤汁撒上香菜葱花，食客坐在矮凳上捧着碗，蒸汽袅袅，晨光洒在青石板路上。","vid":"木桶盖揭开蒸汽升腾，卤汁浇上豆腐脑，镜头缓慢推近，晨光穿过蒸汽成光束。","copy":"木桶盖一掀，白嫩嫩冒着热气。浇上卤汁，烫得我直吸溜，可还是放不下碗。","tags":"#卖豆腐脑 #乡愁记忆 #80年代 #童年 #回忆 #上热门"},

{"id":247,"cat":"老行当·手艺","theme":"耍猴人","img":"80年代村口，耍猴人敲锣，小猴穿着红衣翻跟头、作揖讨钱，围观的孩子笑作一团，猴子脖上系着铃铛，尘土飞扬的土场，午后阳光刺眼。","vid":"小猴翻跟头作揖，锣声当当，镜头缓慢跟随猴子的动作，铃铛在光中晃动。","copy":"锣一敲，猴儿翻跟头作揖。猴儿老了，耍猴的也走不动了。","tags":"#耍猴人 #乡愁记忆 #农村生活 #童年 #80年代 #回忆"},

{"id":249,"cat":"老行当·手艺","theme":"放风筝人","img":"80年代早春田野，老人牵着风筝线奔跑，老鹰风筝在蓝天中扶摇直上，麦田返青，身后是土房村庄，孩子们仰头欢呼，阳光和煦，春风拂动衣角。","vid":"风筝线在手中一收一放，老鹰风筝越飞越高，镜头缓慢上摇追随风筝，光在纸面闪动。","copy":"线一收一放，老鹰飞上天。风筝落了地，牵线的手也不在了。","tags":"#放风筝人 #乡愁记忆 #农村生活 #童年 #80年代 #回忆"},
{"id":250,"cat":"老行当·手艺","theme":"庙会艺人","img":"80年代庙会全景，戏台、杂耍、小吃摊连成一片，红灯笼高挂，人流熙攘，糖画和面人摊前挤满孩子，香火与炊烟升腾，午后阳光热烈，尘土中透出喜庆。","vid":"镜头缓慢横移扫过庙会全景，人流涌动，灯笼晃动，炊烟在光中升腾。","copy":"红灯笼一挂，庙会就开了。人挤人的热闹，只剩照片里的影。","tags":"#庙会艺人 #乡愁记忆 #农村生活 #童年 #80年代 #回忆"},
{"id":251,"cat":"老行当·手艺","theme":"打鱼人","img":"80年代清晨河面，渔夫划着小木船撒网，晨雾弥漫，渔网在空中张开如伞落入水面，船舱里鱼儿跳跃，远处水田与村庄朦胧，朝霞染红水面。","vid":"渔网在空中展开落入水中，涟漪扩散，镜头缓慢后拉，晨雾中光晕柔和。","copy":"撒网落水，一圈圈涟漪。鱼少了，网也懒得撒了。","tags":"#打鱼人 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":252,"cat":"老行当·手艺","theme":"撒网人","img":"80年代水库边，渔夫立船头双手抛撒旋网，网衣如圆伞在空中铺展，晨光穿透网眼洒下细碎光影，水面波光粼粼，岸边芦苇摇曳，远处青山如黛。","vid":"旋网在头顶旋转抛出如圆伞展开，镜头缓慢后拉，网眼透光如星点，水面波光流动。","copy":"网撒成圆，像朵花落进水面。收起来空空的，日子也是这样。","tags":"#撒网人 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":253,"cat":"老行当·手艺","theme":"放牛娃","img":"80年代田野，少年骑在牛背上吹着竹笛，老黄牛悠闲踱步，牛绳拖地，田埂边野花盛开，远处村庄炊烟袅袅，夕阳把人和牛拉出长长的影子。","vid":"牛背上的少年吹笛，老牛慢悠悠走，镜头缓慢横移跟随，夕阳金光在稻浪上流动。","copy":"牛背上一坐，笛声就飘了。牛进了圈，娃进了城。","tags":"#放牛娃 #乡愁记忆 #农村生活 #童年 #80年代 #回忆"},
{"id":254,"cat":"老行当·手艺","theme":"牧羊人","img":"80年代山坡上，牧羊人挥着羊鞭，羊群如白云般漫过草坡，牧羊犬跑前跑后，远处山峦连绵，白云蓝天，午后阳光明媚，尘土在羊群后扬起。","vid":"羊群漫过山坡，牧羊犬圈赶羊只，镜头缓慢上摇，阳光在羊毛上泛光。","copy":"羊鞭一甩，白云漫过山坡。羊群散尽，山坡上的风还在吹。","tags":"#牧羊人 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":255,"cat":"老行当·手艺","theme":"赶鸭人","img":"80年代水田边，赶鸭人挥舞竹竿，鸭群嘎嘎叫着扑棱下水，水面激起水花，晨雾尚未散尽，村舍炊烟升起，柔和的晨光照亮湿漉漉的田埂。","vid":"鸭群扑棱着翅膀冲下水，水花四溅，镜头跟随竹竿移动，晨光在水面碎成金点。","copy":"竹竿一挥，鸭子扑棱棱下水。嘎嘎声远了，田埂也荒了。","tags":"#赶鸭人 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":256,"cat":"老行当·手艺","theme":"养蜂人","img":"80年代山脚蜂场，养蜂人戴纱帽揭开蜂箱，蜜蜂嗡嗡飞出，巢脾上蜂蜜金黄流淌，他摇动取蜜机，金色蜜汁飞溅，阳光穿过蜂群形成光带。","vid":"蜂箱揭开蜜蜂涌出，巢脾转动蜜汁甩出，镜头缓慢推近，金色蜜光在光带中闪动。","copy":"追着花开走，蜜蜂嗡嗡跟着。蜜是甜的，追花的路是苦的。","tags":"#养蜂人 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":257,"cat":"老行当·手艺","theme":"养蚕人","img":"80年代蚕房，蚕匾上白胖的蚕宝宝啃着桑叶沙沙作响，养蚕人撒着桑叶，墙上贴着红纸，桑叶堆在竹筐里，昏黄灯光下蚕房安静温暖。","vid":"桑叶撒下蚕群蠕动啃食，镜头缓慢推近蚕匾，沙沙声里光线柔和温暖。","copy":"桑叶一撒，沙沙声铺满蚕匾。丝抽尽了，蚕也累得睡了。","tags":"#养蚕人 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":258,"cat":"老行当·手艺","theme":"缫丝人","img":"80年代缫丝作坊，农妇坐在热气腾腾的锅边，从蚕茧中抽出银丝绕上丝车，茧子在沸水中翻滚，木盆里茧堆如雪，水汽氤氲，阳光透过窗棂照进作坊。","vid":"银丝如缕从蚕茧中抽出绕上丝车，镜头缓慢推近，水汽在光束中升腾。","copy":"手在沸水里一捞，银丝就出来了。丝滑如绸，手却粗糙得像树皮。","tags":"#缫丝人 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":259,"cat":"老行当·手艺","theme":"采茶人","img":"80年代晨雾茶园，采茶女挎着竹篓手指轻掐嫩芽，一芽一叶落入篓中，茶园如绿色阶梯层层叠叠，远处青山云雾缭绕，清晨柔光洒在茶垄上。","vid":"指尖轻掐嫩芽落入竹篓，镜头缓慢横移过茶垄，露珠闪烁，晨雾在光中流动。","copy":"指尖一掐，一芽一叶入篓。茶香淡了，采茶的人上了年纪。","tags":"#采茶人 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":260,"cat":"老行当·手艺","theme":"挖藕人","img":"80年代深秋藕塘，挖藕人弯腰在泥水中摸索，双手从淤泥里拔出白嫩的莲藕，身上泥渍斑斑，塘面残荷立着，远处村庄朦胧，斜阳洒在泥水上。","vid":"双手从淤泥中拔出莲藕，水花溅起，镜头缓慢后拉，斜阳在水面拉出金光。","copy":"手往泥里一探，藕就拔出来了。藕白如玉，人却泥一身汗一身。","tags":"#挖藕人 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":261,"cat":"老行当·手艺","theme":"榨油师傅","img":"80年代油坊，师傅推动粗重的木楔榨油，油槽里金黄菜籽油汩汩流出，油饼摞成堆，炒香的菜籽冒着热气，油坊里油香弥漫，昏黄灯光照在木榨上。","vid":"木楔砸下油槽流出金黄油脂，镜头缓慢推近油流，热气在光中升腾。","copy":"木楔一砸，金油汩汩地流。油坊关了，那香还绕在梁上。","tags":"#榨油师傅 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":262,"cat":"老行当·手艺","theme":"磨豆腐","img":"80年代豆腐坊，石磨转动豆浆从磨缝流出，师傅推磨添豆，灶上大锅煮着豆浆热气腾腾，豆香弥漫，木桶和纱布摆在一旁，晨光透进作坊。","vid":"石磨转动豆浆流出，师傅添豆推磨，镜头缓慢横移，热气在晨光中升腾。","copy":"石磨一转，豆浆白花花地淌。豆腐脑嫩，做豆腐的手却糙了。","tags":"#磨豆腐 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":263,"cat":"老行当·手艺","theme":"做粉条","img":"80年代农家院，漏粉师傅端瓢在滚水锅上漏粉条，粉条如线入锅翻滚，捞起晾在竹竿上，院子里挂满粉条，热气蒸腾，冬日暖阳晒着。","vid":"粉浆从瓢眼漏入滚水，粉条翻煮捞出晾竿，镜头缓慢横移过满院粉条，热气升腾。","copy":"瓢眼一漏，粉条像线坠进滚水。捞起来晒一竿，那是年的排面。","tags":"#做粉条 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":264,"cat":"老行当·手艺","theme":"做挂面","img":"80年代农家院，细如银丝的挂面挂满晾架，在风中轻轻飘动，做面师傅抬头整理面线，面粉簌簌落下，阳光透过面丝洒下细碎光影，背景土墙老屋。","vid":"挂面在风中轻摆，师傅整理面线，镜头缓慢上摇，阳光穿透面丝形成光帘。","copy":"面丝细如发，挂满一院子。风一吹，麦香就钻进鼻子。","tags":"#做挂面 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":265,"cat":"老行当·手艺","theme":"蒸馒头","img":"80年代农家厨房，大铁锅盖揭开蒸汽扑面，白胖馒头挤在笼屉里，主妇双手沾满面粉，灶膛柴火正旺，窗户上蒙着白汽，冬日暖光从门缝透入。","vid":"锅盖揭开蒸汽喷涌，馒头白胖喧腾，镜头缓慢推近，蒸汽在光中翻涌。","copy":"锅盖一掀，白汽扑脸，馒头胖乎乎的。咬一口喧腾，那是娘给的底气。","tags":"#蒸馒头 #乡愁记忆 #农村生活 #80年代 #童年 #回忆"},
{"id":266,"cat":"老行当·手艺","theme":"烙饼","img":"80年代农家灶台，主妇把擀好的面饼贴上烧热的鏊子，面饼鼓起气泡，烙出焦黄斑点，烙好的饼摞在盆里冒着热气，灶火映红脸庞，油灯昏黄。","vid":"面饼贴上鏊子鼓起气泡，翻面烙出焦黄，镜头缓慢推近，热气在火光中升腾。","copy":"鏊子一热，饼鼓起泡。卷根大葱，咬着咬着，人就大了。","tags":"#烙饼 #乡愁记忆 #农村生活 #80年代 #童年 #回忆"},
{"id":267,"cat":"老行当·手艺","theme":"擀面条","img":"80年代农家厨房，主妇弯腰在案板上擀面，擀面杖来回滚动，面片越擀越大越薄，撒上面粉叠起切条，面条切得均匀细长，案板边撒着面粉，暖光从窗户照进。","vid":"擀面杖来回滚动面片变薄，刀起刀落切出细面，镜头缓慢横移，面粉在光中飘落。","copy":"擀面杖一滚，面片薄得透光。切得细细的，下锅一滚，是家的味道。","tags":"#擀面条 #乡愁记忆 #农村生活 #80年代 #童年 #回忆"},
{"id":268,"cat":"老行当·手艺","theme":"包饺子","img":"80年代除夕夜，一家人围坐包饺子，老人擀皮，大人捏馅，小孩偷偷往饺子里塞硬币，桌上摆满白胖饺子，窗外飘着雪，屋内灯光暖黄温馨。","vid":"手指捏紧饺子边，饺子一个个摆上盖帘，镜头缓慢横移，窗外雪花与屋内暖光相映。","copy":"手指一捏，元宝就成了。硬币硌牙的那口，是年的彩头。","tags":"#包饺子 #乡愁记忆 #农村生活 #童年 #80年代 #回忆"},
{"id":269,"cat":"老行当·手艺","theme":"做年糕","img":"80年代腊月农家，蒸笼里糯米冒着热气，壮汉抡起木槌捶打石臼里的糯米团，年糕渐渐成形，旁边妇女忙着搓团，孩子们围着看，灶火旺，蒸汽腾。","vid":"木槌起落捶打糯米团，年糕渐渐成形，镜头缓慢推近，蒸汽在光中翻涌。","copy":"木槌一落，糯米黏成团。年糕年年做，做年糕的人却一年年老。","tags":"#做年糕 #乡愁记忆 #农村生活 #80年代 #童年 #回忆"},
{"id":270,"cat":"老行当·手艺","theme":"打糍粑","img":"80年代农家院，两个壮汉抡木槌轮流捶打石臼中的糯米，糍粑黏软拉丝，妇女在旁边蘸水翻团，孩子们端着碗等着分食，冬日阳光暖暖，热气升腾。","vid":"木槌交替捶打糯米，糍粑拉出黏丝，镜头缓慢横移，热气在冬日阳光中升腾。","copy":"木槌你一槌我一槌，糍粑拉出丝。黏住的是年，散不去的也是年。","tags":"#打糍粑 #乡愁记忆 #农村生活 #80年代 #童年 #回忆"},
{"id":271,"cat":"老行当·手艺","theme":"杀猪匠","img":"80年代腊月农家院，杀猪匠与众人按猪上案，大锅烧着热水冒着蒸汽，院里围满看热闹的乡亲和孩子，红对联贴上门框，年味十足，冬日阳光明亮。","vid":"众人合力抬猪上案，热水蒸汽翻涌，镜头缓慢后拉展现热闹场面，光在蒸汽中散开。","copy":"腊月一声嚎，年就有着落了。肉随时能买，那股子年味却攒不起来。","tags":"#杀猪匠 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":272,"cat":"老行当·手艺","theme":"卖猪肉","img":"80年代集市肉摊，屠户挥刀剁肉，案板上摆满新鲜猪肉，秤砣高高翘起，顾客围在摊前挑肉，肉钩上挂着肉条，集市人声鼎沸，晨光洒在摊位上。","vid":"屠户挥刀剁肉，秤砣起落，镜头缓慢横移过肉摊，晨光在油亮的肉面上泛光。","copy":"刀起刀落，秤杆翘得高高的。膘肥的肉，是全家打牙祭的盼头。","tags":"#卖猪肉 #乡愁记忆 #80年代 #回忆 #上热门 #创作者分成计划"},

{"id":274,"cat":"老行当·手艺","theme":"卖菜","img":"80年代清晨菜市，菜农挑着两筐带露水的青菜摆摊，黄瓜西红柿码得整齐，讨价还价声此起彼伏，秤杆挑起，晨光洒在翠绿的菜叶上。","vid":"菜农摘下带露的青菜上秤，镜头缓慢横移过摊位，晨光在露珠上闪光。","copy":"菜担一放，露水还挂着。讨价还价里，藏着日子的精打细算。","tags":"#卖菜 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},

{"id":277,"cat":"老行当·手艺","theme":"掏粪工","img":"80年代清晨，掏粪工推着粪车穿巷，手里拿着粪勺和木桶，沿街收集粪肥，戴着草帽穿着旧衣，土路上尘土轻扬，晨光熹微，背景是土墙院落。","vid":"粪车沿巷推行，粪勺起落木桶轻晃，镜头缓慢跟随，晨雾中身影渐远。","copy":"粪车一过，巷子就醒了。脏了自己，绿了庄稼，也养了一代人。","tags":"#掏粪工 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":278,"cat":"老行当·手艺","theme":"扫街人","img":"80年代清晨街道，清洁工挥着大竹扫帚扫街，落叶和纸屑聚成堆，身后是干净的青石板路，两旁店铺还未开门，晨光洒下，他穿着蓝布工装戴着草帽。","vid":"大竹扫帚扫过路面，落叶聚拢，镜头缓慢横移，晨光在扫帚起落间流转。","copy":"扫帚一响，落叶聚成堆。街面干净了，他的背影也弯了。","tags":"#扫街人 #乡愁记忆 #80年代 #回忆 #上热门 #创作者分成计划"},

{"id":280,"cat":"老行当·手艺","theme":"放电影人","img":"80年代乡村晒场，放映员架起电影幕布，胶片放映机哒哒转动，光柱投射到幕布上，幕布前坐满小板凳上的村民，孩子们在银幕前跑来跑去，夏夜星空下灯火微明。","vid":"放映机光柱投射幕布，人物剪影在光中晃动，镜头缓慢后拉展现满场观众，光柱中浮尘飘动。","copy":"光柱一打，幕布就活了。放映机歇了，看露天电影的娃都大了。","tags":"#放电影人 #乡愁记忆 #农村生活 #童年 #80年代 #回忆"},

{"id":282,"cat":"老行当·手艺","theme":"送报员","img":"80年代清晨街头，送报员骑着自行车挨家投递报纸，报纸卷成一卷扔进院门，车筐里装满当天的报纸，晨雾中街道空旷，路灯还亮着，晨光渐明。","vid":"报纸卷从手中飞出落进院门，自行车前行，镜头缓慢跟随，晨光在报纸上泛白。","copy":"报纸卷一扔，稳稳落进院。油墨香散了，手机屏幕却亮了一夜。","tags":"#送报员 #乡愁记忆 #80年代 #回忆 #上热门 #创作者分成计划"},

{"id":290,"cat":"老行当·手艺","theme":"打谷师傅","img":"80年代秋收打谷场，师傅抱着稻把在打谷桶上摔打，谷粒四溅飞落桶中，晒场上铺满金黄稻谷，人挑着稻把往来，秋阳高照，谷尘在光中飞扬。","vid":"稻把摔上打谷桶谷粒飞溅，镜头缓慢横移过晒场，谷尘在阳光中飞扬。","copy":"稻把一摔，谷粒蹦满桶。一年的汗，都换成了金黄的堆。","tags":"#打谷师傅 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},

{"id":292,"cat":"老行当·手艺","theme":"碾米工","img":"80年代碾米房，碾米机轰鸣，稻谷从漏斗流下，白米从出口哗哗涌出，米糠扬起，师傅蹲在机器边接米，房里光线昏暗，灰尘在光束中飞舞。","vid":"白米从机器出口涌出，师傅伸手接米，镜头缓慢推近，米尘在光束中飞舞。","copy":"机器一吼，白米哗哗涌。米缸满了，碾米房的门却关上了。","tags":"#碾米工 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":293,"cat":"老行当·手艺","theme":"磨面工","img":"80年代磨坊，毛驴拉着石磨转圈，麦粒在磨缝间磨成面粉，罗面柜筛着细面，磨面师傅弯腰添麦收面，面粉沾满衣襟，昏暗磨坊里阳光从门缝射入。","vid":"石磨转动麦粒磨碎，罗面柜筛出细面，镜头缓慢横移，粉尘在光束中浮动。","copy":"驴转圈，磨盘响，面簌簌地筛。面白了，麦子的香却少了。","tags":"#磨面工 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":294,"cat":"老行当·手艺","theme":"榨糖","img":"80年代甘蔗地旁，榨糖师傅推动石碾压榨甘蔗，蔗汁顺着槽沟流进木桶，大锅熬糖冒泡翻滚，糖浆色泽金黄，热气升腾，甘蔗堆成小山，阳光炽热。","vid":"石碾压过甘蔗汁水流出，大锅糖浆翻滚冒泡，镜头缓慢推近，热气在光中升腾。","copy":"石碾一滚，蔗汁淌进桶。糖熬得金黄，甜了一辈子的馋。","tags":"#榨糖 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":295,"cat":"老行当·手艺","theme":"做酱","img":"80年代农家院，酱缸一字排开，酱耙在缸中搅动，黄豆酱在烈日下晒得红亮，主妇掀开盖布查看，酱香弥漫小院，阳光强烈，土墙投下阴影。","vid":"酱耙搅动酱缸，酱面泛起光泽，镜头缓慢横移过一排酱缸，阳光在酱面上闪光。","copy":"酱耙一搅，酱面泛起油光。三伏天的太阳，晒出了一年的咸香。","tags":"#做酱 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":296,"cat":"老行当·手艺","theme":"腌咸菜","img":"80年代农家院，主妇把白菜萝卜码进大缸，撒盐压实，石头压顶，旁边堆着青菜和盐袋，秋阳下院子里晒着半干的菜，土墙上挂着辣椒串。","vid":"白菜入缸撒盐压实，石头压上缸口，镜头缓慢横移，秋光在菜叶上泛光。","copy":"白菜码进缸，石头压住。一冬的寡淡，靠这一缸撑着。","tags":"#腌咸菜 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":297,"cat":"老行当·手艺","theme":"做豆豉","img":"80年代农家院，簸箕里铺着发酵的黄豆，长满白色菌丝，主妇翻拌豆豉，旁边摆着坛子，墙角晒着辣椒和姜片，午后阳光洒在豆子上。","vid":"主妇翻拌发酵的黄豆，镜头缓慢推近豆粒，热气中豆香若隐若现，阳光在菌丝上泛光。","copy":"豆子发了霉，反倒成了香。时间这东西，最会变废为宝。","tags":"#做豆豉 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":298,"cat":"老行当·手艺","theme":"做豆瓣酱","img":"80年代农家院，大缸里豆瓣酱在烈日下翻晒，主妇用木耙搅动，红亮的豆瓣酱冒着油光，辣椒碎铺在晒席上，墙根摆满酱坛，阳光炽热强烈。","vid":"木耙搅动红亮豆瓣酱，油光闪动，镜头缓慢横移，热浪在光中扭曲。","copy":"辣椒一剁，豆瓣酱红得发亮。回锅肉一勺，饭就能多扒两碗。","tags":"#做豆瓣酱 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":299,"cat":"老行当·手艺","theme":"酿米酒","img":"80年代农家厨房，酒坛盖上棉被，主妇掀开坛盖，米酒香气扑面，糯米在坛中发酵出水，旁边摆着酒碗和蒸好的糯米，灶火余温，昏黄灯光暖人。","vid":"坛盖揭开酒香雾气升腾，主妇舀起米酒，镜头缓慢推近，雾气在光中飘散。","copy":"坛盖一掀，酒香扑鼻。甜酒酿冲鸡蛋，是病里最惦记的一口。","tags":"#酿米酒 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},
{"id":300,"cat":"老行当·手艺","theme":"织渔网","img":"80年代渔村屋檐下，老人坐在矮凳上织渔网，梭子带着网线在网格间穿梭打结，网坠垂在脚边，身旁放着线团和梭子，海风吹来，远处渔船桅杆林立。","vid":"梭子穿线打结，网眼一排排成形，镜头缓慢横移，海风拂动网线，光影轻晃。","copy":"梭子一穿，网眼就密了。网补了又补，出海的人越来越稀。","tags":"#织渔网 #乡愁记忆 #农村生活 #80年代 #回忆 #上热门"},{"id":301,"cat":"童年游戏·玩具","theme":"滚铁环","img":"80年代乡村土路上，男孩手握铁钩推着铁环奔跑，铁环发出叮铃叮铃的响声，路边杨树成行，他穿白背心蓝短裤，汗珠挂在额头，夕阳把人和铁环的影子拉得很长，土路扬起细尘。","vid":"镜头从侧面横移跟随奔跑的男孩，铁钩推着铁环滚动，铁环磕到石子蹦跳一下又稳住，夕阳金光在铁环上流转，身后扬起尘烟。","copy":"铁钩一响，叮铃叮铃，全村就我跑得最欢。现在玩具满地，再听不到那声脆响了。","tags":"#滚铁环 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":302,"cat":"童年游戏·玩具","theme":"跳皮筋","img":"80年代老槐树下，三个女孩在跳皮筋，一个扎着羊角辫的女孩绷着腿跳过橡皮筋，皮筋挂在两个女孩的脚踝上，旁边放着书包，午后的阳光透过树叶洒下斑驳光点，地上有粉笔画的白线。","vid":"镜头低角度仰拍女孩腾空跳起的瞬间，皮筋在阳光下微微弹动，裙摆扬起，树影在同伴们脚下晃动，拍手声伴着哼唱。","copy":"皮筋越绷越高，辫子甩成了花。那根皮筋如今还在抽屉里，却再绷不起当年的劲了。","tags":"#跳皮筋 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":303,"cat":"童年游戏·玩具","theme":"跳房子","img":"80年代学校操场上，女孩用粉笔在地上画出格子房子，单脚跳着踢沙包过格，她扎着马尾，穿着花裙子，旁边几个孩子蹲着围观，红砖教学楼在背景里，阳光把地面照得发白。","vid":"镜头从地面粉笔格子缓缓上摇，女孩单脚跳格子踢沙包，落地站稳，她回头一笑，光斑在她脚边跳动。","copy":"粉笔画出的小房子，单脚跳过去又跳回来。现在地板光溜得晃眼，格子早被擦得干干净净。","tags":"#跳房子 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":304,"cat":"童年游戏·玩具","theme":"踢毽子","img":"80年代农家院坝里，女孩脚背一勾把鸡毛毽子踢上头顶，毽子上的铜钱叮当响，红鸡毛在阳光下发亮，她穿红棉袄扎着两个小辫，身旁姐妹拍手数数，土墙老屋为背景。","vid":"特写毽子在空中翻转落下，女孩脚背稳稳接住再踢起，鸡毛在逆光中透亮，她咧嘴笑，阳光在鸡毛上跳跃。","copy":"毽子一起一落，铜钱叮当响，红毛在风里翻个身。现在想再踢一回，腿却抬不到那个高度了。","tags":"#踢毽子 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":305,"cat":"童年游戏·玩具","theme":"丢沙包","img":"80年代放学后的晒谷场上，男孩女孩分成两拨丢沙包，中间的孩子左躲右闪跳起接包，沙包在阳光下飞过，穿军绿上衣的男孩侧身躲开，晒谷场边堆着麦垛，黄昏光线金黄。","vid":"镜头跟随沙包飞行的弧线快速移动，中间的孩子侧身跳起躲包，沙包砸地扬起尘土，他得意一笑，夕阳在麦垛间拉出长影。","copy":"沙包砸过来，侧身一躲就是一条命。那兜沙包早散了，接它的人也不在一处了。","tags":"#丢沙包 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":306,"cat":"童年游戏·玩具","theme":"弹玻璃球","img":"80年代教室后的泥地上，两个男孩趴在地上弹玻璃球，指头一弹，彩色的琉璃球滚进小坑，球里嵌着彩色的花瓣，旁边蹲着围观的伙伴，破旧教室的墙根下，阳光刺眼。","vid":"镜头极低角度贴近地面，男孩手指弹出玻璃球，彩球滚动撞上另一颗发出脆响，阳光在琉璃球里折射出光斑，他捏起赢的球。","copy":"趴在地上，拇指一弹，琉璃球滴溜溜滚进坑。球还在盒里躺着，手指头已经不听使唤。","tags":"#弹玻璃球 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":307,"cat":"童年游戏·玩具","theme":"抽陀螺","img":"80年代冬天的村口，男孩挥鞭抽打旋转的陀螺，陀螺在冰面上嗡嗡转动，鞭子抽得脆响，他穿棉袄戴棉帽，鼻尖冻得发红，旁边几个孩子哈着白气围观，老屋墙根下积雪未化。","vid":"特写鞭子抽在陀螺上，陀螺加速旋转嗡嗡作响，男孩搓手哈气又追抽一鞭，白气在冷光中升腾，冰面反着天光。","copy":"鞭子一甩，陀螺嗡嗡地转，冰面上白气直冒。鞭子还在墙上挂着，可没人追着抽了。","tags":"#抽陀螺 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":308,"cat":"童年游戏·玩具","theme":"翻花绳","img":"80年代午后教室的课桌前，两个女孩面对面翻花绳，红毛线在两人手指间变成降落伞的形状，一个女孩歪头端详，阳光从窗户斜照进来，把毛线染成金色，桌面上摊着课本和铅笔盒。","vid":"特写手指挑起毛线翻出新花样，花绳在指尖变形展开，女孩相视一笑，金色光线在毛线上缓缓流动。","copy":"红毛线在指间绕几绕，降落伞就撑开了。对面的人换了，绳也编不成花了。","tags":"#翻花绳 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":309,"cat":"童年游戏·玩具","theme":"捉迷藏","img":"80年代傍晚的村子里，一个男孩蹲在麦垛后捂住嘴偷笑，探出半个脑袋张望，远处几个孩子背对着数数，夕阳把麦垛染成金色，老槐树和土墙投下长长的影子，炊烟升起。","vid":"镜头从麦垛后缓慢探出，男孩探头张望又缩回去，远处数数的孩子转身跑来，金色夕阳在麦垛间流动，尘土微扬。","copy":"麦垛后头憋着气，脚步声近了又远。藏得再严实，也躲不过那句天黑了回家。","tags":"#捉迷藏 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":310,"cat":"童年游戏·玩具","theme":"老鹰抓小鸡","img":"80年代学校操场上，一个高个男孩张开双臂当老鹰，后面的孩子排成一串抓着前一个人的衣摆当小鸡，队伍左右甩动，扎辫子的女孩笑得露出酒窝，红砖墙背景，阳光明晃晃。","vid":"镜头从老鹰正面拍摄，孩子队伍左右甩动躲避，衣摆被拽得紧紧的，老鹰扑空，众人笑作一团，阳光在奔跑的脚步间闪动。","copy":"老鹰扑过来，一长串小鸡甩成了龙。衣摆揪得再紧，队伍也总有散开的一天。","tags":"#老鹰抓小鸡 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":311,"cat":"童年游戏·玩具","theme":"拍画片","img":"80年代小巷的青石板上，男孩蹲着用力拍打地上的画片，画片上印着变形金刚图案，拍起的风把画片掀翻，他卷起袖子露出晒黑的胳膊，旁边蹲着对手，老墙根下光线斜照。","vid":"镜头贴近石板低角度拍摄，男孩手掌拍下掀起画片翻转，尘土扬起，他捏起赢来的画片咧嘴笑，斜光在石板上游走。","copy":"画片在地上，巴掌一拍，翻过来就是赢。赢得再多，如今也提不起兴致了。","tags":"#拍画片 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":312,"cat":"童年游戏·玩具","theme":"打弹弓","img":"80年代村口的榆树下，男孩拉开弹弓瞄准树上的麻雀，皮筋绷得紧紧的，他眯着一只眼，口袋鼓鼓地装着石子，旁边伙伴仰头张望，树影斑驳，阳光透过枝叶洒下光点。","vid":"特写弹弓皮筋拉满，手指一松石子射出，树枝晃动惊起飞鸟，男孩失望地挠头，光斑在他脸上跳跃。","copy":"皮筋拉满，眯一只眼，瞄了半天也没打着。快乐不在准头上，在兜里那几颗石子。","tags":"#打弹弓 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":313,"cat":"童年游戏·玩具","theme":"打水漂","img":"80年代村边的小河边，男孩弯腰侧身把石片贴着水面甩出，石片在水面连跳五六下，溅起一串水花，他穿背心卷着裤腿，河面映着蓝天，岸边柳树垂下枝条，阳光在水面碎成金点。","vid":"镜头从水面低角度拍摄，石片贴着水面弹跳溅起水花，涟漪一圈圈扩散，男孩得意地叉腰，水花在阳光里闪亮。","copy":"石片贴着水面蹦，一蹦蹦了七八下。水花落尽，河还是那条河，人不是那拨人了。","tags":"#打水漂 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":314,"cat":"童年游戏·玩具","theme":"滚弹珠","img":"80年代课间操场上，男孩用大拇指把玻璃弹珠弹出，弹珠顺着土坡滚下钻进小洞，几个孩子趴在地上看，弹珠里嵌着蓝白花纹，土坡上划着线，阳光把弹珠照得透亮。","vid":"镜头贴地跟随弹珠滚动，弹珠滚下土坡撞进小洞，孩子们拍手欢呼，弹珠在逆光里透出花纹，尘土微扬。","copy":"弹珠顺着土坡滚，噗一声钻进小洞。现在看孩子玩电子游戏，总觉得少了点土腥味。","tags":"#滚弹珠 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":315,"cat":"童年游戏·玩具","theme":"跳大绳","img":"80年代课间操场上，两个女孩甩起长绳，跳绳的孩子鱼贯跳入，穿白衬衫的男孩跳起再跑出，绳子拍地啪啪响，周围围着一圈同学，红砖教学楼前，阳光把影子拉在水泥地上。","vid":"镜头正面拍摄，长绳甩出弧线，孩子们鱼贯跳进跳出，绳子拍地扬起灰尘，一个孩子绊住绳，众人哄笑，光影在绳影间明灭。","copy":"绳子甩得啪啪响，跳进去又钻出来。绊一跤就哄堂大笑，那会摔了也不觉得疼。","tags":"#跳大绳 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":316,"cat":"童年游戏·玩具","theme":"扔石子","img":"80年代河边浅滩，男孩弯腰捡起扁圆的石子，抡圆胳膊把石子扔向河心，石子落水溅起水花，水鸟惊飞，他光着脚踩在湿润的沙地上，河面波光粼粼，远山青翠。","vid":"镜头跟随石子飞行的弧线，石子落水溅起白色水花，水波扩散，男孩弯腰再捡一块比划，光线在水面闪动。","copy":"抡圆胳膊一甩，石子落水，扑通一声。水鸟惊了，童年也就飞远了。","tags":"#扔石子 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":317,"cat":"童年游戏·玩具","theme":"抓石子","img":"80年代教室的课桌上，女孩把五个小石子撒开，抓起一个抛起，手忙脚乱接住落下的石子，旁边趴着看的女孩托着腮，课桌磨得发亮，窗外阳光斜射进来，在桌面上投下影子。","vid":"特写女孩抛起石子又快速抓起桌上的石子，石子在指间翻飞，接住的一瞬她笑弯了眼，光线在桌面跳动。","copy":"五个石子抛起来，抓的抓，接的接，一错手就全散了。手一抖，满桌都是遗憾。","tags":"#抓石子 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":318,"cat":"童年游戏·玩具","theme":"摸瞎子","img":"80年代院子里，一个男孩蒙着眼罩张开双手摸索，其他孩子踮脚从他身边溜过，一个女孩捂着嘴偷笑，院里的老枣树挂满青枣，阳光透过树叶洒下光斑，土墙老屋为背景。","vid":"镜头从蒙眼男孩背后拍摄，他转身扑空，孩子们灵巧躲开，他摸到树干引起哄笑，树影在他脸上晃动。","copy":"眼睛蒙上，伸手摸，摸了半天摸到根晾衣绳。摘下眼罩那刻，院子还是那个院子。","tags":"#摸瞎子 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":319,"cat":"童年游戏·玩具","theme":"木头人","img":"80年代学校操场上，一个女孩回头喊口令，身后的孩子瞬间定住，摆出各种滑稽姿势，一个男孩单脚站立差点摔倒，红砖墙前，阳光把他们的影子拉在水泥地上。","vid":"镜头正面拍摄，口令一响孩子们瞬间定格，一个男孩晃动差点倒下又稳住，风吹动衣角，光影静止又流动。","copy":"一二三，木头人，谁动谁先出局。站着不动容易，笑着装没事最难。","tags":"#木头人 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":320,"cat":"童年游戏·玩具","theme":"过家家","img":"80年代农家院子里，两个小孩蹲在树荫下过家家，用瓦片当锅、树叶当菜、泥巴当饭，女孩假装炒菜，男孩假装吃饭，旁边摆着破碗和树枝，老母鸡在旁啄食，阳光斑驳。","vid":"镜头俯拍两个孩子的头顶，女孩用树枝翻炒瓦片里的树叶，男孩端起破碗假装吃得很香，树影在他们身上晃动。","copy":"瓦片当锅，树叶当菜，假装吃得喷香。后来真会过日子了，却再没那口热乎的假饭。","tags":"#过家家 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":321,"cat":"童年游戏·玩具","theme":"骑竹马","img":"80年代乡村土路上，男孩骑着一根竹竿满村跑，竹竿头绑着红缨穗，嘴里喊着驾驾，身后跟着一条黄狗，土路两旁是稻田，他穿蓝布衫，阳光把他的影子拉得很长。","vid":"镜头从男孩侧面跟随奔跑，竹竿上的红缨穗随风飘动，他扬手作挥鞭状，黄狗跑前跑后，阳光在尘土中闪耀。","copy":"竹竿夹在腿间，驾驾两声，满村都是我的江山。有车有房了，却骑不回那根竹竿了。","tags":"#骑竹马 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":322,"cat":"童年游戏·玩具","theme":"摔泥巴","img":"80年代雨后村口，几个光脚男孩蹲在泥塘边摔泥巴，把黄泥捏成碗状，用力倒扣在地上，啪一声炸开一个洞，泥点溅到脸上，他们哈哈大笑，土墙边积水映着天光。","vid":"镜头低角度贴近泥塘，男孩抡臂把泥碗摔在地上，泥巴炸开溅起泥点，他抹了把脸咧嘴笑，泥水在光线里反光。","copy":"黄泥捏成碗，倒扣一摔，啪，炸出个响洞。泥点溅上脸，笑弯了腰也擦不掉。","tags":"#摔泥巴 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":323,"cat":"童年游戏·玩具","theme":"捏泥人","img":"80年代农家院子的树荫下，男孩盘腿坐地捏泥人，捏出小人、小狗、小房子摆在石板上，手指上沾满黄泥，旁边放着一盆水和几块泥团，老猫趴在墙头，午后阳光斑驳。","vid":"镜头俯拍男孩的手，黄泥在指间被捏出形状，他把泥人摆在石板上，抬头露出满意的笑，光影在泥人上流转。","copy":"一团黄泥，捏出小狗小猫，排成一排晒太阳。泥人干了裂了，手艺也忘光了。","tags":"#捏泥人 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":324,"cat":"童年游戏·玩具","theme":"放风筝","img":"80年代早春的麦田里，男孩举着纸糊的老鹰风筝奔跑，风筝摇摇晃晃升上天空，线轴在手中飞速转动，他仰着头倒退着跑，麦苗返青，蓝天白云，春风把衣角吹得鼓起来。","vid":"镜头从风筝在空中摇摆的画面快速下摇到男孩仰头奔跑，线轴嗡嗡转动，他倒退几步稳住，阳光在风筝纸面上闪动。","copy":"纸糊的老鹰摇摇晃晃上了天，线轴嗡嗡转。风筝早不放了，天上的心气也收了。","tags":"#放风筝 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":325,"cat":"童年游戏·玩具","theme":"纸飞机","img":"80年代乡村小学的操场上，孩子们站在台阶上把纸飞机掷向天空，白色纸飞机在空中盘旋滑翔，穿蓝白校服的男孩踮脚目送，其他孩子欢呼，红砖教室和旗杆在背景里，阳光明媚。","vid":"镜头从纸飞机特写拉起，纸飞机盘旋滑翔掠过孩子们头顶，他们跳起来追，纸翼在逆光里泛白，笑声四起。","copy":"哈一口气，纸飞机嗖地飞出去，栽进教室后头。飞得再远，也飞不出那间土教室。","tags":"#纸飞机 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":326,"cat":"童年游戏·玩具","theme":"纸船","img":"80年代雨后的小水沟边，男孩蹲着把折好的纸船放进水面，纸船顺水漂流，他跟着小船小跑，水沟倒映着天空和土墙，岸边青草挂着水珠，雨后阳光清新明亮。","vid":"镜头贴水拍摄纸船漂流，水波轻轻推动纸船，男孩蹲在岸边用手拨水，纸船转了个弯，光影在水面晃动。","copy":"纸船放进水沟，晃晃悠悠出发了。船漂到哪算哪，我们那时候也这样想。","tags":"#纸船 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":327,"cat":"童年游戏·玩具","theme":"折纸","img":"80年代课间教室里，女孩低头认真地折纸鹤，彩纸在她指间翻转，桌上摆着一排折好的纸鹤和小青蛙，同桌托腮看着，阳光从木窗斜照在课桌上，纸鹤投下影子。","vid":"特写彩纸在指间折叠翻转，纸鹤逐渐成型，女孩用笔杆压平折痕，抬头一笑，光线在彩纸上流转。","copy":"彩纸对折几下，纸鹤就立起来了。折来折去，总折不出当年的模样。","tags":"#折纸 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":328,"cat":"童年游戏·玩具","theme":"挑棍儿","img":"80年代傍晚的门口，男孩蹲在地上挑冰棍棍儿，手里攥着一根，屏住呼吸慢慢挑起一根，不能碰到别的，旁边坐着对手，门楼下的阴影里，夕阳斜照在棍堆上。","vid":"镜头俯拍地上的棍儿堆，男孩屏息挑出一根又一根，手稳得像定住，挑完一把握起，斜光在棍间移动。","copy":"屏住呼吸，一根一根挑，手稳得像定住。如今手不抖了，心里反倒没那分稳当。","tags":"#挑棍儿 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":329,"cat":"童年游戏·玩具","theme":"打四角","img":"80年代校园角落的墙根下，男孩抡圆胳膊把纸叠的四角摔在地上，啪一声把地上的四角掀翻，他欢呼着捡起赢的战利品，旁边堆着一摞纸四角，水泥地面，阳光强烈。","vid":"镜头低角度贴地拍摄，纸四角被摔得翻起，男孩蹲下捡起赢的，得意地甩了甩，光斑在纸角上闪动。","copy":"纸四角抡圆了摔，啪，翻个身就是战利品。那动静，城里娃没见过。","tags":"#打四角 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":330,"cat":"童年游戏·玩具","theme":"斗鸡","img":"80年代学校操场上，两个男孩单腿站立，架着膝盖互相顶撞，一个男孩被顶得后退几步差点摔倒，旁边围着一圈孩子加油，红砖墙前，阳光把他们的影子叠在一起。","vid":"镜头侧面拍摄，两个男孩单腿蹦跳着顶撞，一方被顶退踉跄站稳，围观孩子起哄，阳光在跳跃的身影间闪动。","copy":"单腿蹦着，膝盖顶膝盖，谁也不肯先落地。那点不服输，早让日子磨平了。","tags":"#斗鸡 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":331,"cat":"童年游戏·玩具","theme":"挤油油","img":"80年代冬天教室的墙根下，一排孩子侧身贴着墙挤成一团，边挤边喊，穿棉袄的男孩被挤得脸贴墙，哈出的白气在冷空气里飘散，土墙被晒得发白，冬日阳光斜照。","vid":"镜头横向拍摄，孩子们喊着号子一起挤，队尾的孩子跑上前再挤，白气在光中升腾，棉衣摩擦声阵阵。","copy":"一溜孩子贴墙挤，号子一喊，越挤越暖。墙根晒得再热，也暖不回那排人。","tags":"#挤油油 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":332,"cat":"童年游戏·玩具","theme":"编花篮","img":"80年代学校操场上，几个女孩围成一圈，一条腿互相搭成花篮，边转圈边拍手唱歌，扎马尾的女孩站在中间，裙摆飞扬，红砖墙和旗杆在背景里，阳光明亮。","vid":"镜头环绕拍摄女孩们的花篮转圈，搭起的腿有节奏地跳着，中间的女孩拍手领唱，裙摆在光影里飞扬。","copy":"腿搭成花篮，转着圈唱，转到头晕也不肯停。花篮散了，歌也记不全了。","tags":"#编花篮 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":333,"cat":"童年游戏·玩具","theme":"丢手绢","img":"80年代学校操场的草地上，孩子们围坐成一个大圈拍手唱歌，一个男孩攥着手绢绕着圈跑，悄悄把手绢丢在一个女孩身后，女孩发觉后起身追赶，阳光把草地照得金黄。","vid":"镜头从圈中央俯拍，男孩绕圈丢下手绢，女孩起身追，男孩跑回空位坐下，笑声四起，光影在草地上晃动。","copy":"手绢丢在谁身后，谁就追。追上了，追不上，都笑一场。那圈人，如今聚不齐了。","tags":"#丢手绢 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":334,"cat":"童年游戏·玩具","theme":"传话游戏","img":"80年代教室里，孩子们排成一列，一个女孩凑到前一个同学耳边说悄悄话，一个接一个往下传，最后面的男孩听完挠头一脸茫然，大家哄堂大笑，木窗透进斜斜的阳光。","vid":"镜头横向移动跟随传话的队伍，孩子挨个咬耳朵说悄悄话，最后男孩挠头懵住，众人笑弯腰，光线在脸上跳动。","copy":"一句悄悄话传到底，全走了样。笑得前仰后合，如今想找个人传话都难了。","tags":"#传话游戏 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":335,"cat":"童年游戏·玩具","theme":"打电报","img":"80年代夜晚的村口，几个孩子蹲在墙角比划着暗号，一个男孩猫着腰跑到电线杆下拍一下再跑回，嘴里喊着电报来了，月光把他们的影子拉长，远处老屋亮着灯。","vid":"镜头在夜色中跟随男孩猫腰奔跑，他拍一下电线杆转身跑回，伙伴们捂嘴笑，月光在墙面上投下晃动的人影。","copy":"电线杆下拍一下，喊声电报来了就跑。手机一响，接起的人没有几个了。","tags":"#打电报 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":336,"cat":"童年游戏·玩具","theme":"官兵抓强盗","img":"80年代学校操场上，穿白衬衫的男孩在前面狂奔，后面几个孩子紧追不舍，前面的人回头看，一脸紧张又兴奋，追的人张开双臂，红砖教学楼前，阳光把奔跑的身影拉长。","vid":"镜头从追捕者身后跟随奔跑，前面男孩回头做鬼脸加速跑，追的人扑空，众人笑着散开，阳光在脚步间闪动。","copy":"官兵在后面追，强盗在前面窜，风灌进衣领。那声站住，如今只在梦里了。","tags":"#官兵抓强盗 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":337,"cat":"童年游戏·玩具","theme":"攻城","img":"80年代村口的空地上，孩子们用树枝在地上划出两个大圈当城，两拨人互相冲进对方的圈里抢人，男孩们推搡拉扯，一个男孩被拽出圈，尘土飞扬，土墙老屋为背景。","vid":"镜头俯拍地上的攻城圈，孩子们在圈内外拉扯，一个男孩被连拖带拽拉出圈外，尘土扬起，阳光在尘雾中散射。","copy":"地上画两圈，冲进去抢人，拉拉扯扯一身土。各守各的城，再没那股冲劲。","tags":"#攻城 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":338,"cat":"童年游戏·玩具","theme":"踢房子","img":"80年代冬天教室门口，几个男孩排着队踢着踢房子，一个男孩金鸡独立踢起棉鞋，鞋子落在格子里，他单脚跳进去，旁边的孩子拍手，土墙根下，冬日的阳光暖融融。","vid":"镜头低角度拍摄男孩单脚踢鞋，棉鞋划出弧线落在格子中间，他单脚蹦跳着前进，光斑在墙根下晃动。","copy":"一只棉鞋踢进格，单脚蹦着往前挪。鞋还是那双脚，格子却画不进日子了。","tags":"#踢房子 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":339,"cat":"童年游戏·玩具","theme":"跳马","img":"80年代学校操场上，一个男孩弯腰弓背当马，另一个男孩助跑几步，双手撑着他的背腾空跃过，稳稳落地，旁边排着队的孩子鼓掌，红砖墙前，阳光明亮。","vid":"镜头侧面拍摄，男孩助跑撑背腾空，身体划过一道弧线落地站稳，当马的男孩直起腰笑，阳光在腾空的瞬间闪耀。","copy":"助跑，撑背，腾空，稳稳落地的神气。那匹弯腰的马，腰杆挺不直了。","tags":"#跳马 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":340,"cat":"童年游戏·玩具","theme":"弹瓶盖","img":"80年代教室的课桌上，两个男孩面对面弹啤酒瓶盖，指头一弹，瓶盖滑过桌面撞上对方的瓶盖，把对方的顶出桌沿，旁边趴着几个同学围观，窗边阳光斜照桌面。","vid":"特写手指弹出瓶盖，瓶盖滑行相撞，对方的瓶盖飞出桌沿落地，男孩拍桌欢呼，光线在瓶盖金属面上闪动。","copy":"瓶盖顶着瓶盖，一弹，对手的滚下桌沿。赢一场，能美上一整天。","tags":"#弹瓶盖 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":341,"cat":"童年游戏·玩具","theme":"扇纸牌","img":"80年代小巷的青石板上，男孩蹲着用力扇地上的纸牌，纸牌上印着三国人物，扇起的风把纸牌翻面，他满脸通红，旁边蹲着对手，墙根下阳光斜照，地上的纸牌堆成小山。","vid":"镜头贴近地面拍摄，男孩抡臂扇下，纸牌应声翻面，他捏起纸牌塞进口袋，咧嘴一笑，光影在石板上晃动。","copy":"抡圆胳膊扇下去，纸牌翻个面就归我了。蹲到腿麻，那会也不知道什么叫累。","tags":"#扇纸牌 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":342,"cat":"童年游戏·玩具","theme":"画手表","img":"80年代夏天的教室里，男孩用圆珠笔在手腕上画了一块手表，表盘上画着数字和指针，他举起手腕端详，一脸认真，同桌的女孩凑过来看，窗外蝉鸣，木窗透进明亮的光。","vid":"特写圆珠笔在手腕上画表盘，男孩画完举起手腕得意地看，指针画得很神气，光线在笔尖下游走。","copy":"圆珠笔在手腕画块表，秒针永远指三点。腕上戴着真表，却总嫌时间不够用。","tags":"#画手表 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":343,"cat":"童年游戏·玩具","theme":"吹泡泡","img":"80年代夏天的院子里，女孩举着铁丝圈蘸肥皂水，轻轻一吹，一串泡泡在阳光下飘起，折射出七彩的光，她仰着头追着泡泡跑，旁边的男孩伸手去戳，老院墙下，阳光灿烂。","vid":"镜头仰拍泡泡在阳光下飘起，折射出七彩光斑，女孩仰头追着泡泡跑，男孩踮脚去戳，光影在泡泡上流转。","copy":"铁丝圈蘸点肥皂水，一吹，满院子七彩泡。泡泡飞着飞着就破了，我们追着追着就老了。","tags":"#吹泡泡 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":344,"cat":"童年游戏·玩具","theme":"滑冰车","img":"80年代冬天结冰的河面上，男孩坐在自制的木板冰车上，双手握着铁钎撑冰面，冰车在冰面上滑行，溅起冰屑，后面跟着一个推冰车的伙伴，河岸白雪皑皑，冬日阳光清冷。","vid":"镜头从冰面低角度跟随冰车滑行，铁钎撑出冰屑，冰车滑远，男孩回头笑，清冷的阳光在冰面上闪烁。","copy":"木板冰车撑开冰面，嗖一下滑出去老远。屁股冻得发麻，也不肯让给别人坐。","tags":"#滑冰车 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":345,"cat":"童年游戏·玩具","theme":"冰上陀螺","img":"80年代冬天的冰面上，男孩挥鞭抽打陀螺，陀螺在冰面飞速旋转，鞭子抽得啪啪响，他穿军绿棉袄，鼻尖冻红，旁边几个孩子蹲着看，冰面映着天光，远处枯树挂雪。","vid":"特写鞭子抽在冰面陀螺上，陀螺加速旋转，男孩追着抽，冰屑飞溅，清冷的阳光在冰面上反光。","copy":"鞭子啪啪响，陀螺在冰上转成一团影。冰化了，陀螺锈了，转不动了。","tags":"#冰上陀螺 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":346,"cat":"童年游戏·玩具","theme":"打雪仗","img":"80年代雪后的村口，孩子们分成两拨打雪仗，雪球在空中飞来飞去，一个男孩被雪球砸中肩膀，笑着抖落身上的雪，弯腰再团一个，雪地上一串串脚印，老屋屋檐挂着冰凌。","vid":"镜头跟随雪球飞行轨迹，雪球砸中男孩散开雪雾，他笑着团雪反击，雪雾在冷光中飘散，冰凌在檐下闪光。","copy":"雪球砸中后背，凉飕飕的，反手再团一个。雪还是那片雪，砸的人各忙各的了。","tags":"#打雪仗 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":347,"cat":"童年游戏·玩具","theme":"堆雪人","img":"80年代雪后的院子里，两个男孩滚着雪球堆雪人，雪人已经成形，插着红辣椒当鼻子，煤块当眼睛，围着红围巾，男孩踮脚给雪人戴上破草帽，院墙和屋顶积着厚雪。","vid":"镜头从雪人特写缓缓拉远，男孩踮脚给雪人戴草帽，拍手后退两步端详，雪花零星飘落，冷光柔白。","copy":"红辣椒插成鼻子，煤块按成眼睛，雪人就活了。春天一来，它化得干干净净，连声招呼都没打。","tags":"#堆雪人 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":348,"cat":"童年游戏·玩具","theme":"掏鸟窝","img":"80年代村口的大杨树下，一个男孩抱着树干往上爬，伸手探向树杈上的鸟窝，树下仰着头看的小伙伴一脸紧张，鸟窝里探出几只雏鸟的嘴，午后阳光透过枝叶洒下光斑。","vid":"镜头仰拍男孩爬树掏鸟窝，他伸手够到鸟窝，雏鸟张着嘴叫，树下伙伴仰头招手，光斑在枝叶间晃动。","copy":"爬上树杈，伸手一够，雏鸟张嘴叫成一片。后来我把窝放回去了，现在树还在，我够不着了。","tags":"#掏鸟窝 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":349,"cat":"童年游戏·玩具","theme":"摸鱼","img":"80年代村边的水塘里，男孩卷着裤腿弯腰在水里摸鱼，双手在水底合拢，猛地捧起一条小鱼，鱼尾甩出水珠，他咧嘴笑，水塘倒映着蓝天和土房，阳光在水面碎成金点。","vid":"镜头贴近水面拍摄，男孩双手捧起小鱼，水珠从指间滴落，鱼尾甩动，他笑着喊，阳光在水珠上闪光。","copy":"双手往水底一合，捧起一条，鱼尾甩一脸水。鱼塘都承包了，那汪浑水只能梦里摸。","tags":"#摸鱼 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":350,"cat":"童年游戏·玩具","theme":"摘野果","img":"80年代秋日的山坡上，男孩攀着树枝摘野枣，篮子挂在树枝上，野枣红彤彤挂满枝头，树下另一个男孩仰头接，山脚下是金黄的稻田，秋阳把山坡染成暖色调。","vid":"镜头仰拍男孩攀枝摘枣，红枣落进篮子，树下男孩仰头接着，秋阳在枝叶间洒下金斑，山风轻拂。","copy":"野枣挂满枝头，酸得倒牙也往兜里装。现在超市的果子，没那味了。","tags":"#摘野果 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":351,"cat":"童年游戏·玩具","theme":"挖野菜","img":"80年代春日的田埂上，女孩挎着小竹篮蹲着挖荠菜，小铲子剜起一丛野菜，抖掉根上的土放进篮子，篮子已装了半筐，身后是返青的麦田，晨光柔和，露珠闪烁。","vid":"镜头俯拍女孩的小铲子剜起荠菜，抖土放进竹篮，她直起腰用手背擦汗，晨光在露珠上闪亮。","copy":"小铲子剜起一丛荠菜，抖掉土，篮子就满了。野菜包饺子那口香，香了半辈子。","tags":"#挖野菜 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":352,"cat":"童年游戏·玩具","theme":"采蘑菇","img":"80年代雨后的松树林里，女孩挎着竹篮蹲在树下采蘑菇，拨开落叶露出褐色的蘑菇，她小心地掰下放进篮子，林间雾气弥漫，阳光透过树冠洒下光束，地面铺着松针。","vid":"镜头跟随女孩的手拨开落叶，蘑菇被掰下放进竹篮，她抬头看看四周，林间光束在雾气中缓缓流动。","copy":"拨开落叶，伞盖大的蘑菇露了头。采回家炒一盘，鲜得锅铲都停不下来。","tags":"#采蘑菇 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":353,"cat":"童年游戏·玩具","theme":"钓青蛙","img":"80年代夏日的稻田边，男孩举着钓竿，钓线上拴着一团棉花，在稻丛间上下点动，一只青蛙跃起咬住棉花，他猛地一提，青蛙被甩到田埂上，他扑过去按住，稻田翠绿，阳光强烈。","vid":"镜头从稻丛低角度拍摄，青蛙跃起咬住棉花被甩上田埂，男孩扑上去按住，咧嘴笑，阳光在稻叶上闪动。","copy":"棉球一抖，青蛙蹿起来咬住，甩上田埂又放了。玩的就是那一下心跳，青蛙也懂。","tags":"#钓青蛙 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":354,"cat":"童年游戏·玩具","theme":"捉蜻蜓","img":"80年代夏天的池塘边，男孩举着绑了蛛网的竹竿，轻轻靠近停在芦苇尖上的红蜻蜓，屏住呼吸猛地一罩，蜻蜓粘在网上，他小心地捏住翅膀，池塘水面映着蓝天，阳光刺眼。","vid":"镜头缓慢推近停在芦苇尖的蜻蜓，竹竿上的蛛网轻轻罩下，蜻蜓粘住，男孩捏起翅膀端详，光线在翅脉上透亮。","copy":"蛛网竹竿轻轻一罩，红蜻蜓就粘住了。捏着翅膀看了又看，还是松了手。","tags":"#捉蜻蜓 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":355,"cat":"童年游戏·玩具","theme":"捉萤火虫","img":"80年代夏天的夜晚，田埂上几个孩子举着玻璃瓶追萤火虫，萤火虫在草丛间闪烁，一个女孩用瓶口轻轻罩住一只，瓶里亮起一点绿光，周围稻田蛙鸣，月色朦胧。","vid":"镜头在夜色中跟随孩子们追逐，萤火虫的绿光在草丛间明灭，女孩罩住一只举瓶看，绿光在瓶中闪动。","copy":"玻璃瓶一罩，一点绿光在手里亮了。城里的灯太亮，再见萤火虫得翻山越岭。","tags":"#捉萤火虫 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":356,"cat":"童年游戏·玩具","theme":"听蝉鸣","img":"80年代夏天的午后，男孩躺在树下的竹席上，手里摇着蒲扇，眯眼听着树上的蝉鸣，老槐树上几只知了在叫，他翻了个身，树影斑驳，阳光从树叶缝隙洒下。","vid":"镜头从树梢的蝉慢慢下摇到竹席上的男孩，他摇着蒲扇翻了个身，蝉鸣声里光影在他脸上缓缓晃动。","copy":"蒲扇摇着，蝉声一阵盖过一阵，眼皮直打架。蝉年年叫，听蝉的人换了一茬又一茬。","tags":"#听蝉鸣 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":357,"cat":"童年游戏·玩具","theme":"看蚂蚁","img":"80年代夏日墙角下，两个男孩趴在地上看蚂蚁搬家，用草棍拨动蚂蚁的队伍，蚂蚁扛着米粒排成一列，一个男孩看得入神，土墙根下，阳光把地面晒得发烫。","vid":"镜头贴近地面拍摄蚂蚁队伍，草棍拨动，蚂蚁四散又聚拢，男孩们趴着看得入神，光斑在地面晃动。","copy":"蚂蚁扛着米粒排成队，草棍一拨，乱了又聚。趴到太阳下山，也没看出个所以然。","tags":"#看蚂蚁 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":358,"cat":"童年游戏·玩具","theme":"数星星","img":"80年代夏天的夜晚，院子里铺着凉席，两个孩子并排躺着数星星，银河横贯天际，男孩伸出手指指点点，旁边的老槐树影影绰绰，萤火虫在草丛间飞舞，月光洒落。","vid":"镜头从星空缓缓下摇到凉席上的两个孩子，男孩伸手指着星星，旁边的女孩数着，萤火虫光点在夜色中明灭。","copy":"凉席一铺，银河挂在头顶，数着数着就睡着了。抬头看天，星星被灯影淹了。","tags":"#数星星 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":359,"cat":"童年游戏·玩具","theme":"听鬼故事","img":"80年代夏天的夜晚，几个孩子围坐在村口的老槐树下，中间一个男孩压低声音讲鬼故事，孩子们紧张地抱在一起，一个女孩捂住耳朵，月光透过树冠洒下斑驳的影子，远处狗吠。","vid":"镜头缓慢环绕围坐的孩子们，讲故事的男孩压低声音，孩子们缩成一团，月光在树影间晃动，氛围紧张。","copy":"鬼故事讲到一半，谁也不敢动。散场往回走，路灯底下跑了八百回。","tags":"#听鬼故事 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":360,"cat":"童年游戏·玩具","theme":"弹杏核","img":"80年代夏天的树荫下，两个男孩蹲在地上弹杏核，指头一弹，杏核撞上另一颗，赢家把杏核收进衣兜，地上画着线，旁边放着一小堆杏核，土墙根下，阳光斑驳。","vid":"镜头贴近地面拍摄，杏核被弹出撞上另一颗，赢家伸手收起杏核，咧嘴笑，光斑在地面跳动。","copy":"杏核一弹，撞上另一颗，脆生生一声响。赢一兜回家，乐得跟过年似的。","tags":"#弹杏核 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":361,"cat":"童年游戏·玩具","theme":"扔口袋","img":"80年代课间的操场上，几个孩子站成两排互相扔沙包口袋，中间的孩子来回躲闪，一个女孩跳起来接住口袋得了一分，欢呼着，红砖墙前，阳光把影子拉长。","vid":"镜头跟随沙包口袋的弧线，女孩跳起接住口袋，落地欢呼，两边孩子笑着，阳光在沙包上闪动。","copy":"口袋飞来飞去，中间的孩子上蹿下跳。接住一个能救回一条命，可如今命里没人替咱挡了。","tags":"#扔口袋 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":362,"cat":"童年游戏·玩具","theme":"跳竹竿","img":"80年代乡村的院子里，两个男孩蹲着有节奏地敲打竹竿，女孩们在开合的竹竿间跳跃，扎马尾的女孩脚步轻盈地跳出，竹竿敲地发出哒哒声，土墙老屋前，阳光明亮。","vid":"镜头低角度拍摄竹竿开合，女孩在竹竿间跳跃进出，脚步轻盈，竹竿敲击声有节奏，光影在她脚边跳动。","copy":"竹竿哒哒开合，脚步跟着节拍跳进跳出。夹住脚的那回，笑到肚子疼，现在想起还疼。","tags":"#跳竹竿 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":363,"cat":"童年游戏·玩具","theme":"爬树","img":"80年代村口的大槐树下，一个男孩光着脚丫抱着树干往上爬，手脚并用，树杈上坐着另一个男孩在招手，树下仰头看着的小伙伴鼓着掌，树影斑驳，阳光透过枝叶洒下。","vid":"镜头仰拍男孩抱树向上爬，手脚交替上移，他够到树杈坐上去，树下伙伴仰头喊，光斑在树干上晃动。","copy":"光脚丫子夹着树干，蹭蹭往上，坐到树杈上就赢了。树下没人喊吃饭了，我也不爬了。","tags":"#爬树 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":364,"cat":"童年游戏·玩具","theme":"翻墙头","img":"80年代放学的路上，男孩们翻学校低矮的砖墙，一个男孩骑在墙头上，另一个翻过墙头落地，书包在身后晃荡，墙外的杨树和土路，午后阳光把墙头晒得发烫。","vid":"镜头从墙内仰拍男孩骑上墙头翻身跳下，落地站稳拍拍手，墙外伙伴喊他，阳光在墙头闪动。","copy":"蹬墙头翻身一跳，落地拍拍手，撒腿就跑。大门常开着，反倒没人翻墙了。","tags":"#翻墙头 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":365,"cat":"童年游戏·玩具","theme":"钻玉米地","img":"80年代夏天的玉米地里，两个男孩猫着腰在玉米行间穿行，玉米秆高过人头，叶子沙沙响，一个男孩拨开叶子探头看，阳光从叶缝漏下斑驳光点，闷热潮湿。","vid":"镜头跟随男孩在玉米行间猫腰穿行，玉米叶拂过他的肩膀，他拨开叶子探出头，光斑在叶间晃动。","copy":"玉米叶沙沙响，猫着腰钻半天，出来一身印子。如今连块玉米地都难找了，更别说那身印子。","tags":"#钻玉米地 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":366,"cat":"童年游戏·玩具","theme":"拾稻穗","img":"80年代秋收后的稻田里，女孩挎着篮子弯腰拾稻穗，捡起一根放进篮子，稻田里留着茬子，远处村民在打谷场上忙活，金黄的稻浪和蓝天，秋阳把一切染成暖色。","vid":"镜头俯拍女孩拾稻穗的手，捡起一根放进篮子，她直起腰用手背擦汗，秋阳在稻茬上泛金。","copy":"收割完的田里，弯腰一根根拾稻穗，拾满一小篮。机器收得干净，那弯腰的功课没人做了。","tags":"#拾稻穗 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":367,"cat":"童年游戏·玩具","theme":"赶鸭子","img":"80年代傍晚的村口水塘边，女孩举着竹竿赶鸭子回家，鸭群嘎嘎叫着排着队扭着屁股走，几只鸭子扑棱翅膀，水面映着晚霞，土路两旁的房屋亮起灯，黄昏光线温暖。","vid":"镜头从鸭群后方跟随，鸭群摇摆着前进，女孩挥着竹竿轻赶，晚霞映在水面，光线温暖柔和。","copy":"竹竿一挥，鸭群嘎嘎扭着屁股往家赶。那叫声，是村里一天里最热乎的动静。","tags":"#赶鸭子 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":368,"cat":"童年游戏·玩具","theme":"喂小鸡","img":"80年代农家院子里，女孩蹲在地上撒米粒，一群毛茸茸的小鸡围过来啄食，叽叽喳喳，她伸手轻轻碰一只小鸡的绒毛，旁边的老母鸡护着鸡仔，院墙边阳光温暖。","vid":"镜头俯拍小鸡围啄米粒，女孩的手轻轻拨弄绒毛，小鸡叽叽叫散开又聚拢，阳光在绒毛上泛光。","copy":"米一撒，毛茸茸的小鸡围过来，叽叽喳喳抢。蹲着看半天，太阳落山了也不饿。","tags":"#喂小鸡 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},

{"id":370,"cat":"童年游戏·玩具","theme":"捞蝌蚪","img":"80年代春天的小河边，男孩蹲在岸边用小网兜捞蝌蚪，网兜提起，几只黑蝌蚪在网里扭动，他小心地倒进玻璃瓶，旁边放着一瓶捞好的蝌蚪，河水清澈，阳光在水面闪动。","vid":"镜头贴近水面拍摄，网兜提起带起水花，蝌蚪在网里扭动，倒进玻璃瓶，男孩端详着，光在水面闪动。","copy":"网兜一舀，黑蝌蚪在网里扭。养到长出后腿，天天蹲着看，作业都顾不上了。","tags":"#捞蝌蚪 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":371,"cat":"童年游戏·玩具","theme":"捉泥鳅","img":"80年代雨后的水田边，男孩弯腰在水田里摸泥鳅，双手合拢捧起一条滑溜溜的泥鳅，泥鳅扭动着滑脱，他扑进水田溅起泥水，脸上身上全是泥，夕阳把水田染成金色。","vid":"镜头贴近水面拍摄，男孩捧起泥鳅又滑脱，他扑进田里溅起泥水，抹了把脸咧嘴笑，夕光在泥水上泛金。","copy":"双手一合，滑溜溜的从指缝跑了，再扑，溅一身泥。泥鳅没捉几条，人笑趴在水田里。","tags":"#捉泥鳅 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},

{"id":373,"cat":"童年游戏·玩具","theme":"集烟盒","img":"80年代男孩的抽屉里，整整齐齐压着一摞烟盒，他把烟盒展开压平，叠成一摞，烟盒上印着各种老牌子图案，他拿着一个新烟盒爱不释手，窗边阳光斜照在烟盒上。","vid":"镜头从抽屉里的烟盒堆缓缓上摇，男孩展开新烟盒压平叠进摞里，拍了拍，光线在烟盒图案上泛光。","copy":"烟盒压平叠成一摞，比课本还整齐。柜子早空了，叠烟盒的手也糙了。","tags":"#集烟盒 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":374,"cat":"童年游戏·玩具","theme":"集邮票","img":"80年代男孩的房间里，他趴在小桌上用镊子夹起邮票，小心地放进集邮册，放大镜和邮票夹摊在桌边，邮票上有山水花鸟图案，窗外透进明亮的阳光，桌角放着茶杯。","vid":"镜头俯拍镊子夹起邮票放入集邮册，放大镜扫过邮票纹路，男孩端详着，阳光在邮票面上泛光。","copy":"镊子夹起邮票，小心翼翼放进册里。信不写了，那册子压在箱底，谁也不记得翻。","tags":"#集邮票 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":375,"cat":"童年游戏·玩具","theme":"攒硬币","img":"80年代男孩的储钱罐旁，他把一分二分五分的硬币摞成小柱，数着数，硬币在阳光下泛着金属光泽，桌上摊开一堆硬币，他一脸认真，窗边光线明亮。","vid":"镜头俯拍硬币被摞成小柱，男孩数着硬币，拿起一枚弹了弹听响，阳光在硬币上闪亮。","copy":"一分两分往罐里丢，叮当一声，心里就踏实一分。攒够买根冰棍那天，高兴了好几天。","tags":"#攒硬币 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":376,"cat":"童年游戏·玩具","theme":"存扑满","img":"80年代男孩的床头，放着一只泥塑的扑满小猪存钱罐，他往投币口塞进一枚硬币，晃了晃，小猪肚子里叮当响，他满意地拍了拍，土屋的窗边透进暖暖的光。","vid":"特写硬币塞进扑满投币口，男孩晃了晃听响，拍拍猪肚子，阳光在泥猪表面泛光。","copy":"泥小猪吞下一枚硬币，晃一晃，叮当响。摔开它那天，才知道攒的不只是钱。","tags":"#存扑满 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":377,"cat":"童年游戏·玩具","theme":"摔四角","img":"80年代校园的墙根下，男孩抡圆胳膊把纸四角摔在地上，啪一声把地上的四角拍翻，他捡起赢的，衣兜里鼓鼓囊囊塞满四角，旁边蹲着不服气的对手，水泥地面，阳光刺眼。","vid":"镜头贴地拍摄，纸四角被摔得翻面，男孩捡起塞进衣兜，对手不服气地瞪眼，光斑在纸角上闪动。","copy":"四角摔得啪啪响，翻过来就赢，翻不过再摔。手摔红了，裤子膝盖磨出洞也不管。","tags":"#摔四角 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":378,"cat":"童年游戏·玩具","theme":"玩纸枪","img":"80年代男孩们用铁丝和橡皮筋做成纸枪，把纸叠成子弹装进去，一个男孩单眼瞄准，手指一扣，纸弹弹出，对面的孩子捂着胸口假装中弹倒地，巷子里阳光斜照。","vid":"镜头从纸枪侧面拍摄，男孩扣动扳机纸弹弹出，对面的孩子捂着胸口装死倒地，众人哄笑，光线在枪身上闪动。","copy":"铁丝一弯，橡皮筋一绷，纸弹就飞出去。对面的娃捂着胸口倒下，那出戏我们演了一夏天。","tags":"#玩纸枪 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":379,"cat":"童年游戏·玩具","theme":"玩泥巴","img":"80年代雨后的村口，几个孩子蹲在泥坑边玩泥巴，把泥巴捏成小人、小碗、小桥摆成一排，一个男孩手上脸上全是泥，笑得露出豁牙，土墙边积水映着天光，雨后空气清新。","vid":"镜头俯拍孩子们的手在泥巴上捏出形状，男孩抹了把脸上的泥咧嘴笑，泥人摆成一排，雨后光线下泥巴泛光。","copy":"泥巴捏成碗、捏成桥，排成一溜摆太阳底下。晒干就裂，裂了再捏，日子就是这么过的。","tags":"#玩泥巴 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":380,"cat":"童年游戏·玩具","theme":"追蜻蜓","img":"80年代夏天的稻田边，男孩张开双臂追着一只红蜻蜓跑，蜻蜓在稻穗上空忽高忽低，他跳起来扑，蜻蜓灵巧地闪开，他叉腰喘气，稻田翠绿，阳光明亮。","vid":"镜头跟随男孩奔跑，蜻蜓在稻穗间忽高忽低，男孩跳起扑空，叉腰喘气，阳光在蜻蜓翅膀上闪亮。","copy":"蜻蜓忽高忽低，追着追着，跳起来也够不着。它歇在稻穗上，我们远远看着，谁也没再追。","tags":"#追蜻蜓 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":381,"cat":"童年游戏·玩具","theme":"捕蝴蝶","img":"80年代春天的田野上，女孩举着网兜追着一只白蝴蝶跑，蝴蝶在野花丛间飞舞，她挥网一罩，蝴蝶被罩住，她小心地掀起网口往里看，野花遍地，阳光温暖。","vid":"镜头跟随蝴蝶飞舞的轨迹，网兜罩下，女孩掀起网口往里看，蝴蝶振翅，阳光在蝶翅上泛光。","copy":"网兜一挥，白蝴蝶罩住了，翅膀扑扑地颤。掀开看一眼，手一张，它飞走了，我替它高兴了一下午。","tags":"#捕蝴蝶 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},
{"id":382,"cat":"童年游戏·玩具","theme":"逮蛐蛐","img":"80年代秋天的夜晚，男孩打着手电筒在墙根草丛里找蛐蛐，他拨开草丛，一只蛐蛐振翅鸣叫，他慢慢合拢手掌扣下去，小心地装进竹筒，月光洒在土墙上。","vid":"镜头贴近草丛拍摄，手电光扫过，蛐蛐振翅，男孩双手合拢扣住，装进竹筒，手电光在草丛间晃动。","copy":"手电筒一照，蛐蛐不叫了，屏住气慢慢拢手。逮住装进竹筒，那声脆叫能乐一晚上。","tags":"#逮蛐蛐 #童年时光的回忆 #80年代 #童年 #回忆 #上热门"},

{"id":518,"cat":"农事·生产","theme":"摘棉花","img":"80年代午后棉田，阳光炽热，妇女弯腰摘棉，手指捏住棉絮一拽，白絮入兜，汗珠滴进土里，棉桃咧嘴露出白絮，远处草帽晃动，蝉鸣声里一片忙碌。","vid":"镜头跟拍摘棉的手，棉絮被拽出时轻轻弹开，汗水滑落，光斑在雪白棉絮上跳动。","copy":"太阳毒辣，手不能停。一朵一朵摘，一天才一兜。棉花白，白得晃眼，那是娘的手泡出来的。","tags":"#摘棉花 #农村生活 #80年代 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":519,"cat":"农事·生产","theme":"种菜","img":"80年代菜园，母亲用小锄挖坑，弯腰点种，覆土浇水，菜畦整整齐齐，黄瓜架豆角架立着，水瓢舀水浇下，晨光里水珠闪亮，园边篱笆爬满牵牛花。","vid":"镜头从菜畦俯拍，锄头挖坑点种，水瓢浇下水珠飞溅，晨光在水珠里闪烁，母亲身影。","copy":"小锄挖坑，点种浇水，一天看三遍。菜园子绿油油，是妈妈另一个孩子。后来园子填了，她再没种过菜。","tags":"#种菜 #农村生活 #80年代 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":520,"cat":"农事·生产","theme":"浇地","img":"80年代田间，水渠里清流哗哗，父亲用铁锹开沟放水，水流漫进干裂的田垄，赤脚踩在水沟里，水花溅起，夕阳把水面照得发亮，麦苗喝饱了水，绿意盎然。","vid":"镜头贴水面横移，水流漫过干土滋滋作响，父亲锹开沟垄，夕阳金光在水面跳跃。","copy":"水渠一开，水流哗啦钻进干裂的土。父亲守着水口，一守大半夜。后来渠干了，他蹲在田头抽烟。","tags":"#浇地 #农村生活 #80年代 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":521,"cat":"农事·生产","theme":"挑水","img":"80年代清晨井台，父亲挑着扁担，两头木桶盛满清水，扁担压弯，脚步沉稳，水花晃出桶沿，青石板路湿漉漉，晨光斜照，炊烟升起，老槐树影投下。","vid":"镜头从水桶特写跟拍，扁担上下轻颤，水花晃出，晨光在桶面泛亮，脚步声沉稳。","copy":"扁担吱呀，两桶水压弯了肩。青石板路湿漉漉，脚印一串一串。现在自来水一拧就有，那根扁担却舍不得扔。","tags":"#挑水 #农村生活 #80年代 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":522,"cat":"农事·生产","theme":"担柴","img":"80年代山间小路，父亲挑着两大捆柴，扁担压得弯弯，汗湿的后背，柴捆在肩头晃悠，山路蜿蜒，秋林金黄，夕阳把影子拉得老长，脚步沉重有力。","vid":"镜头从柴捆侧面跟拍，扁担颤悠，柴捆晃动，夕阳逆光勾出剪影，脚步声踏实。","copy":"柴捆在肩头晃，山路一弯又一弯。灶膛的火，就是这么烧起来的。如今儿女都进了城，柴火没人挑了。","tags":"#担柴 #农村生活 #80年代 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":523,"cat":"农事·生产","theme":"砍柴","img":"80年代山林，父亲抡起斧头砍向枯树，咔嚓一声树干断落，木屑飞溅，晨雾在林间缭绕，阳光从树缝漏下光柱，地上堆着劈好的柴，山鸟惊飞。","vid":"镜头从斧头特写拉远，斧落木断，木屑飞溅，慢镜头，晨光光柱穿过林间雾气。","copy":"斧头抡圆，咔嚓一声，树干断了。木屑飞溅，惊起一林子鸟。现在山封了，斧头锈成了铁疙瘩。","tags":"#砍柴 #农村生活 #80年代 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":524,"cat":"农事·生产","theme":"捡柴","img":"80年代秋日田埂，孩子们背着竹筐捡枯枝，弯腰拾起散落的树枝，筐里渐渐装满，路旁落叶金黄，夕阳西下，麻雀归巢，小道上身影蹦跳。","vid":"镜头从竹筐特写拉起，小手拾柴入筐，落叶飘过，夕阳金光把身影拉长，脚步轻快。","copy":"放学路上，顺手拾一筐枯枝。筐满了，天也黑了。现在的孩子放学玩手机，哪知道柴火啥滋味。","tags":"#捡柴 #农村生活 #80年代 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":525,"cat":"农事·生产","theme":"劈柴","img":"80年代农家院，父亲把木墩立稳，抡起斧头劈下，木柴一分为二，碎木崩开，旁边柴垛码得整齐，冬日暖阳照着，呼出的白气，汗珠在额头，院里静悄悄。","vid":"镜头从斧头正面特写，斧落柴裂，木片崩开，慢镜头，白气呼出，冬日阳光清亮。","copy":"木墩上一放，斧起柴裂，咔嚓两半。柴码得齐齐的，够烧一冬。现在暖气片烫手，炕头却凉了。","tags":"#劈柴 #农村生活 #80年代 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":526,"cat":"农事·生产","theme":"拉板车","img":"80年代土路上，父亲弓腰拉着装满粮食的板车，车辙深深，绳子勒进肩膀，母亲在后边推车，孩子坐在粮袋上，尘土飞扬，烈日当空，路边的杨树影斑驳。","vid":"镜头从车轮特写拉起，车辙在土路上延伸，父亲弓背拉车，汗水滴落，光斑晃过。","copy":"绳子勒进肩膀，板车吱呀吱呀。一车粮食，从村头拉到镇上。后来路修平了，板车早散了架。","tags":"#拉板车 #农村生活 #80年代 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":527,"cat":"农事·生产","theme":"推独轮车","img":"80年代乡间土路，老人推着独轮车，车两侧装着粮袋和农具，车轴吱呀响，保持平衡，路面坑洼，独轮压过土沟，黄昏光线，剪影拉长，麦田在侧。","vid":"镜头从车轮侧面跟拍，独轮压过土沟颠簸，老人稳把车把，黄昏金光勾出剪影。","copy":"吱吱呀呀，独轮车碾过土沟。老人把稳车把，一车推百十斤。现在柏油路宽了，那辆独轮车靠在墙角。","tags":"#推独轮车 #农村生活 #80年代 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":528,"cat":"农事·生产","theme":"赶牛车","img":"80年代田间土路，牛拉着木板车，车上装着稻捆，赶车人坐在车辕上甩着鞭子，牛铃叮当，尘土轻扬，两侧稻田金黄，蓝天白云，午后的阳光暖烘烘。","vid":"镜头从牛角特写拉远，牛铃晃动叮当，车轮碾过土路，稻浪起伏，午后阳光温暖。","copy":"牛铃叮当，牛车慢慢悠悠上路。装一车稻子，太阳暖烘烘。后来农机一响，牛铃再没人听了。","tags":"#赶牛车 #农村生活 #80年代 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":529,"cat":"农事·生产","theme":"驾马车","img":"80年代公路上，枣红马拉着一挂大车，车夫甩响长鞭，马蹄哒哒，车板装着粮食，车轮滚滚，尘土扬起，两侧白杨树成排，晨光洒下，车夫唱着山歌。","vid":"镜头从马鬃特写拉起，马蹄哒哒刨起尘土，长鞭甩响，晨光在鬃毛上跳跃。","copy":"马鞭一甩，哒哒的马蹄扬起尘土。孩子们追着车跑，追出好远。如今村里没马车了，那声吆喝也想不起来了。","tags":"#驾马车 #农村生活 #80年代 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":530,"cat":"农事·生产","theme":"骑驴","img":"80年代乡道，毛驴驮着货袋，主人骑在驴背上，手里拿根柳条，驴耳朵一抖一抖，铃铛叮当，路旁野花盛开，蓝天白云，绿树成荫，悠闲的午后。","vid":"镜头从驴头侧面跟拍，驴耳朵抖动铃铛响，柳条轻晃，阳光透过树影洒下光斑。","copy":"驴耳朵一抖，铜铃脆生生响。骑在驴背上，慢悠悠晃到村口。后来驴卖了，路上再没那一声铃铛。","tags":"#骑驴 #农村生活 #80年代 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":531,"cat":"农事·生产","theme":"放牛","img":"80年代河滩草地，牧童骑在牛背上吹着竹笛，牛低头啃着青草，尾巴甩着赶蝇，旁边溪水潺潺，夕阳把河面染成金色，远山如黛，炊烟在村头升起。","vid":"镜头从牛背牧童摇向河面，牛低头吃草，笛声悠悠，夕阳金光在水面流淌，牧童身影。","copy":"笛声悠悠，牛低头啃着青草。夕阳把河面染金，我靠着牛背睡着了。后来笛子不吹了，牛也不见了。","tags":"#放牛 #农村生活 #80年代 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":532,"cat":"农事·生产","theme":"放羊","img":"80年代山坡，羊群散在草地上吃草，白花花一片，牧羊人拄着羊鞭坐在石头上，远山青翠，蓝天白云，山风拂过，羊铃叮当，几朵野花摇曳。","vid":"镜头从羊群全景缓缓推进，羊低头啃草抬头张望，羊铃叮当，山风拂过草浪，白云流动。","copy":"羊鞭一甩，羊群哗啦啦上山坡。羊铃轻响，啃到太阳落山。现在羊圈在棚里吃饲料，再没那满坡的铃铛了。","tags":"#放羊 #农村生活 #80年代 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":533,"cat":"农事·生产","theme":"喂猪","img":"80年代农家猪圈，母亲端着木盆倒进猪食，黑猪拱着槽子吃得欢，发出吧嗒吧嗒声，猪圈泥地湿滑，旁边的菜叶堆着，晨光斜照，鸡在院里啄食。","vid":"镜头从猪槽特写拉起，猪食倒入槽中，黑猪拱食吧嗒响，晨光在食槽水面泛亮。","copy":"猪食一倒，黑猪拱着槽子吧嗒吧嗒。猪肥了，年就有了盼头。妈妈喂猪的背影，现在只能在梦里见了。","tags":"#喂猪 #农村生活 #80年代 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":534,"cat":"农事·生产","theme":"喂鸡","img":"80年代农家院，母亲端着簸箕撒玉米粒，母鸡咯咯叫着扑过来啄食，公鸡昂首打鸣，小鸡跟在后面，晨光洒满小院，墙头丝瓜藤，露水未干。","vid":"镜头从簸箕特写拉起，玉米粒撒落，鸡群扑翅啄食，晨光在羽上泛金，鸡鸣声起。","copy":"玉米一撒，母鸡咯咯扑过来。蛋攒着，换油盐钱。妈妈端着簸箕的手，如今连鸡也不养了。","tags":"#喂鸡 #农村生活 #80年代 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":535,"cat":"农事·生产","theme":"赶鸭","img":"80年代村边水塘，妇女挥着竹竿赶鸭子，鸭群摇摇摆摆扑进水里，白毛浮绿水，红掌拨清波，水面荡开涟漪，傍晚霞光映红水面，芦苇摇曳。","vid":"镜头从鸭群岸边摇向水面，鸭子扑翅入水，涟漪荡开，晚霞在水面铺开金光。","copy":"竹竿一扬，鸭子扑棱棱下水。夕阳染红水塘，鸭子嘎嘎不肯回。现在塘填了，那水声也听不到了。","tags":"#赶鸭 #农村生活 #80年代 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":536,"cat":"农事·生产","theme":"放鹅","img":"80年代河边草地，大白鹅昂首挺胸，迈着方步，牧鹅人拿着竹竿跟在后面，鹅群嘎嘎叫着，伸长脖子，河边绿柳垂丝，晨光洒在白色羽毛上，露珠闪亮。","vid":"镜头从鹅颈特写拉远，白鹅昂首迈步，竹竿轻赶，晨光在羽上流动，柳丝轻拂。","copy":"大白鹅昂着头，嘎嘎迈着方步。养到过年，就是最硬的一道菜。现在村里没人养鹅了，那叫声远了。","tags":"#放鹅 #农村生活 #80年代 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":537,"cat":"农事·生产","theme":"养兔","img":"80年代兔舍，木笼里白兔红眼睛，孩子抱着青草喂兔子，兔子三瓣嘴快速嚼动，胡须抖动，笼边堆着青菜，午后阳光透过木栏，兔毛雪白，地上铺着干草。","vid":"镜头从兔笼特写推近，兔嘴嚼草胡须抖动，孩子伸手轻抚，阳光透过木栏洒下光斑。","copy":"三瓣嘴一嚼一嚼，兔子把草吃得飞快。剪一茬毛，换几毛钱。那会儿的零花，都是兔毛换的。","tags":"#养兔 #农村生活 #80年代 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},

{"id":706,"cat":"交通·出行","theme":"三轮车","img":"80年代小城街巷，人力三轮车夫弓腰蹬车，车厢里坐着老人和孩子，车铃叮当，车后斗码着货物，青砖老墙从身边掠过，晨光斜照，影子拉长，烟火气浓，怀旧写实。","vid":"镜头低机位跟拍车轮，车夫弓腰蹬车，车身微晃，街巷光影在脸上滑过，铃铛声起，扬尘轻飘。","copy":"铃铛叮当，一块钱能送到巷口。如今路宽了，蹬三轮的人却少了。","tags":"#三轮车 #80年代 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
