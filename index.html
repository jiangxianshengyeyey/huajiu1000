{"id":717,"cat":"交通·出行","theme":"木船","img":"80年代水乡小河，老船工摇着木船，桨叶划开碧绿水面，船头坐着戴斗笠的妇人，船尾堆着菜篮，两岸是灰瓦白墙的老屋，垂柳拂水，傍晚斜阳把水面染成金色，怀旧写实。","vid":"镜头从船头俯拍水面，桨叶划出涟漪，船身轻晃，柳影在波光里碎开，夕阳把水面镀成金色。","copy":"咿呀一声，桨叶推开绿水。如今河还在淌，摇船的人却歇了。","tags":"#木船 #80年代 #童年 #乡愁记忆 #怀旧 #上热门"},
{"id":718,"cat":"交通·出行","theme":"竹筏","img":"80年代山间溪流，竹筏顺着清浅的溪水漂流，撑筏人手持长篙点水，筏上坐着背竹篓的乡亲，溪水清澈见底，两岸青山竹林，阳光从林隙漏下，光斑洒在水面，怀旧写实。","vid":"镜头沿溪流低机位跟随，长篙点水划出涟漪，竹筏顺流轻晃，林间光斑在水面跳跃。","copy":"篙尖点水，筏子晃悠悠过溪。现在栈道修进了山，再没那筏清水送人了。","tags":"#竹筏 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":719,"cat":"交通·出行","theme":"扁担挑","img":"80年代乡间大路，汉子挑着两头沉甸甸的箩筐，扁担弯成弓，他换着肩一步步走，额头冒汗，箩筐里装着粮食和家什，路旁稻田青黄，晨光斜照，影子长长，怀旧写实。","vid":"镜头从扁担特写拉远，担子随步伐上下颤动，汉子换肩时一顿，尘土轻扬，光影在稻浪上流动。","copy":"咯吱一声，扁担弯成弓。如今箩筐收进阁楼，挑担的人背也驼了。","tags":"#扁担挑 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":720,"cat":"交通·出行","theme":"徒步远行","img":"80年代公路边，背行李卷的青年独自走在土路上，手里拄着木棍，脚上解放鞋沾满泥，路旁白杨列队，远处山影朦胧，天边晚霞烧红，影子拉长，画面孤寂又坚定，怀旧写实。","vid":"镜头从后方跟拍，青年一步步走远，身影在晚霞里缩小，扬起的尘雾在逆光中发亮。","copy":"木棍拄着，晚霞烧红了半边天。如今出门就是高铁，那一步步走出的踏实，找不回来了。","tags":"#徒步远行 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":721,"cat":"交通·出行","theme":"赶火车","img":"80年代火车站广场，人们扛着大包小包狂奔，绿皮车就要开了，有人边跑边回头喊，检票口拥挤，行李卷在头顶晃，站房灰旧，清晨冷光，呼出的白气可见，怀旧写实。","vid":"镜头从广场摇向检票口，人群奔跑涌动，包裹在肩头颠簸，白气在冷光里升腾，脚步急促。","copy":"检票口一挤，行李卷顶在头上跑。如今自助进站，没人再嘶喊着等等我了。","tags":"#赶火车 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":722,"cat":"交通·出行","theme":"挤站台","img":"80年代绿皮火车进站，站台上人山人海，人们拎着行李挤向车门，小孩骑在父亲肩头，乘务员吹哨维持秩序，车厢门口堵成一团，蒸汽弥漫，黄昏光线昏黄，怀旧写实。","vid":"镜头从高处俯拍站台，人流涌向车门，哨声阵阵，蒸汽升腾，灯光在雾里晕开，人影攒动。","copy":"汽笛一催，全都往车门挤。如今车厢再空，也装不下那年骑在爸肩头的热闹。","tags":"#挤站台 #80年代 #童年 #回忆 #上热门 #创作者分成计划"},
{"id":723,"cat":"交通·出行","theme":"坐火车看窗外","img":"80年代绿皮火车车窗边，少年趴在小桌板上看窗外，田野村庄飞速后退，麦浪起伏，远处电线杆一根根掠过，窗玻璃映着他出神的脸，午后阳光透进车厢，暖黄怀旧。","vid":"镜头从少年侧脸摇向窗外，麦田后退，电线杆掠过，光影在脸上明暗交替，车轮声轻响。","copy":"田野一格格退，少年的脸贴在窗上。现在风景还在窗外，看的人换了心思。","tags":"#坐火车看窗外 #80年代 #童年 #乡愁记忆 #回忆 #上热门"},
{"id":724,"cat":"交通·出行","theme":"站台送别","img":"80年代站台，绿皮车旁，年轻女子隔着车窗摆手，车下老人抹眼泪，男子在车窗探头喊话，蒸汽弥漫，站台灰旧，清晨薄雾，逆光把身影勾出金边，离别氛围浓，怀旧写实。","vid":"镜头从车窗外女子特写缓缓拉远，她追着缓行的列车挥手，蒸汽在晨光里弥漫，身影渐远。","copy":"隔着车窗挥手，爹的眼泪没藏住。如今我送孩子远行，才懂那年的不舍。","tags":"#站台送别 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":725,"cat":"交通·出行","theme":"硬座车票","img":"80年代，一张淡蓝色硬座火车票特写，票面印着出发站和日期，字迹清晰，票边微微卷起，摆在绿皮车厢的小桌上，旁边是一杯搪瓷缸热茶，窗外田野掠过，暖黄光线，怀旧写实。","vid":"镜头从车票特写缓缓拉远，票角被风吹动，搪瓷缸冒着热气，窗外光影扫过桌面。","copy":"一张淡蓝票，焐在手心出汗。如今它成了纪念品，那趟车却停在了记忆里。","tags":"#硬座车票 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":726,"cat":"交通·出行","theme":"行李架","img":"80年代绿皮车厢，头顶行李架上塞满行李卷、帆布包、竹篮，绳子捆着，旅客踮脚往里塞，架下的座位上人挨着人，车厢灯光昏黄，烟雾缭绕，窗外夜色掠过，怀旧写实。","vid":"镜头从行李架俯拍摇下，旅客踮脚塞包，绳结晃动，车厢灯光昏黄，人影随列车轻晃。","copy":"竹篮、帆布包，捆成一团塞上架。如今轻装出门，再不用踮脚往架上塞了。","tags":"#行李架 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":727,"cat":"交通·出行","theme":"茶炉房","img":"80年代绿皮车厢连接处，茶炉房小窗口冒着白汽，锅炉通红，乘务员用铁钩拉开炉门添煤，旅客端着搪瓷缸排队接开水，车厢过道晃动，昏黄灯光，蒸汽弥漫，怀旧写实。","vid":"镜头从茶炉房特写拉远，炉火通红跳动，水汽升腾，搪瓷缸递进递出，车身晃动光影摇摆。","copy":"铁钩拉开炉门，红光映脸。搪瓷缸里的热水，暖了一路的胃。现在炉子拆了，那口热气，成了记忆里的温度。","tags":"#茶炉房 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":728,"cat":"交通·出行","theme":"报站员","img":"80年代绿皮车厢里，女乘务员穿着制服，拿着铁皮喇叭喊站名，声音清亮，车厢里旅客纷纷起身收拾行李，她走过狭窄过道，窗外站台缓缓靠近，晨光透进车窗，怀旧写实。","vid":"镜头从乘务员正面缓缓跟随，她举起喇叭报站，旅客起身拿包，窗外光影扫过她侧脸。","copy":"铁皮喇叭一响，人都往门口挪。现在报站换了电子音，那声到了再没那么烫耳朵。","tags":"#报站员 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":729,"cat":"交通·出行","theme":"查票","img":"80年代绿皮车厢，列车员弯腰检查车票，旅客从口袋掏出皱巴巴的票递过去，手电筒光在票面晃动，过道里站着人，行李堆满，车厢灯光昏黄，夜色从窗外掠过，怀旧写实。","vid":"镜头从列车员的手特写拉远，车票在指间翻转，手电光扫过，车厢晃动，光影明灭。","copy":"手电光一晃，票角被捏得发皱。如今电子票一扫，那翻口袋找票的忙乱，收进历史了。","tags":"#查票 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":730,"cat":"交通·出行","theme":"小站停车","img":"80年代小火车站，绿皮车缓缓停靠，站台只有一间灰瓦小屋，几棵老树，旅客下车透气，小贩提着篮子叫卖，售票员站在月台上，晨雾薄薄，光线清冷，安静怀旧。","vid":"镜头从车头摇向站台小屋，列车缓缓停稳，旅客下车踱步，晨雾里光影柔和，站牌锈迹斑斑。","copy":"车一停，小贩就围到窗前。三分钟，够买包瓜子、抽口烟。如今站台上了锁，小贩早不来了。","tags":"#小站停车 #80年代 #童年 #回忆 #上热门 #创作者分成计划"},
{"id":731,"cat":"交通·出行","theme":"桥头等船","img":"80年代水乡桥头，青石台阶上，几位老乡蹲着或站着等渡船，身旁放着扁担和菜筐，远处河面雾气蒙蒙，一条木船缓缓划来，柳树垂岸，清晨光线柔和，怀旧写实。","vid":"镜头从桥头摇向河面，木船破雾而来，众人起身张望，水面波光在晨光里闪动。","copy":"扁担搁在脚边，人蹲在石阶上望河。现在开车就到对岸，那等船的眼神，望进了雾里。","tags":"#桥头等船 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":732,"cat":"交通·出行","theme":"河边摆渡","img":"80年代河边渡口，老船工一篙一篙撑着木船，船身轻晃，船上坐着挑担赶集的乡亲，岸边水草青青，芦苇摇曳，河面泛起细波，夕阳把河水染成金红，怀旧写实。","vid":"镜头从船头侧面跟随，长篙入水划出涟漪，船身轻晃，夕阳在水面碎成金红，人影晃动。","copy":"一篙下去，金红的河面碎开。如今桥通了，老船工把篙挂在了墙上。","tags":"#河边摆渡 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":733,"cat":"交通·出行","theme":"山路十八弯","img":"80年代山区盘山公路，一辆客车在蜿蜒山路上爬行，公路像玉带缠在山腰，一侧是悬崖，一侧是陡坡，远处群山叠翠，云雾缭绕，光线穿透云层，画面壮阔，怀旧写实。","vid":"镜头从高空缓缓俯拍，客车在弯道上转出一道弧线，云雾在山间流动，光影随云层明暗。","copy":"一个弯接一个弯，心提到嗓子眼。后来高速穿山而过，惊险的路成了观景台。","tags":"#山路十八弯 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":734,"cat":"交通·出行","theme":"土路扬尘","img":"80年代乡村土路，一辆牛车缓缓走过，车后扬起长长的黄土尘，路两旁的庄稼蒙了层灰，戴草帽的农人跟在车后，正午阳光炽热，尘土在光柱里飞舞，怀旧写实。","vid":"镜头从车后低机位跟随，尘土在车轮后翻卷，阳光把尘埃照得发亮，牛蹄一步步向前。","copy":"牛车一过，黄土扑了满脸。如今路修得笔直，可那口土腥味，再没尝过。","tags":"#土路扬尘 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":735,"cat":"交通·出行","theme":"新修柏油路","img":"80年代新修的柏油路笔直伸向远方，路面黝黑发亮，画着白色标线，路边刚栽的小树绑着木棍，一辆货车驶过，远处田野村庄，天空湛蓝，阳光明亮，画面崭新又怀旧。","vid":"镜头沿路面低机位向前推进，白色标线向远处延伸，货车驶过带起风，树影扫过路面。","copy":"新柏油路冒着热气，赤脚踩上去烫脚。全村人围着看第一辆汽车开过。如今路修了几回，那天的热闹没再有过。","tags":"#新修柏油路 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":736,"cat":"交通·出行","theme":"水泥路","img":"80年代新打的水泥路，路面泛着青光，一位老大爷推着自行车走在上面，车轮不再颠簸，路旁是新建的砖房，电线杆成排，阳光把路面照得发亮，画面干净，怀旧写实。","vid":"镜头从路面特写拉远，车轮平稳滚过水泥路面，大爷脚步轻快，光斑在路面移动。","copy":"青灰路面一浇好，全村都出来踩。老爷子推车走了一圈，说跟走平地似的。现在路面裂了缝，那踩上去的稀罕劲，忘不了。","tags":"#水泥路 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":737,"cat":"交通·出行","theme":"火车过山洞","img":"80年代山区铁路，绿皮火车呼啸着钻进山洞，洞口由小变大，车头灯照亮隧道，浓烟从洞口涌出，山体青黑，站台远望，光线对比强烈，画面震撼，怀旧写实。","vid":"镜头在洞口侧面固定，火车冲进洞口，光线骤暗又亮，浓烟翻涌，轰鸣声震耳。","copy":"眼前一黑，耳朵嗡的一下。出洞那瞬，光劈头盖脸砸下来。如今坐高铁，再没那声震天响的轰鸣了。","tags":"#火车过山洞 #80年代 #童年 #回忆 #上热门 #创作者分成计划"},
{"id":738,"cat":"交通·出行","theme":"铁路道口","img":"80年代铁路道口，栏杆放下，红白相间的杆子横在路中，行人自行车排队等待，火车呼啸而过，车轮声轰隆，道口值班房灰旧，午后阳光明亮，尘土扬起，怀旧写实。","vid":"镜头从道口侧面摇向火车，栏杆缓缓放下，火车高速掠过，气流掀动衣角，光影闪动。","copy":"栏杆一落，人车都停住。火车哐当而过，数完节数才放行。如今道口拆了，那数车厢的娃，数着数着就长大了。","tags":"#铁路道口 #80年代 #童年 #回忆 #上热门 #创作者分成计划"},
{"id":739,"cat":"交通·出行","theme":"等公交","img":"80年代公交站，水泥站牌下站着等车的人，有的看表，有的张望，一个孩子踮脚数着驶来的车，站台顶棚斑驳，梧桐树影洒下，午后光线温暖，画面悠闲，怀旧写实。","vid":"镜头从站牌摇向人群，众人抬头张望，公车从远处驶来，树影光斑在站台移动。","copy":"树荫下踮脚，一辆辆数过去。车来得急，挤上去才算本事。如今扫码看时刻，再不用伸脖子张望了。","tags":"#等公交 #80年代 #童年 #回忆 #上热门 #创作者分成计划"},
{"id":740,"cat":"交通·出行","theme":"挤公交","img":"80年代公交车上，车厢里人挤人，吊环晃荡，售票员在人群中挤着卖票，有人被挤得贴窗，车窗开着，风吹乱头发，车厢闷热，阳光从车窗斜射，怀旧写实。","vid":"镜头在车厢内缓慢移动，吊环随车摇晃，人群晃动，售票员递票找零，光影明暗交替。","copy":"汗味、韭菜味，挤成一团。售票员在人缝里吆喝。如今上车刷卡，再没那一路的吵嚷了。","tags":"#挤公交 #80年代 #回忆 #怀旧 #上热门 #创作者分成计划"},
{"id":741,"cat":"交通·出行","theme":"自行车带人","img":"80年代林荫道，男子骑着自行车，后座坐着妻子，前梁上坐着小孩，三人有说有笑，车铃叮当，梧桐树影斑驳，阳光从叶隙漏下，画面温馨，怀旧写实。","vid":"镜头从侧面跟随，车轮滚动，后座的人轻扶车座，树影光斑在三人身上流动。","copy":"铃一响，前梁上的我咯咯笑。后座是娘，攥着爸的衣角。后来那辆车换了又换，笑声也远了。","tags":"#自行车带人 #80年代 #童年 #回忆 #上热门 #创作者分成计划"},
{"id":742,"cat":"交通·出行","theme":"车铃铛","img":"80年代自行车把上，一只锃亮的车铃铛特写，金属反射着光，手指一按，铃铛清脆作响，背景是模糊的街道和人群，阳光强烈，光斑在铃面上跳动，怀旧写实。","vid":"镜头从铃铛特写拉远，手指按下，铃铛轻颤，清脆声响，街景在背后虚化，光影流动。","copy":"按一下，叮铃铃，一路清脆。现在满街都是喇叭，那声铃铛成了绝响。","tags":"#车铃铛 #80年代 #童年 #回忆 #上热门 #创作者分成计划"},
{"id":743,"cat":"交通·出行","theme":"打气筒","img":"80年代街边修车摊，师傅用老式打气筒给自行车打气，一下一下压着，额头冒汗，气筒铁管发亮，轮胎慢慢鼓起来，旁边摆着工具箱，午后的树荫下，光影斑驳，怀旧写实。","vid":"镜头从气筒特写拉远，师傅一下下压着气筒，轮胎鼓起，额汗滑落，树影光斑晃动。","copy":"气筒一上一下，吱呀吱呀。两分钱，打满一管气。现在都用电泵，再没人蹲在树下吱呀了。","tags":"#打气筒 #80年代 #回忆 #怀旧 #上热门 #创作者分成计划"},
{"id":744,"cat":"交通·出行","theme":"补胎","img":"80年代修车摊，师傅蹲在地上，把内胎从车圈里扒出来，放进水盆找漏气，气泡咕嘟冒出，他锉胎皮、涂胶水、贴补丁，阳光从树隙洒下，老墙根下，怀旧写实。","vid":"镜头从水盆特写升起，气泡在盆里冒起，师傅锉胎涂胶，动作麻利，光斑在手上跳动。","copy":"咕嘟，咕嘟，漏眼找到了。锉皮、涂胶、贴补丁，一气呵成。现在补胎摊都关了，那手艺没人学了。","tags":"#补胎 #80年代 #回忆 #怀旧 #上热门 #创作者分成计划"},
{"id":745,"cat":"交通·出行","theme":"修链条","img":"80年代小巷口，小伙子蹲在自行车旁，一手油污，摆弄着掉下来的链条，链轮上沾着机油，旁边放着扳手，他皱着眉装上链条转一圈，老墙灰旧，午后阳光，怀旧写实。","vid":"镜头从链条特写拉远，链条在手中转动挂回链轮，他转一圈踏板试试，油光在阳光下闪。","copy":"油手一摸，链条又掉了。装上去，转一圈，又掉。如今车坏了送店里，那蹲在路边较劲的光景，成了旧事。","tags":"#修链条 #80年代 #回忆 #怀旧 #上热门 #创作者分成计划"},
{"id":746,"cat":"交通·出行","theme":"驮东西","img":"80年代乡村公路，自行车后座上驮着两筐蔬菜，车把上挂着肉和油瓶，骑车人小心翼翼保持平衡，路是土路，两旁农田，傍晚夕阳把影子拉长，画面生活气浓，怀旧写实。","vid":"镜头从车后跟随，车筐轻晃，骑车人扭着身子找平衡，夕阳把人和车影拉长，尘土轻扬。","copy":"车把挂肉，后座驮菜，一路捏着闸。现在动动手指就到家，那一路颠回来的，不止是菜。","tags":"#驮东西 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":747,"cat":"交通·出行","theme":"绑行李","img":"80年代绿皮车前，男人蹲在行李堆旁，用麻绳一圈圈捆行李卷，打了个结实的结，行李卷得滚圆，旁边放着脸盆和网兜，站台上人来人往，晨光斜照，怀旧写实。","vid":"镜头从绳结特写拉远，麻绳一圈圈收紧，男人用力一勒，行李卷绑好，晨光里人影晃动。","copy":"绳子勒一圈，拽一拽，再勒一圈。行李卷得滚圆，那是远行的全部家当。现在箱子一拖就走，那蹲在站台捆绳的手艺，丢了。","tags":"#绑行李 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":748,"cat":"交通·出行","theme":"赶夜路","img":"80年代乡间夜路，一个人打着手电赶路，电筒光柱划破黑暗，路两旁的庄稼黑黢黢，远处村庄的灯星星点点，头顶星光，他缩着肩快步走，夜色浓重，怀旧写实。","vid":"镜头从身后跟随，手电光柱晃动，脚步急促，光束扫过庄稼，远处灯火若隐若现。","copy":"光柱一晃，怕也顾不上了。想着家里人还醒着，脚下生风。现在开车走夜路，倒惦记起那盏手电。","tags":"#赶夜路 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":749,"cat":"交通·出行","theme":"坐船过江","img":"80年代大江之上，渡轮载着乘客和自行车驶向对岸，江水宽阔浑黄，船头劈开浪花，乘客扶着栏杆远望，江风掀动衣角，对岸城市轮廓模糊，晨雾弥漫，怀旧写实。","vid":"镜头从船头侧拍，浪花在船头翻开，乘客衣角被风吹起，江面波光在晨雾里闪烁。","copy":"船头劈开浪，江风掀衣角。对岸的灯一盏盏亮起来，家的方向就定了。后来隧道通车，那江风再没这么凉过。","tags":"#坐船过江 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":750,"cat":"交通·出行","theme":"火车硬卧","img":"80年代绿皮火车硬卧车厢，三层卧铺挤满人，有人躺着看书，有人趴着打盹，过道里坐着嗑瓜子聊天，车窗窗帘半拉，午后阳光斜照进车厢，光影斑驳，怀旧写实。","vid":"镜头沿过道缓慢推进，卧铺上的人翻身，瓜子皮掉落，光线从窗外洒入，尘埃在光柱里浮。","copy":"上铺的呼噜，下铺的脚臭，都闻着睡。现在卧铺空着半截，那挤挤挨挨的暖意，还焐在胸口。","tags":"#火车硬卧 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":751,"cat":"交通·出行","theme":"绿皮卧铺","img":"80年代绿皮卧铺车厢，白色床单微微发黄，枕巾叠得整齐，小桌上放着搪瓷缸和报纸，车窗半开，风掀动窗帘，窗外的田野掠过，夕阳把车厢染成橘色，怀旧写实。","vid":"镜头从床铺特写拉向车窗，窗帘被风掀起，窗外的田野缓缓后退，夕阳光影流动。","copy":"白床单微微发黄，枕巾叠得齐整。夕阳斜进来，缸子里的茶冒热气。后来那趟卧铺，成了最贵的怀念。","tags":"#绿皮卧铺 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":752,"cat":"交通·出行","theme":"餐车","img":"80年代绿皮火车餐车，餐桌上铺着白布，服务员端着一盘盒饭走过，厨窗里蒸汽腾腾，有人吃着炒菜，车窗外的景色快速掠过，暖黄灯光，画面烟火气浓，怀旧写实。","vid":"镜头从餐车过道推进，服务员端着菜走过，蒸汽升腾，窗外风景掠过，灯光暖黄晃动。","copy":"服务员端着菜穿过，香味勾得人咽口水。咬牙买一份，舍不得吃完。现在外卖想点就点，那顿省着吃的饭最香。","tags":"#餐车 #80年代 #回忆 #怀旧 #上热门 #创作者分成计划"},
{"id":753,"cat":"交通·出行","theme":"卖盒饭","img":"80年代绿皮火车上，乘务员推着小车卖盒饭，铁皮饭盒摞成小山，打开一盒冒着热气，米饭上盖着菜，旅客纷纷掏钱，车厢过道拥挤，昏黄灯光，怀旧写实。","vid":"镜头从饭盒特写拉远，盒盖掀开热气升腾，旅客伸手递钱，小车缓缓推过，光影摇晃。","copy":"铁皮盒一摞，掀开冒热气。五块钱一份，肉片给得大方。现在吃得讲究了，那盒饭的香还勾着。","tags":"#卖盒饭 #80年代 #回忆 #怀旧 #上热门 #创作者分成计划"},
{"id":754,"cat":"交通·出行","theme":"站台卖吃食","img":"80年代小站台，小贩挎着竹篮在车窗下叫卖，篮里装着茶叶蛋、烧饼、瓜子，旅客从车窗探出身子买，递钱递物，站台灰旧，晨光清冷，热气从篮里冒起，怀旧写实。","vid":"镜头从竹篮特写升起，小贩举起茶叶蛋，旅客从车窗探身接住，晨光里热气升腾。","copy":"茶蛋的香，顺着车窗飘进来。探出身递两毛钱，换回一兜热乎。现在站台封闭管理，那挎篮的叫卖声，散进风里了。","tags":"#站台卖吃食 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":755,"cat":"交通·出行","theme":"车窗挥手","img":"80年代绿皮火车缓缓启动，车窗里探出半个身子挥手，站台上的人追着跑几步又停住，挥手作别，蒸汽弥漫，晨光逆光勾出剪影，离别画面，怀旧写实。","vid":"镜头从站台摇向车窗，车缓缓启动，窗里人挥手，站台人追跑，蒸汽弥漫，晨光剪影。","copy":"车缓缓走，窗里的手一直挥。站台上的人追了几步，停在那。如今送站的队伍里，站的是当年的我。","tags":"#车窗挥手 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":756,"cat":"交通·出行","theme":"送站接站","img":"80年代出站口，铁栅栏外挤满接站的人，踮脚张望，举着牌子，旅客涌出时人群沸腾，有人挥手喊名字，站房灰旧，日光灯惨白，人流交织，怀旧写实。","vid":"镜头从栅栏外扫向人流，接站者踮脚挥手，旅客涌出，人声鼎沸，光影在人群中晃动。","copy":"出站口一开，喊名字的、挥手的、举牌子的全围上去。现在手机定位一共享，那挤着相认的激动淡了。","tags":"#送站接站 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":757,"cat":"交通·出行","theme":"接亲人","img":"80年代长途汽车站，车门打开，一个背着行李卷的人下车，等在路边的老人迎上去，一把接过行李，拍拍肩膀，两人笑着往家走，土路，午后的阳光温暖，怀旧写实。","vid":"镜头从车门摇向老人，亲人下车，老人迎上接行李，两人并肩走远，阳光在身后拉出长影。","copy":"下了车，爹一把接过行李卷。拍了拍肩，说了句瘦了。现在我也去接孩子，学着他的样拍肩。","tags":"#接亲人 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":758,"cat":"交通·出行","theme":"行李卷","img":"80年代火车站，一个年轻人扛着圆滚滚的行李卷走在广场上，行李卷用花布包着，绳子捆紧，另一只手里提着网兜，脸晒得黝黑，清晨的站前广场，逆光剪影，怀旧写实。","vid":"镜头从正面迎拍，青年扛着行李卷走近，花布包在肩头轻晃，逆光勾出轮廓，脚步坚定。","copy":"花布行李卷，扛在肩头晃。网兜里是脸盆和搪瓷缸。现在拖着拉杆箱，再没那身闯世界的行头了。","tags":"#行李卷 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":759,"cat":"交通·出行","theme":"打背包","img":"80年代老屋，青年蹲在床边，把被子叠得方方正正，用背包带横竖捆紧，打成标准的行军背包，母亲在旁边看着，眼眶微红，屋里陈设简单，晨光从木窗照进，怀旧写实。","vid":"镜头从背包带特写拉远，被叠成方块，背包带勒紧，母亲轻轻叹气，晨光在屋里流动。","copy":"被子叠成方块，带子勒紧。娘没说话，眼眶却红了。如今背包早就散架，那声没出口的叮咛还在。","tags":"#打背包 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":760,"cat":"交通·出行","theme":"骑摩托戴风镜","img":"80年代公路，年轻人骑摩托车疾驰，戴着皮手套和防风镜，围巾在风中飘起，身后扬起尘土，路两旁白杨倒退，夕阳逆光，风镜反着光，画面潇洒，怀旧写实。","vid":"镜头从侧面跟拍，围巾飘起，风镜反光，摩托车加速，尘土在逆光里飞扬，光影流转。","copy":"围巾扬起来，风镜反着光。油门一轰，尘土追着跑。现在车库里那辆摩托，落了十年灰。","tags":"#骑摩托戴风镜 #80年代 #回忆 #怀旧 #上热门 #创作者分成计划"},
{"id":761,"cat":"交通·出行","theme":"坐拖拉机斗","img":"80年代村口，几个孩子扒在拖拉机拖斗里，笑得前仰后合，拖斗颠簸，头发被风吹乱，突突声里尘土飞扬，路旁田野掠过，傍晚霞光满天，画面欢快，怀旧写实。","vid":"镜头从拖斗上方俯拍，孩子们随着颠簸起落，笑声不断，霞光在脸上流动，尘土扬起。","copy":"颠一下，笑一阵。霞光里，土路上，笑声追着拖拉机跑。现在孩子们都坐小轿车，那敞篷的野，他们没尝过。","tags":"#坐拖拉机斗 #80年代 #童年 #回忆 #上热门 #创作者分成计划"},
{"id":762,"cat":"交通·出行","theme":"搭顺风车","img":"80年代公路边，一个背行李的姑娘站在路边招手，一辆货车缓缓停下，司机探出头问，她笑着点头，爬上副驾驶，车开走扬起尘土，路旁田野金黄，午后阳光，怀旧写实。","vid":"镜头从姑娘侧面摇向货车，她招手拦车，货车停下，她爬上车，车驶离扬尘，光影流动。","copy":"路边一招手，卡车就停了。师傅说顺路，捎到了村口。现在招手没人停，那顺路捎一程的暖，冻住了。","tags":"#搭顺风车 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":763,"cat":"交通·出行","theme":"坐马车","img":"80年代乡道，一家三口坐在马车上，孩子靠在母亲怀里，车把式甩鞭吆喝，车板铺着草垫，路旁青纱帐，马蹄得得，午后阳光透过树影洒下，画面温馨，怀旧写实。","vid":"镜头从车后跟随，车轮吱呀，孩子依在母亲怀里，树影光斑在脸上流动，马鬃轻抖。","copy":"草垫上一靠，娃在娘怀里眯眼。马铃一响，路就不急了。后来再没那辆马车，载得动一家三口的黄昏。","tags":"#坐马车 #80年代 #童年 #回忆 #上热门 #创作者分成计划"},
{"id":764,"cat":"交通·出行","theme":"坐牛车","img":"80年代田野边，老人赶着牛车，车上坐着几个串门的乡亲，牛慢悠悠走，人们唠着家常，牛铃叮当，路旁稻田金黄，傍晚炊烟，夕阳把牛车染成金色，怀旧写实。","vid":"镜头从牛头侧面跟随，牛铃摇晃，车轮慢转，乡亲唠嗑，夕阳把车身镀成金色。","copy":"牛车慢，话就多。稻子黄了又青，一车人从春唠到秋。现在见面各刷手机，那牛铃叮当的话头，断了。","tags":"#坐牛车 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":765,"cat":"交通·出行","theme":"骑驴回村","img":"80年代山道，汉子骑着毛驴回村，驴背上搭着布袋，他戴着草帽，手里甩着小树枝，山道两旁是梯田，远处村庄炊烟，午后阳光明亮，画面悠然，怀旧写实。","vid":"镜头从侧面跟随，毛驴颠着小步，草帽在风里微晃，山道蜿蜒，阳光洒在梯田上。","copy":"驴蹄哒哒，过一道坡喊一声。乡音一路，熟人的脸一路。现在回村按喇叭，应声的只剩老人。","tags":"#骑驴回村 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":766,"cat":"交通·出行","theme":"挑担进城","img":"80年代城郊公路，汉子挑着两筐蔬菜进城，扁担压弯，他换肩擦汗，筐里青菜滴着露水，远处城墙轮廓渐近，晨雾薄薄，光线清亮，画面朴实，怀旧写实。","vid":"镜头从扁担特写拉远，担子随步伐颤动，汉子换肩时一顿，晨雾里城墙渐近，光晕柔和。","copy":"筐里的菜还滴着露，人已经过了城门洞。蹲到晌午，卖完才数钱。现在超市生鲜齐全，那担露水再没人挑了。","tags":"#挑担进城 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":767,"cat":"交通·出行","theme":"背篓","img":"80年代山路，农妇背着竹背篓，篓里装着粮食，娃娃坐在篓口，小手抓着背带，她弯腰一步步上坡，路窄坡陡，两旁草木青翠，清晨光线柔和，怀旧写实。","vid":"镜头从背篓侧面跟随，娃娃在篓口摇晃，她弓腰上坡，山路蜿蜒，晨光在草木间流动。","copy":"篓里的粮压肩，篓口的娃抓带。娘一声不吭，把山路走成了平路。如今娃长成大人，娘的腰却弯了。","tags":"#背篓 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":768,"cat":"交通·出行","theme":"肩扛","img":"80年代码头，装卸工把沉重的麻袋扛上肩，身子一沉又挺直，一步步走过跳板，汗珠砸在木板上，其他人排着队，江风阵阵，阳光炽烈，怀旧写实。","vid":"镜头从脚下特写升起，麻袋压肩，脚步沉重，汗珠滴落，跳板微颤，光影晃动。","copy":"两百斤的麻袋，上肩就是一天的活。汗顺着脊背淌，砸在木板上。现在装卸都靠机械，那脊梁撑起的日子没忘。","tags":"#肩扛 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":769,"cat":"交通·出行","theme":"抬轿","img":"80年代乡间小径，两个汉子抬着一顶竹轿，轿上坐着穿新衣的老太太，轿杆颤悠悠，他们喊着号子，步伐整齐，路旁看热闹的小孩，午后阳光，画面喜庆，怀旧写实。","vid":"镜头从轿杆特写拉远，轿子上下轻颤，汉子喊着号子，小孩追看，阳光在轿顶流动。","copy":"轿杆一闪，号子一起，颤悠悠上肩。老太太端坐轿里，笑得满脸褶子。现在花轿锁在库房，那颤悠悠的号子，随轿夫散了。","tags":"#抬轿 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":770,"cat":"交通·出行","theme":"轮渡","img":"80年代江边码头，大型轮渡缓缓靠岸，汽车和人群排队上船，船身巨大，江面宽阔，汽笛长鸣，岸边吊机林立，晨雾中码头繁忙，光线清冷，怀旧写实。","vid":"镜头从码头摇向轮渡，跳板放下，车流上船，汽笛鸣响，晨雾里船影移动，光影模糊。","copy":"跳板一落，汽车排着队上船。江风里，汽笛催了三遍。现在开车过桥，轮渡码头长满了草。","tags":"#轮渡 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":771,"cat":"交通·出行","theme":"摆渡船","img":"80年代小河渡口，一条小小的摆渡船来回穿梭，船工撑着长篙，船身载着几个过河的人，河水清亮，两岸芦花飘摇，夕阳把水面染红，画面宁静，怀旧写实。","vid":"镜头从岸边摇向河心，长篙点水，船身轻晃前行，芦花在风里摇，夕阳在水面碎开。","copy":"长篙点水，船在芦花间穿行。一趟又一趟，摆到天黑。后来河上架了桥，摆渡人收篙回了家。","tags":"#摆渡船 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":772,"cat":"交通·出行","theme":"渡口喊船","img":"80年代江边渡口，一个赶路人站在石阶上，双手拢成喇叭朝对岸喊，声音在江面回荡，对岸的渡船慢慢摇过来，江雾弥漫，晨光熹微，画面有回声感，怀旧写实。","vid":"镜头从喊船人侧面摇向江面，他拢手喊话，渡船破雾而来，江雾流动，晨光渐亮。","copy":"拢手一喊，声音贴着江面走。船夫应一声，篙就撑过来了。现在江水照流，那声喊却没人应了。","tags":"#渡口喊船 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":773,"cat":"交通·出行","theme":"桥头等客","img":"80年代桥头，几辆人力车并排停着，车夫们蹲在车边抽烟聊天，看有人下桥就起身招呼，桥下河水，桥上车流，午后阳光炽热，树荫斑驳，怀旧写实。","vid":"镜头从桥头扫过，车夫起身迎客，人力车跟上，树影光斑在车身上跳动。","copy":"烟屁股一掐，人就起身迎。拉到一趟，能乐半天。现在网约车随叫随到，桥头再没蹲守的车夫。","tags":"#桥头等客 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":774,"cat":"交通·出行","theme":"码头装卸","img":"80年代货运码头，吊机吊起木箱，工人们扛着麻袋走跳板，喊着号子，货船靠岸，江面波光，岸边堆满货物，午后的阳光炽烈，汗光闪烁，画面繁忙，怀旧写实。","vid":"镜头从吊机俯拍，吊臂转动，工人扛袋过跳板，号子声起，江面波光晃动，光影炽热。","copy":"吊臂一转，号子一声。麻袋上肩，跳板颤。现在码头静悄悄，那吼出来的力气没处使了。","tags":"#码头装卸 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":775,"cat":"交通·出行","theme":"扛包","img":"80年代粮站，工人把沉甸甸的麻袋扛上肩，踉跄两步又站稳，一袋接一袋，粮站仓库高大，阳光从大门斜射进来，灰尘在光柱里飞舞，画面力量感强，怀旧写实。","vid":"镜头从仓库门逆光拍，工人扛包进门，身影在光柱里变成剪影，灰尘飞舞，光影强烈。","copy":"麻包一上肩，腿先打颤。一天几十趟，腰就没直过。现在传送带一开，那压弯的脊梁，换成了机械臂。","tags":"#扛包 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":776,"cat":"交通·出行","theme":"挑夫","img":"80年代山城石阶，挑夫挑着两筐货物爬坡，汗如雨下，脚步沉重，石阶又陡又长，他停下来换肩喘气，旁边是吊脚楼，晨雾弥漫，光线从雾里透出，怀旧写实。","vid":"镜头从石阶下仰拍，挑夫一步步爬坡，担子颤动，他停下换肩，晨雾在光里流动。","copy":"陡坡一道，担子压肩。歇口气，换个肩，接着爬。现在缆车直达山顶，那压弯的扁担，歇进了阁楼。","tags":"#挑夫 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":777,"cat":"交通·出行","theme":"船工","img":"80年代木船上，老船工赤着上身摇橹，肌肉在阳光下闪光，汗珠滚落，橹入水划出波痕，船头坐着乘客，江面开阔，风掀起他花白的头发，夕阳镀金，怀旧写实。","vid":"镜头从橹特写拉远，橹入水划波，船工躬身摇橹，夕阳把汗珠照得发亮，波光粼粼。","copy":"橹入水，哗啦一声，波纹一圈圈荡开。花白的头发在风里竖着，他一摇就是一甲子。现在江面空着，那橹声沉进水里了。","tags":"#船工 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":778,"cat":"交通·出行","theme":"舵手","img":"80年代大船驾驶舱，舵手双手把着木舵，目光盯着前方江面，舵轮锃亮，仪表盘老旧，窗外江水滔滔，他转动舵轮微调方向，午后光线从舷窗照入，怀旧写实。","vid":"镜头从舵轮特写拉向窗外，舵轮转动，江面在窗外掠过，光线在舱内流动，他专注凝视。","copy":"舵轮锃亮，他握着它像握着命。江水滔滔，他眼皮都不抬。现在自动化上船，那双看江的眼，退给了仪表。","tags":"#舵手 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":779,"cat":"交通·出行","theme":"拉纤","img":"80年代江边，几个纤夫弓着身子拉纤绳，绳子勒进肩膀，喊着号子一步步往前挪，赤脚踩在卵石滩上，货船逆流而上，江水滔滔，夕阳把身影拉长，画面悲壮，怀旧写实。","vid":"镜头从纤绳特写拉远，纤夫弓身前进，号子声起，卵石滩上脚步沉重，江水奔流，光影壮阔。","copy":"纤绳勒进肉里，号子喊得江面颤。赤脚踩在卵石上，血泡磨成茧。现在马达一响，那弯腰的脊梁不用再绷了。","tags":"#拉纤 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":780,"cat":"交通·出行","theme":"自行车队","img":"80年代清晨公路，一队自行车并排骑行，人人穿着工装，车铃响成一片，路旁田野晨雾，朝阳把车身镀成金色，队伍浩浩荡荡，画面朝气蓬勃，怀旧写实。","vid":"镜头从队伍前方迎面拍摄，车队驶近又掠过，车铃响成一片，朝阳逆光勾出轮廓，光影流动。","copy":"铃声响成一片，齐刷刷冲进晨光。那时候骑车上班，是一天最精神的时刻。现在地铁一站就到，那队骑进晨光的影子，散场了。","tags":"#自行车队 #80年代 #回忆 #怀旧 #上热门 #创作者分成计划"},
{"id":781,"cat":"交通·出行","theme":"结伴骑行","img":"80年代乡间公路，三五个年轻人骑着自行车结伴出行，车后座绑着野炊的锅碗，一路说笑，路旁油菜花金黄，蝴蝶纷飞，午后阳光明媚，画面青春，怀旧写实。","vid":"镜头从侧面跟随，车队前后错落，笑声传来，油菜花在风里起伏，光斑跳跃。","copy":"油菜花金黄，后座绑着锅碗。一路说笑，追着蝴蝶骑。现在群里约了三回，人还是没凑齐。","tags":"#结伴骑行 #80年代 #童年 #回忆 #上热门 #创作者分成计划"},
{"id":782,"cat":"交通·出行","theme":"夜路手电","img":"80年代深夜村道，一个人骑车打着手电，光柱在坑洼的土路上晃动，四周漆黑，虫鸣阵阵，远处村庄的狗吠传来，手电光在暗夜里划出轨迹，怀旧写实。","vid":"镜头从车后跟随，手电光柱晃动，车轮碾过坑洼，光在暗夜里划出弧线，虫鸣环绕。","copy":"手电一照，虫鸣就静了。狗叫了，心里反而踏实。现在路灯通到村口，那怕黑的少年，换成了别人。","tags":"#夜路手电 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":783,"cat":"交通·出行","theme":"车灯","img":"80年代夜晚公路，一辆货车的大灯划破黑暗，光柱笔直，车灯前灰尘飞舞，车头灯照见路边的树和路牌，远处有零星灯火，夜色深沉，画面静谧又赶路感强，怀旧写实。","vid":"镜头从车头正面迎拍，车灯由远及近，光柱晃动，灰尘在灯光里飞舞，远处灯火隐约。","copy":"大灯一开，夜就撕开一道口子。照着树、照着路牌，照着赶路的人。现在一路灯光明亮，那劈开黑夜的两束光，老了。","tags":"#车灯 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":784,"cat":"交通·出行","theme":"铃铛声","img":"80年代老胡同，一个孩子骑着自行车迎面而来，一手按着车铃，叮铃铃响，胡同里晾着衣服，青砖老墙，阳光从墙头洒下，画面仿佛能听见铃声，怀旧写实。","vid":"镜头从胡同口迎拍，孩子骑车而来，铃声清脆，车影掠过晾晒的衣裳，光斑移动。","copy":"叮铃铃，叮铃铃，娃的车铃脆响。晾衣裳的婶子抬头笑。后来胡同拆了，那声叮铃铃，没了着落。","tags":"#铃铛声 #80年代 #童年 #回忆 #上热门 #创作者分成计划"},
{"id":785,"cat":"交通·出行","theme":"车辙","img":"80年代雨后土路，两道深深的车辙印伸向远方，辙里积着浅浅的水，映着天光，路旁青草挂着水珠，远处是村庄和田野，清晨雾气未散，光线清透，怀旧写实。","vid":"镜头沿车辙低机位推进，水洼映出天光，车轮印向远处延伸，晨雾流动，光影清亮。","copy":"雨后两道辙，积着水映着天光。走的人多，辙就越深。现在铺成了水泥路，那汪天光没处映了。","tags":"#车辙 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":786,"cat":"交通·出行","theme":"雪地车痕","img":"80年代雪后清晨，雪地里一道车轮印和一行脚印伸向远方，路旁房屋的烟囱冒着炊烟，树枝挂满雪，天色灰白，光从云缝漏下，画面寂静清冷，怀旧写实。","vid":"镜头从雪地车痕低机位推进，车印向远处延伸，炊烟升腾，光从云缝洒下，雪面反光。","copy":"车痕和脚印，伸到炊烟底下。起早赶路的人，把冷踩成了热。如今雪落了几季，那串脚印，盖在了新雪底下。","tags":"#雪地车痕 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":787,"cat":"交通·出行","theme":"泥路","img":"80年代雨天土路，路面泥泞，脚印和车辙混在一起，一个穿雨衣的人深一脚浅一脚走着，裤腿溅满泥点，路旁水洼映着灰蒙的天，雨丝斜织，怀旧写实。","vid":"镜头从泥路低机位跟随，脚步陷进泥里又拔出，雨丝飘落，水洼荡起涟漪，天色灰蒙。","copy":"一脚陷进去，拔出来带半斤泥。雨衣一裹，照样赶路。现在路都硬化了，那甩泥的狼狈倒成了乐子。","tags":"#泥路 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":788,"cat":"交通·出行","theme":"石子路","img":"80年代乡镇街道，一条石子路凹凸不平，一辆自行车颠簸骑过，车身一跳一跳，路旁是低矮的店铺，木门板半开，午后阳光把石子照得发亮，怀旧写实。","vid":"镜头从车轮特写拉远，车轮碾过石子跳动，车身颠簸，店铺门板滑过，光斑跳动。","copy":"车轮碾过石子，颠得人屁股离座。门板半开的铺子，一家家数过去。现在街面平得溜光，那硌人的颠簸，成了笑话。","tags":"#石子路 #80年代 #回忆 #怀旧 #上热门 #创作者分成计划"},
{"id":789,"cat":"交通·出行","theme":"独轮车推粮","img":"80年代晒谷场边，汉子推着独轮车，车上码着几袋粮食，稳稳地推过场院，粮袋在车上一颤一颤，他弓腰发力，场院上晒着稻谷，金黄一片，午后阳光炽烈，怀旧写实。","vid":"镜头从侧面跟随，独轮车颤动着前行，粮袋起伏，晒谷金黄，光斑在粮袋上跳跃。","copy":"车轴吱呀，粮袋跟着晃。晒场金黄，他弓着腰推得稳当。现在收割机下地，那吱呀的独轮车，进了库房。","tags":"#独轮车推粮 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":790,"cat":"交通·出行","theme":"蹚水过河","img":"80年代夏末的小河，水浅处没过小腿，一个农民卷着裤腿，牵着老牛蹚水过河，牛背上驮着粮袋，他一手扶鞍一手探路，水花在脚边绽开，两岸庄稼青翠，阳光炽烈，怀旧写实。","vid":"镜头从牛蹄踩水的特写拉远，一人一牛蹚过河心，水花在脚边绽开，他卷着裤腿小心探路，阳光在水面闪动。","copy":"水没小腿，凉气顺着脚往上蹿。牛在前，人在后，蹚过河心。如今桥上汽车过，那一牛一人的影子，沉在了河底。","tags":"#蹚水过河 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":791,"cat":"交通·出行","theme":"拖车","img":"80年代县城，一辆拖拉机拖着挂斗车，挂斗里坐着人和货，突突开过街，路旁的行人侧目，挂斗颠簸，尘土扬起，街边老建筑，午后阳光，画面热闹，怀旧写实。","vid":"镜头从挂斗侧面跟随，挂斗颠簸，人随车晃动，尘土扬起，街景后退，光影流转。","copy":"突突声一起，街边人都看过来。挂斗里的人扶紧车帮，笑一路。现在小车满街，那拖斗上的风光，没人稀罕了。","tags":"#拖车 #80年代 #童年 #回忆 #上热门 #创作者分成计划"},
{"id":792,"cat":"交通·出行","theme":"货车斗","img":"80年代乡道，一辆解放牌卡车，货斗里站着人和行李，车开得摇摇晃晃，有人扶着车帮，有人扶着帽子，路旁田野掠过，风把衣角掀起，午后阳光，怀旧写实。","vid":"镜头从货斗后方跟随，车斗摇晃，人扶着车帮，田野在两侧掠过，风掀衣角，光影流动。","copy":"扶着车帮，风把帽子掀起来。一颠一颠，笑声也一颠一颠。现在坐着空调车，那呛一鼻子灰的痛快，绝版了。","tags":"#货车斗 #80年代 #童年 #回忆 #上热门 #创作者分成计划"},
{"id":793,"cat":"交通·出行","theme":"拖拉机突突","img":"80年代村道，红色拖拉机突突冒着烟开过，车头一震一震，驾驶员紧握方向盘，路旁的小孩捂着耳朵又追着看，土路颠簸，烟囱喷着烟，午后阳光炽热，怀旧写实。","vid":"镜头从车头侧面跟随，车头一震一震，黑烟喷出，小孩捂耳追看，土路颠簸，光影晃动。","copy":"突突突，老远就知道它来了。娃们捂耳朵，又忍不住看。现在田里换了新农机，那突突声，只响在孙子的嘴里。","tags":"#拖拉机突突 #80年代 #童年 #回忆 #上热门 #创作者分成计划"},
{"id":794,"cat":"交通·出行","theme":"排气管黑烟","img":"80年代老卡车启动，排气管猛地喷出一股黑烟，司机猛踩油门，烟团在空气中散开，车头水箱冒热气，路旁的人被呛得捂鼻，清晨光线里黑烟格外显眼，怀旧写实。","vid":"镜头从排气管特写拉远，黑烟喷涌散开，司机踩油门，车身震动，烟气在晨光里翻滚。","copy":"黑烟一冒，呛得人直捂嘴。司机探出头，还嘿嘿笑。现在排放达标，那股烟成了老卡车的绝活。","tags":"#排气管黑烟 #80年代 #回忆 #怀旧 #上热门 #创作者分成计划"},
{"id":795,"cat":"交通·出行","theme":"喇叭声","img":"80年代乡镇街头，一辆客车按着喇叭穿行，喇叭声闷响，行人和自行车纷纷避让，售票员把头探出车窗喊话，街边小贩林立，午后的阳光强烈，画面喧嚣，怀旧写实。","vid":"镜头从车头侧面跟随，喇叭按下，行人避让，售票员探窗喊话，街景掠过，光影闪动。","copy":"喇叭闷响，自行车赶紧靠边。售票员探出头，嗓门压过引擎。现在满街安静，那横冲直撞的热闹，淡出街了。","tags":"#喇叭声 #80年代 #回忆 #怀旧 #上热门 #创作者分成计划"},
{"id":796,"cat":"交通·出行","theme":"会车","img":"80年代窄路，两辆汽车在土路上会车，各自往路边靠，轮子压着路沿，司机探出头打手势，路窄得只容两车擦肩，尘土扬起，两旁农田，午后阳光，怀旧写实。","vid":"镜头从路中固定位拍，两车缓缓靠近错身，扬尘四起，司机探窗示意，光影交错。","copy":"两车相遇，谁都不肯先退。探出头比划半天，才错过去。现在路宽到八车道，那会车的客气，没人较劲了。","tags":"#会车 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":797,"cat":"交通·出行","theme":"让路","img":"80年代乡道，一辆牛车慢慢走，后面跟着的拖拉机放慢速度，不按喇叭，等牛车拐进岔路才提速，赶车的老汉回头摆手致谢，路旁庄稼，傍晚光线柔和，怀旧写实。","vid":"镜头从拖拉机驾驶位拍，牛车在前慢行，拖拉机减速等待，牛车拐弯，老汉摆手，光影温和。","copy":"拖拉机放慢，跟在牛车后头。到了岔路，老汉回头摆手。现在喇叭催得急，那让一让的人情，金贵了。","tags":"#让路 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":798,"cat":"交通·出行","theme":"爬坡","img":"80年代盘山公路，一辆满载的货车在陡坡上吃力爬行，排气管冒着黑烟，速度极慢，司机紧握方向盘，路旁是悬崖护栏，远处山峦起伏，午后阳光炽烈，怀旧写实。","vid":"镜头从路侧仰拍，货车缓缓爬坡，黑烟喷出，车轮吃土，山景在旁，光影强烈。","copy":"油门踩到底，车还是慢。悬崖就在边上，心提到嗓子眼。现在高速又宽又平，那爬坡的胆气没人提了。","tags":"#爬坡 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},
{"id":799,"cat":"交通·出行","theme":"下坡","img":"80年代山路下坡，一辆自行车飞驰而下，骑车人捏着车闸，身子后仰，车轮卷起尘土，风掀起衣角，路旁草木疾退，他咧嘴笑，午后阳光，画面畅快，怀旧写实。","vid":"镜头从前方低机位迎拍，自行车俯冲而下，尘土扬起，衣角翻飞，草木掠过，光影晃动。","copy":"捏着闸，风还是呼呼的。坡一到底，人都笑傻了。现在油门一踩就到，那坡底的狂喜，没人懂了。","tags":"#下坡 #80年代 #童年 #回忆 #上热门 #创作者分成计划"},
{"id":800,"cat":"交通·出行","theme":"长途跋涉","img":"80年代公路尽头，一个背着行李卷的旅人停下脚步，回望来路，身后是长长的公路和晚霞，他抹了把汗，又转身向前走，路旁里程碑，天边渐暗，画面辽阔，怀旧写实。","vid":"镜头从旅人身后缓缓拉远，他停下回望，又转身前行，身影在晚霞里渐小，光晕流动。","copy":"路在脚下，家在远方。走累了歇歇，还得接着赶。","tags":"#长途跋涉 #80年代 #乡愁记忆 #怀旧 #上热门 #创作者分成计划"},{"id":801,"cat":"娱乐·文化","theme":"露天电影","img":"80年代夏天的乡村打谷场上，一块白色幕布挂在两棵大树之间，放映机射出一道光束，灰尘在光柱里浮动，男女老少搬着板凳围坐，孩子们坐在最前排仰头看，夜空繁星点点，光线柔和泛黄，怀旧写实风格。","vid":"镜头从放映机光柱缓缓推向银幕，光柱里浮尘飘动，画面亮起，人群的剪影在光中晃动，幕布上的光影随胶片转动闪烁。","copy":"放映机咔嗒一响，光柱里浮尘乱飞。如今幕布收了，板凳还在，看电影的人，凑不齐了。","tags":"#露天电影 #80年代 #童年 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":802,"cat":"娱乐·文化","theme":"黑白电视","img":"80年代农村堂屋，一台12寸黑白电视机放在高脚柜上，天线斜竖，屏幕上雪花点点，一家人围坐炕头，孩子们挤在电视前，父亲拨动天线找信号，电视光与油灯光交映，怀旧写实风格。","vid":"镜头从雪花屏幕特写缓缓拉远，父亲伸手拨动天线，画面逐渐清晰，全家人的脸被电视光映亮，屋内光影明暗变化。","copy":"天线转了又转，雪花沙沙响。后来彩电进门，那台黑白电视蒙了灰，再没人为它拧天线了。","tags":"#黑白电视 #80年代 #童年 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":803,"cat":"娱乐·文化","theme":"收音机评书","img":"80年代老屋窗台，一台红灯牌收音机放在桌上，天线拉长，一位老人闭眼坐在藤椅里侧耳倾听，手边放着茶缸，午后阳光斜照，仿佛评书声从喇叭里流出，光影安静，怀旧写实风格。","vid":"镜头从收音机旋钮特写缓缓拉远，老人眯眼点头，手指在扶手上敲着节奏，阳光在房间里缓缓移动。","copy":"中午十二点半，醒木一拍，全院都静了。如今评书随手能听，那份准点守着的心气，散了。","tags":"#收音机评书 #80年代 #回忆 #乡愁记忆 #童年 #上热门 #创作者分成计划"},
{"id":804,"cat":"娱乐·文化","theme":"卡带音乐","img":"80年代青年房间，一台双卡录音机摆在桌上，一盘磁带正转动，旁边散落几盒磁带，一个青年趴在桌边跟唱，墙上贴着港星海报，台灯暖黄，窗外夜色浓，怀旧写实风格。","vid":"镜头从旋转的磁带轮特写缓缓拉远，青年跟着旋律点头哼唱，指示灯闪烁，光影在墙上晃动。","copy":"倒带咔啦一响，磁针又从头转。如今歌单随手点，当年抄歌词的认真劲儿，找不着了。","tags":"#卡带音乐 #80年代 #回忆 #童年 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":805,"cat":"娱乐·文化","theme":"踩高跷","img":"80年代正月庙会上，踩高跷的队伍在街心走过，艺人踩着两米高的木跷，画着花脸穿彩衣，摇着扇子扭来扭去，孩子们仰头追着看，锣鼓喧天，阳光明亮，街道两旁挤满人，怀旧写实风格。","vid":"镜头从高跷下仰拍，木跷稳稳迈步，彩衣飘动，艺人摇扇扭身，孩子们仰头跟着跑，锣鼓声里光影晃动。","copy":"锣鼓一催，高跷压着彩衣一摇一扭。可庙会还办着，踩跷的汉子，换了一茬又一茬。","tags":"#踩高跷 #80年代 #童年 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":806,"cat":"娱乐·文化","theme":"街机游戏厅","img":"80年代末的游戏厅，几台街机并排摆放，屏幕闪着彩光，几个少年围在机台前，手指飞快按着摇杆按键，投币声响亮，室内烟雾缭绕，霓虹灯光闪烁，怀旧写实风格。","vid":"镜头从街机屏幕彩光缓缓摇过一排机台，少年手指狂按按键，摇杆晃动，屏幕光影在脸上闪烁，投币声此起彼伏。","copy":"投币叮当一声，魂斗罗三条命。如今手机里啥游戏都有，通宵闯关的疯劲，找不回了。","tags":"#街机游戏厅 #80年代 #童年 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":807,"cat":"娱乐·文化","theme":"旱冰场","img":"80年代城里的旱冰场，圆形场地上彩灯旋转，青年男女穿着旱冰鞋穿梭滑行，有人摔跤有人笑，场边栏杆趴着围观的人，音响放着流行歌，灯光五彩斑斓，怀旧写实风格。","vid":"镜头从旋转彩灯缓缓下摇，滑冰者穿梭而过，有人摔倒有人大笑，轮子摩擦地面，彩光在人群中流转。","copy":"旱冰鞋哗啦一响，彩灯转得人发晕。如今场地拆了，牵过的那只手，也不知在哪座城。","tags":"#旱冰场 #80年代 #回忆 #童年 #乡愁记忆 #上热门 #创作者分成计划"},

{"id":902,"cat":"人物·亲情","theme":"奶奶的皱纹","img":"80年代土墙前，奶奶坐在门槛上晒太阳，脸上的皱纹像田埂一样深，她眯眼望着远处，手里攥着一块旧手帕，身旁挂着晒干的辣椒串，秋日斜阳把皱纹镀成金色，怀旧写实风格。","vid":"镜头从奶奶攥着手帕的手部特写缓缓上摇到她的脸，皱纹在夕阳里显得更深，她眯眼望向村口，光影缓慢移动。","copy":"奶奶的皱纹深得像沟，一笑就全舒展开了。她说当年也俊过，就盼儿孙常回来。","tags":"#奶奶的皱纹 #80年代 #亲情 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},

{"id":904,"cat":"人物·亲情","theme":"父亲的手","img":"80年代的院子里，父亲蹲在地上修理一辆旧自行车，粗糙的手上沾满油污，指节粗大，他专注地拧着螺丝，旁边放着一盆水和抹布，午后阳光照在他弓起的脊背上，怀旧写实风格。","vid":"镜头从父亲沾着油污的手部特写缓缓拉远，他拧紧螺丝又用抹布擦了一把汗，阳光在油污上反着光。","copy":"父亲的手粗得像锉，给我削铅笔却稳当得很。后来他老了，那双大手再也攥不紧车把。","tags":"#父亲的手 #80年代 #亲情 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":905,"cat":"人物·亲情","theme":"母亲的背影","img":"80年代黄昏的田埂上，母亲挑着两桶水往家走，背微微弓着，粗布衣裳被汗水浸透，夕阳把她的背影拉得很长，路边的稻田一片金黄，炊烟从村里升起，怀旧写实风格。","vid":"镜头从母亲的背影缓缓推近，她挑着水一步一步走过田埂，扁担吱呀作响，夕阳把影子越拉越长。","copy":"母亲挑水的背影，被扁担压弯了。现在我接过她的担子，才晓得那两桶水有多沉。","tags":"#母亲的背影 #80年代 #亲情 #乡愁记忆 #回忆 #上热门 #创作者分成计划"},
{"id":906,"cat":"人物·亲情","theme":"妈妈织的毛衣","img":"80年代的冬夜，煤油灯下妈妈坐在炕沿织毛衣，毛线团在笸箩里滚着，两根竹针上下翻飞，我趴在炕头看着，毛衣才织出半截，灯光把妈妈的身影投在墙上，怀旧写实风格。","vid":"镜头从竹针翻飞的特写缓缓拉远，妈妈低头织着毛衣，毛线团慢慢变小，油灯火苗跳动，墙上的影子晃动。","copy":"毛衣拆了织，织了拆，妈妈总说旧的不暖和。如今衣柜里还压着那件，她眼睛花了，织不动了。","tags":"#妈妈织的毛衣 #80年代 #亲情 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":907,"cat":"人物·亲情","theme":"外婆做的饭","img":"80年代的老厨房，土灶上冒着热气，外婆围着蓝布围裙往灶膛里添柴，锅里咕嘟着菜粥，案板上放着刚切好的青菜，蒸汽在斜射的阳光里飘散，怀旧写实风格。","vid":"镜头从锅盖缝冒出的蒸汽特写缓缓拉远，外婆掀开锅盖搅了搅粥，蒸汽扑满脸，灶火映红了她的脸。","copy":"外婆搅粥的手，总在围裙上蹭两下。那一锅白菜粥，现在山珍海味也换不来。","tags":"#外婆做的饭 #80年代 #亲情 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":908,"cat":"人物·亲情","theme":"奶奶讲的故事","img":"80年代夏天的夜晚，院子里铺着凉席，奶奶摇着蒲扇给围坐的孩子们讲故事，孩子们托腮仰头听得入神，月光透过枣树洒下斑驳的影子，远处传来蛐蛐叫，怀旧写实风格。","vid":"镜头从孩子们入神的脸缓缓摇到奶奶，她比划着手势讲得眉飞色舞，蒲扇轻摇，月光在凉席上慢慢移动。","copy":"奶奶讲古，讲到一半自己先笑了。现在想再听一回，那声音只存在梦里头。","tags":"#奶奶讲的故事 #80年代 #亲情 #童年 #回忆 #上热门 #创作者分成计划"},

{"id":910,"cat":"人物·亲情","theme":"爸爸的自行车","img":"80年代的乡间土路上，爸爸骑着一辆二八大杠自行车，车后座上驮着我和一个大筐，我搂着他的腰，风吹起他的白衬衫，路边的杨树向后退去，阳光洒满土路，怀旧写实风格。","vid":"镜头从转动的车轮特写缓缓拉远，自行车颠簸着前行，我搂紧爸爸的腰，路边的杨树一棵棵掠过。","copy":"车铃锈了，一按还是脆响。爸爸说过年再驮我去赶集，可那个集，再没赶成。","tags":"#爸爸的自行车 #80年代 #亲情 #童年 #回忆 #上热门 #创作者分成计划"},

{"id":912,"cat":"人物·亲情","theme":"语文老师","img":"80年代的教室里，语文老师穿着蓝布褂子，站在讲台上捧着一本课本深情朗读，另一只手轻轻比划，黑板上写着工整的板书，孩子们端坐听讲，晨光从窗户洒进来，怀旧写实风格。","vid":"镜头从课本特写缓缓拉远，语文老师边读边在过道里走动，声音抑扬顿挫，孩子们跟着摇头，晨光在粉尘里浮动。","copy":"语文老师念课文，声音能把屋顶掀了。他教的《背影》，我读一遍哭一遍。","tags":"#语文老师 #80年代 #回忆 #童年 #乡愁记忆 #上热门 #创作者分成计划"},

{"id":920,"cat":"人物·亲情","theme":"值日生","img":"80年代放学后的教室里，两个值日生抬着木桶洒水扫地，一个男孩拿扫帚扫着地，一个女孩擦着黑板，粉笔灰在斜阳里飘，课桌被搬开又摆回，安静又温暖，怀旧写实风格。","vid":"镜头从扬起的粉笔灰特写缓缓拉远，值日生挥舞扫帚扫地，另一个踮脚擦黑板，灰尘在夕阳里浮动。","copy":"值日那天得赶早，教室里粉笔灰还没落定。扫完地鼻尖都是灰，还抢着擦那块黑板。","tags":"#值日生 #80年代 #童年 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":921,"cat":"人物·亲情","theme":"赤脚医生","img":"80年代的农村卫生室，赤脚医生背着药箱，穿着白大褂，弯腰给坐在板凳上的孩子量体温，墙上挂着锦旗和处方本，桌上摆着药瓶，窗外阳光明亮，怀旧写实风格。","vid":"镜头从药箱上的红十字特写缓缓拉远，赤脚医生把听诊器贴在孩子胸口，母亲在一旁紧张看着，阳光洒进屋里。","copy":"赤脚医生的药箱一开，半村的人都安心了。他一针下去，烧退了，他也累瘫在炕上。","tags":"#赤脚医生 #80年代 #回忆 #乡愁记忆 #亲情 #上热门 #创作者分成计划"},
{"id":922,"cat":"人物·亲情","theme":"打更人","img":"80年代冬夜的村巷里，打更人披着旧棉袄，手提一盏马灯，另一只手敲着梆子，边走边喊，梆子声在寂静的村里传开，家家门窗紧闭，屋檐挂着冰凌，月光照在雪地上，怀旧写实风格。","vid":"镜头从敲梆子的手部特写缓缓拉远，打更人提着马灯走过街巷，梆子声一下一下，雪地映着灯光，人影拉长。","copy":"梆子敲过三更，狗都不叫了。那一声平安无事，如今再听不着了。","tags":"#打更人 #80年代 #回忆 #乡愁记忆 #亲情 #上热门 #创作者分成计划"},
{"id":923,"cat":"人物·亲情","theme":"放映员","img":"80年代的晒谷场上，傍晚挂起一块白布幕，放映员在调试老式电影放映机，灯泡亮起，片盘缓缓转动，孩子们搬着板凳围拢过来，大人也端着碗凑热闹，夕阳最后一抹光落下，怀旧写实风格。","vid":"镜头从转动的片盘特写缓缓拉远，放映员打亮灯光，光束投在幕布上，孩子们欢呼坐好，光影在人群脸上流动。","copy":"放映机一响，白幕上就有了热闹。现在电影院遍地都是，却再没有全村挤在一块看的夜。","tags":"#放映员 #80年代 #回忆 #乡愁记忆 #亲情 #上热门 #创作者分成计划"},
{"id":924,"cat":"人物·亲情","theme":"售货员","img":"80年代的供销社柜台前，售货员穿着蓝布围裙，站在木柜台后面，把糖果称好用纸包起来，柜台里摆着布匹、搪瓷盆和暖水瓶，顾客探着头，日光灯白亮，怀旧写实风格。","vid":"镜头从纸包糖果的特写缓缓拉远，售货员麻利地称糖、包纸、系绳，递过柜台，顾客伸手接过，灯光在玻璃柜上反光。","copy":"售货员拿糖的手，总在称上掂了又掂。一张糖票换几块糖，现在想想，那会的东西真甜。","tags":"#售货员 #80年代 #回忆 #乡愁记忆 #童年 #上热门 #创作者分成计划"},
{"id":925,"cat":"人物·亲情","theme":"赶海的人","img":"80年代的海边滩涂上，几个赶海的人卷着裤腿弯腰拾贝，挎着竹篮，远处潮水慢慢退去，露出湿漉漉的沙地，海鸥掠过，渔民扛着渔网走过，海风吹动衣角，天边晨光微亮，怀旧写实风格。","vid":"镜头从退潮的水面缓缓拉向拾贝的手，赶海人弯腰捡起一只蛤蜊放进竹篮，海鸥低飞，海浪轻轻拍打滩涂。","copy":"潮一退，滩涂上全是赶海的人。一篮蛤蜊上岸，晚上就是一锅鲜。","tags":"#赶海的人 #80年代 #回忆 #乡愁记忆 #亲情 #上热门 #创作者分成计划"},
{"id":926,"cat":"人物·亲情","theme":"老矿工","img":"80年代的矿工宿舍门口，一位老矿工穿着沾满煤灰的工作服，头顶戴着安全帽，帽檐下一张黢黑的脸，咧嘴一笑露出白牙，手里端着一个搪瓷缸，夕阳照在煤堆上，怀旧写实风格。","vid":"镜头从老矿工黢黑的脸特写缓缓拉远，他摘下安全帽拍了拍煤灰，端缸喝了一口水，夕阳把影子拉长。","copy":"老矿工从井口钻出来，一张脸只剩牙是白的。那口饭，是拿命换来的，他从来不说。","tags":"#老矿工 #80年代 #回忆 #乡愁记忆 #亲情 #上热门 #创作者分成计划"},
{"id":927,"cat":"人物·亲情","theme":"理发师傅","img":"80年代街头的理发摊，理发师傅穿着白大褂，手拿手推子给坐在木凳上的老人理发，地上落着一层碎发，旁边挂着一面镜子，墙边放着脸盆和毛巾，阳光明亮，怀旧写实风格。","vid":"镜头从手推子剪发的特写缓缓拉远，理发师傅推着头发，碎发纷纷落下，老人眯眼坐着，阳光在镜子上反光。","copy":"手推子咔咔响，碎发落了一地。两毛钱的推头手艺，现在满街找不着了。","tags":"#理发师傅 #80年代 #回忆 #乡愁记忆 #亲情 #上热门 #创作者分成计划"},
{"id":928,"cat":"人物·亲情","theme":"弹棉花的人","img":"80年代的街头，弹棉花的人弓着腰，背着弹弓，木槌一下下敲着牛筋弦，棉花在弦上飞舞起来，细絮飘在光里，旁边支着木架和压盘，地上铺着旧棉被，午后的阳光洒落，怀旧写实风格。","vid":"镜头从飞舞的棉絮特写缓缓拉远，木槌敲弦，棉絮纷纷扬起，弹棉花的人侧头避开絮，阳光在絮丝里闪亮。","copy":"弹棉花的弓弦一绷，满屋的絮都飞起来。一床新棉被压上身，是那年头最软的暖。","tags":"#弹棉花的人 #80年代 #回忆 #乡愁记忆 #亲情 #上热门 #创作者分成计划"},
{"id":929,"cat":"人物·亲情","theme":"爆米花爷爷","img":"80年代的胡同口，爆米花爷爷摇着黑乎乎的爆米花机，火苗舔着炉子，旁边围着一圈孩子捂住耳朵，他戴着手套，机器手柄吱呀转着，另一头系着布袋，怀旧写实风格。","vid":"镜头从转动的爆米花机特写缓缓拉远，爷爷猛一踩，轰的一声白烟喷出，孩子们欢呼着围上去，火光一闪。","copy":"轰的一声，米花喷了满袋，孩子们一哄而上。爆米花爷爷走了，那声轰隆再没响过。","tags":"#爆米花爷爷 #80年代 #童年 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":930,"cat":"人物·亲情","theme":"货郎叔","img":"80年代的村口，货郎叔挑着货担子吆喝着，担子两头挂满针头线脑、糖果发卡，妇女孩子们围拢过来挑拣，他满脸是汗，笑眯眯地拿糖哄小孩，阳光强烈，怀旧写实风格。","vid":"镜头从货担上的拨浪鼓特写缓缓拉远，货郎叔放下担子摇响拨浪鼓，孩子们围过来，阳光在货担上闪亮。","copy":"货郎叔的拨浪鼓一摇，全村的孩子都窜出来。他挑子上的针头线脑，换走了多少家的鸡蛋。","tags":"#货郎叔 #80年代 #童年 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":931,"cat":"人物·亲情","theme":"偷瓜的孩子","img":"80年代夏天的瓜田边，一个男孩猫着腰钻进瓜地，抱出一个大西瓜，怀里还兜着一个，田边的小伙伴蹲着望风，瓜田里的绿叶在月光下泛着光，夜色安静，怀旧写实风格。","vid":"镜头从男孩猫腰的脚部特写缓缓拉远，他抱瓜钻出瓜田，小伙伴挥手招呼，两人笑着跑远，月光在瓜叶上晃动。","copy":"月黑风高，几个黑影摸进瓜地。摘了瓜就跑，被追得鞋都掉了，还抱着瓜不撒手。","tags":"#偷瓜的孩子 #80年代 #童年 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":932,"cat":"人物·亲情","theme":"割猪草的孩子","img":"80年代的田埂边，一个扎着羊角辫的女孩弯着腰割猪草，背篓已经装了大半，她抬起手擦汗，脸上带着泥土，夕阳把她的影子拉长，田野一片金黄，怀旧写实风格。","vid":"镜头从背篓里的猪草特写缓缓拉远，女孩割下一把草放进背篓，直起腰擦汗，夕阳斜照，影子拉长。","copy":"割猪草的镰刀，比我胳膊还长。一背篓青草换两分钱，那会就觉得能帮家里了。","tags":"#割猪草的孩子 #80年代 #童年 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":933,"cat":"人物·亲情","theme":"捡稻穗的孩子","img":"80年代收割后的稻田里，几个孩子弯腰捡着散落的稻穗，一个男孩举着一把稻穗冲同伴炫耀，夕阳金黄，田野空旷，稻草垛散落，光色温暖，怀旧写实风格。","vid":"镜头从稻穗特写缓缓拉远，孩子弯腰捡起一穗，举起来朝同伴挥舞，夕阳在稻穗上镀了一层金。","copy":"大人们割稻，我们弯腰捡穗，一穗也不落。弯腰一下午，脖子酸了，可心里美滋滋。","tags":"#捡稻穗的孩子 #80年代 #童年 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":934,"cat":"人物·亲情","theme":"抓鱼的孩子","img":"80年代的小河边，几个孩子卷着裤腿在浅水里抓鱼，一个男孩两手捧着一条小鱼，水花四溅，河边的柳树垂下绿丝，阳光在水面上闪亮，怀旧写实风格。","vid":"镜头从水面泛起的水花特写缓缓拉远，孩子猛扑一下按住鱼，举起手欢呼，水花在阳光下闪亮。","copy":"河水清得见底，鱼一露头就扑。裤腿湿了回家挨骂，可那天的鱼真香。","tags":"#抓鱼的孩子 #80年代 #童年 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":935,"cat":"人物·亲情","theme":"爬树的孩子","img":"80年代的村头大槐树下，一个男孩正抱着树干往上爬，树枝向高处伸展，树下一个女孩仰头张望，夏日的蝉鸣阵阵，阳光透过树叶洒下光斑，怀旧写实风格。","vid":"镜头从孩子攀爬的手部特写缓缓拉远，他蹭蹭往上爬，树下的伙伴仰头喊他，树叶在风里沙沙响。","copy":"蹭蹭几下上到树杈，底下的小伙伴仰着脖子喊。裤子刮破挨了揍，下次还爬。","tags":"#爬树的孩子 #80年代 #童年 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":936,"cat":"人物·亲情","theme":"掏鸟窝的孩子","img":"80年代的老榆树上，一个男孩骑在树杈上伸手掏鸟窝，鸟窝里有几枚蛋，他小心翼翼捧着，树下的小伙伴紧张地望着，阳光从枝叶间漏下光斑，怀旧写实风格。","vid":"镜头从鸟窝里的蛋特写缓缓拉远，男孩小心捧起鸟蛋放回衣兜，树下的伙伴仰头喊他下来，光影在枝叶间晃动。","copy":"鸟窝里的蛋，捧在手心还温着。看老鸟在头顶急得打转，又悄悄放回去了。","tags":"#掏鸟窝的孩子 #80年代 #童年 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":937,"cat":"人物·亲情","theme":"放风筝的孩子","img":"80年代的打谷场上，一个男孩扯着风筝线奔跑，风筝在蓝天上摇摇晃晃飞起来，旁边几个孩子追着跑，田野绿油油，春风把他们的衣角吹起，阳光明亮，怀旧写实风格。","vid":"镜头从摇曳的风筝特写缓缓拉远，男孩边跑边放线，风筝越飞越高，孩子们欢呼着追赶，阳光耀眼。","copy":"风筝断了线，越飘越远，成了天上一个小点。我们追了一路，追到田埂尽头才停。","tags":"#放风筝的孩子 #80年代 #童年 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":938,"cat":"人物·亲情","theme":"打弹弓的孩子","img":"80年代的村边树林，一个男孩举着弹弓瞄准树上的麻雀，皮筋拉得满满的，一个小伙伴躲在树后张望，阳光从树叶间漏下，风吹动草丛，怀旧写实风格。","vid":"镜头从拉满的皮筋特写缓缓拉远，男孩眯眼瞄准，啪地松开皮筋，石子飞出，树上的鸟扑棱棱飞走。","copy":"弹弓的皮筋拉到耳朵根，眯眼瞄了半天。石子出去，鸟飞了，惊起一树扑棱棱。","tags":"#打弹弓的孩子 #80年代 #童年 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":939,"cat":"人物·亲情","theme":"骑牛背的孩子","img":"80年代的河滩上，一个孩子趴在牛背上打盹，牛慢慢悠悠地甩着尾巴，牧童的草帽扣在牛角上，河水浅浅流过，夕阳把一切染成金色，怀旧写实风格。","vid":"镜头从牛角上的草帽特写缓缓拉远，孩子趴在牛背上晃悠，牛缓缓渡河，水面泛着夕阳的金光。","copy":"牛背一颠，梦都颠成了甜的。老牛早不在了，那晃悠劲儿还在骨头里。","tags":"#骑牛背的孩子 #80年代 #童年 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":940,"cat":"人物·亲情","theme":"坐门槛的孩子","img":"80年代的老屋门口，一个孩子坐在高高的青石门槛上，双手托腮望着巷口，身边趴着一只大黄狗，门上的对联褪了色，午后的阳光把门槛照得发亮，怀旧写实风格。","vid":"镜头从托腮的孩子特写缓缓拉远，他晃着腿望着巷口，大黄狗抬头又趴下，阳光在门槛上慢慢移动。","copy":"门槛被屁股磨得溜光，我坐着等妈收工。天擦黑，巷口一响，我撒腿就跑过去。","tags":"#坐门槛的孩子 #80年代 #童年 #亲情 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":941,"cat":"人物·亲情","theme":"等孩子回家的母亲","img":"80年代的傍晚，母亲站在村口的土路边，手搭凉棚望向远处，夕阳把她的影子拉得很长，她手里攥着一条擦汗的毛巾，身后的村庄升起炊烟，光线温暖，怀旧写实风格。","vid":"镜头从母亲张望的侧影缓缓推近，她踮脚望向路的尽头，风吹起她的衣角，夕阳把影子拉得更长。","copy":"母亲在村口站成一根桩，手搭凉棚望到太阳落。天黑透了才回家，锅里饭菜还热着。","tags":"#等孩子回家的母亲 #80年代 #亲情 #乡愁记忆 #回忆 #上热门 #创作者分成计划"},
{"id":942,"cat":"人物·亲情","theme":"村口张望的老人","img":"80年代的村口老槐树下，一位老人拄着拐杖，眯眼望着进村的土路，脸上满是期待，夕阳把他的白发染成金色，身后的墙上贴着褪色的标语，怀旧写实风格。","vid":"镜头从老人拄拐的手部特写缓缓拉远，他踮脚朝远处张望，风吹动白发，夕阳把影子拉得很长。","copy":"老人拄着拐，每天准时到村口。他等的不是信，是能喊一声爹的那个人。","tags":"#村口张望的老人 #80年代 #亲情 #乡愁记忆 #回忆 #上热门 #创作者分成计划"},
{"id":943,"cat":"人物·亲情","theme":"赶集回来的父亲","img":"80年代的土路上，父亲赶集回来，自行车后座上绑着大包小包，车把上挂着一串油条，我坐在前梁上笑得合不拢嘴，阳光明亮，土路扬起微尘，怀旧写实风格。","vid":"镜头从车把上的油条特写缓缓拉远，父亲骑车颠簸着前进，我坐在前梁上晃着腿，阳光在油条上闪亮。","copy":"父亲赶集回来，车把上挂油条，兜里揣糖。他先掏给孩子的，从来不是零钱。","tags":"#赶集回来的父亲 #80年代 #亲情 #童年 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":944,"cat":"人物·亲情","theme":"挑水归来的母亲","img":"80年代的老井边，母亲挑着两桶水往家走，木桶里的水晃出波纹，她的蓝布衣裳被汗水浸湿，夕阳把她的身影拉长，井台边的青苔湿润，怀旧写实风格。","vid":"镜头从晃动的木桶特写缓缓拉远，母亲挑着水走过井台，桶里的水一荡一荡，夕阳把影子拉长。","copy":"母亲挑水进门，桶沿碰着门框，水洒了一地。她顾不上擦，先问饭吃了没。","tags":"#挑水归来的母亲 #80年代 #亲情 #乡愁记忆 #回忆 #上热门 #创作者分成计划"},
{"id":945,"cat":"人物·亲情","theme":"田里插秧的妇女","img":"80年代的水田里，几位妇女挽着裤腿弯腰插秧，手指在水里一点一点，绿色的秧苗排成行，她们戴着草帽说说笑笑，水面映着蓝天白云，怀旧写实风格。","vid":"镜头从插秧的手指特写缓缓拉远，妇女们边插边笑，一行行秧苗在身后铺开，水面倒映着天光。","copy":"秧苗一行行插下去，腰弯得跟弓似的。起来直直腰，望见满田的绿，又笑了。","tags":"#田里插秧的妇女 #80年代 #亲情 #乡愁记忆 #回忆 #上热门 #创作者分成计划"},
{"id":946,"cat":"人物·亲情","theme":"晒谷场上的人","img":"80年代的晒谷场上，一位老人用木耙翻着金黄的谷子，谷粒在阳光下泛着光，旁边坐着几个妇女筛谷子，孩子们在谷堆边跑闹，屋顶的喇叭放着歌，怀旧写实风格。","vid":"镜头从木耙翻谷的特写缓缓拉远，老人推着木耙来回走，谷粒在光里翻起又落下，孩子们绕着谷堆跑。","copy":"木耙一推，谷粒哗哗地翻个身。晒干的谷子进仓，心才真正落了地。","tags":"#晒谷场上的人 #80年代 #亲情 #乡愁记忆 #回忆 #上热门 #创作者分成计划"},

{"id":948,"cat":"人物·亲情","theme":"看瓜老人","img":"80年代的瓜地里，看瓜老人坐在瓜棚下，蒲扇赶着蚊虫，旁边堆着几个圆滚滚的大西瓜，他眯眼望着瓜田，月光洒在瓜叶上，一盏马灯挂在棚角，怀旧写实风格。","vid":"镜头从马灯的火苗特写缓缓拉远，老人摇着蒲扇巡视瓜田，弯腰拍拍西瓜，月光在马灯旁浮动。","copy":"瓜棚下的马灯，照着一地圆滚滚的瓜。老人拍拍这个听听那个，像拍自家娃。","tags":"#看瓜老人 #80年代 #亲情 #乡愁记忆 #回忆 #上热门 #创作者分成计划"},
{"id":949,"cat":"人物·亲情","theme":"守夜人","img":"80年代的打谷场边，守夜人披着棉大衣，坐在草垛边守着粮堆，手里拿着一盏马灯，火光映着他的脸，远处田野一片漆黑，几只萤火虫飞过，怀旧写实风格。","vid":"镜头从马灯的火苗特写缓缓拉远，守夜人紧了紧大衣，抬头望了望夜空，火光在风里轻轻摇动。","copy":"守夜人裹着大衣，靠粮堆打个盹。一有响动就惊坐起来，那是护着一年的收成。","tags":"#守夜人 #80年代 #亲情 #乡愁记忆 #回忆 #上热门 #创作者分成计划"},
{"id":950,"cat":"人物·亲情","theme":"烧火做饭的母亲","img":"80年代的老厨房，母亲坐在灶前烧火，火光把她的脸映得通红，她往灶膛里添着柴，锅里的蒸汽升腾，墙上挂着腊肉和蒜辫，油灯昏黄，怀旧写实风格。","vid":"镜头从灶膛里的火苗特写缓缓拉远，母亲添了一把柴，火光跳动，蒸汽从锅盖缝里冒出来。","copy":"灶膛的火舌舔着锅底，母亲的脸上红一阵暗一阵。她往火里添柴的手，黑得只剩指甲盖是白的。","tags":"#烧火做饭的母亲 #80年代 #亲情 #乡愁记忆 #回忆 #上热门 #创作者分成计划"},
{"id":951,"cat":"人物·亲情","theme":"兄弟姐妹分糖果","img":"80年代的农家炕上，几个孩子围坐在一起分糖果，最大的姐姐把糖一颗颗数好分给弟弟妹妹，小的捧着糖舍不得吃，油灯的光照着一圈小脑袋，怀旧写实风格。","vid":"镜头从分糖的手部特写缓缓拉远，姐姐数着糖一颗颗分下去，弟弟妹妹捧着糖咧嘴笑，油灯光在脸上晃动。","copy":"一把糖摊在炕上，姐说大让小。最小的那个分到最多，乐得满炕打滚。","tags":"#兄弟姐妹分糖果 #80年代 #亲情 #童年 #回忆 #上热门 #创作者分成计划"},
{"id":952,"cat":"人物·亲情","theme":"姐弟抢电视","img":"80年代的家庭客厅，姐姐和弟弟抢着要看电视，一个要换台看动画片，一个护着旋钮，妈妈在旁边笑着劝架，黑白电视闪着雪花，台灯暖黄，怀旧写实风格。","vid":"镜头从姐弟俩拉扯的手部特写缓缓拉向电视，雪花在屏幕上跳动，一个要换台一个护着旋钮，妈妈笑着拉开两人，灯光在客厅晃动。","copy":"姐姐攥着旋钮不放，弟弟急得直跺脚。现在一台电视摆那儿，谁都不抢了。","tags":"#姐弟抢电视 #80年代 #亲情 #童年 #回忆 #上热门 #创作者分成计划"},
{"id":953,"cat":"人物·亲情","theme":"姐妹共穿新衣","img":"80年代的新年，两个小姐妹穿着同一件大红新棉袄轮流试穿，姐姐帮妹妹扣扣子，妹妹转着圈看衣角，屋里贴着窗花，红灯笼挂着，暖黄灯光喜庆，怀旧写实风格。","vid":"镜头从新棉袄的盘扣特写缓缓拉远，姐姐给妹妹扣上扣子，妹妹转圈打量，灯光把两人的笑脸映得红扑扑。","copy":"新棉袄轮着穿，轮到谁谁就在镜子前转圈。那点欢喜，商场里再买不着了。","tags":"#姐妹共穿新衣 #80年代 #亲情 #童年 #回忆 #上热门 #创作者分成计划"},
{"id":954,"cat":"人物·亲情","theme":"哥哥背妹妹","img":"80年代的乡间小路上，哥哥背着妹妹往家走，妹妹趴在哥哥背上睡着了，手里还攥着一朵野花，哥哥的背微微弓着，夕阳把两个人的影子合在一起，怀旧写实风格。","vid":"镜头从妹妹攥花的手部特写缓缓拉远，哥哥稳稳背着妹妹走，妹妹趴在他肩头轻晃，夕阳把影子拉长。","copy":"哥哥的背晒得黑黢黢，妹妹趴着就睡着了。后来他背上有孩子，背不动我了。","tags":"#哥哥背妹妹 #80年代 #亲情 #童年 #回忆 #上热门 #创作者分成计划"},
{"id":955,"cat":"人物·亲情","theme":"弟弟跟屁虫","img":"80年代的巷子里，姐姐在前面走，弟弟在后面一路小跑跟着，手里举着一根冰棍，裤带都快掉了，姐姐回头等他，阳光把两人的影子拉长，怀旧写实风格。","vid":"镜头从弟弟小跑的脚步特写缓缓拉远，他追着姐姐跑，姐姐回头站住等他，阳光在巷子里斜照。","copy":"弟弟跟在我后面，一路小跑，裤腰带都跑松了。我回头等他，他咧着嘴，糖糊了一脸。","tags":"#弟弟跟屁虫 #80年代 #亲情 #童年 #回忆 #上热门 #创作者分成计划"},
{"id":956,"cat":"人物·亲情","theme":"大孩子带小孩","img":"80年代的院子里，一个大孩子背着小娃娃，手里拎着菜篮，小娃娃搂着他的脖子，旁边几只鸡在啄食，午后的阳光明亮，土墙边靠着农具，怀旧写实风格。","vid":"镜头从菜篮特写缓缓拉远，大孩子背着小娃娃走过院子，小娃娃趴在他肩头咿呀，阳光在院里移动。","copy":"背上的娃娃流着口水，睡着了还咿呀。背他的人，那时也才十岁。","tags":"#大孩子带小孩 #80年代 #亲情 #童年 #回忆 #上热门 #创作者分成计划"},

{"id":958,"cat":"人物·亲情","theme":"大人哄孩子睡觉","img":"80年代的土炕上，母亲轻轻拍着孩子哄睡，嘴里哼着摇篮曲，油灯的光昏暗，孩子攥着母亲的衣角，墙上的影子晃动，窗外的月光洒进来，怀旧写实风格。","vid":"镜头从孩子攥衣角的手部特写缓缓拉远，母亲轻拍着孩子，哼着歌，油灯火苗跳动，墙上影子轻晃。","copy":"娘的摇篮曲，哼得没一句在调上。孩子却睡得最沉，因为那怀里最稳当。","tags":"#大人哄孩子睡觉 #80年代 #亲情 #童年 #回忆 #上热门 #创作者分成计划"},
{"id":959,"cat":"人物·亲情","theme":"摇篮边摇蒲扇","img":"80年代的夏夜，外婆坐在摇篮边摇着蒲扇给睡着的孙儿扇风，摇篮轻轻晃动，月光透过纱窗洒进来，蚊帐低垂，画面静谧温馨，怀旧写实风格。","vid":"镜头从蒲扇扇风的特写缓缓拉远，外婆摇着蒲扇也摇着摇篮，孙儿睡得香甜，月光在纱帐上流动。","copy":"蒲扇摇一下，摇篮晃一下，热风全成了凉。外婆说，摇着摇着就把我摇大了。","tags":"#摇篮边摇蒲扇 #80年代 #亲情 #童年 #回忆 #上热门 #创作者分成计划"},

{"id":967,"cat":"人物·亲情","theme":"代课老师","img":"80年代的乡村教室，代课老师抱着课本走进教室，年轻的脸庞带着羞涩，孩子们端坐鼓掌，讲台上放着一盒粉笔，窗外的槐花飘香，晨光洒进来，怀旧写实风格。","vid":"镜头从讲台上的粉笔盒特写缓缓拉远，代课老师放下课本，转身在黑板上写下自己的名字，孩子们探头看。","copy":"代课老师来了一学期，走时孩子们追到村口。他回头挥挥手，说好好念书。","tags":"#代课老师 #80年代 #回忆 #亲情 #乡愁记忆 #上热门 #创作者分成计划"},

{"id":970,"cat":"人物·亲情","theme":"赤脚郎中","img":"80年代的乡间小院，赤脚郎中坐在木凳上给老人把脉，另一只手捋着胡须，药箱放在脚边，院子里晒着草药，阳光透过树叶洒下光斑，怀旧写实风格。","vid":"镜头从把脉的手指特写缓缓拉远，郎中闭眼凝神把脉，老人坐在对面，院里的药香在光里浮动。","copy":"郎中把脉，三根手指一搭，眉头就舒开了。几味草药下去，比啥药房都灵。","tags":"#赤脚郎中 #80年代 #回忆 #乡愁记忆 #亲情 #上热门 #创作者分成计划"},
{"id":971,"cat":"人物·亲情","theme":"手艺人爷爷","img":"80年代的街头，手艺人爷爷坐在小马扎上，用竹篾编着篮子，手指翻飞，旁边的摊上摆着编好的筐和笸箩，他戴着一顶旧草帽，阳光照着他粗糙的手，怀旧写实风格。","vid":"镜头从翻飞的竹篾特写缓缓拉远，爷爷手指灵巧地编着篮子，编好的筐在摊上排开，阳光在竹条上闪亮。","copy":"竹篾在爷爷指间翻飞，一会儿就成了个筐。他说这手艺养了他一辈子，现在没人学了。","tags":"#手艺人爷爷 #80年代 #回忆 #乡愁记忆 #亲情 #上热门 #创作者分成计划"},
{"id":972,"cat":"人物·亲情","theme":"木匠父亲","img":"80年代的院子里，木匠父亲刨着木板，刨花卷着落在地上，他弯腰用墨斗弹线，汗珠挂在脸上，旁边的木料堆成小山，午后的阳光照亮飞扬的木屑，怀旧写实风格。","vid":"镜头从卷起的刨花特写缓缓拉远，父亲弯腰弹墨线，刨子推过，木屑卷起落下，阳光里浮尘飘动。","copy":"父亲弹墨线，闭一只眼，拉得笔直。他打的家具，现在还立在老屋里。","tags":"#木匠父亲 #80年代 #亲情 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":973,"cat":"人物·亲情","theme":"铁匠父亲","img":"80年代的打铁铺里，铁匠父亲抡着大锤敲打着烧红的铁块，火星四溅，炉火映红了他满是汗水的脸，徒弟在一旁拉着风箱，锤声叮当，怀旧写实风格。","vid":"镜头从飞溅的火星特写缓缓拉远，父亲抡锤砸下，火星迸溅，炉火的光在他脸上跳动。","copy":"铁花溅起，父亲的眉毛都燎焦了。他打铁的叮当声，是村里最响的钟。","tags":"#铁匠父亲 #80年代 #亲情 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":974,"cat":"人物·亲情","theme":"剃头父亲","img":"80年代的街头，剃头父亲挑着担子支起摊子，给坐在木凳上的老人剃头，手推子咔咔响，毛巾搭在肩上，地上的碎发被风吹散，阳光明亮，怀旧写实风格。","vid":"镜头从手推子特写缓缓拉远，父亲推着头发，碎发纷纷落下，老人眯眼享受，阳光在镜子上反光。","copy":"剃头担子一头热，父亲挑着走街串巷。他的手艺，养活了一家老小。","tags":"#剃头父亲 #80年代 #亲情 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},

{"id":977,"cat":"人物·亲情","theme":"编筐大伯","img":"80年代的老槐树下，编筐大伯坐在小板凳上，把柳条一根根编进筐里，脚下堆着泡好的柳条，旁边放着编好的几个筐，他嘴里叼着旱烟，午后阳光斑驳，怀旧写实风格。","vid":"镜头从柳条穿梭的特写缓缓拉远，大伯手指翻飞编着筐底，柳条在光里晃动，编好的筐越摞越高。","copy":"柳条泡得发软，在大伯手里服服帖帖。编好的筐排一溜，赶集就卖光了。","tags":"#编筐大伯 #80年代 #回忆 #乡愁记忆 #亲情 #上热门 #创作者分成计划"},
{"id":978,"cat":"人物·亲情","theme":"打鱼大哥","img":"80年代的河面上，打鱼大哥划着小木船撒网，渔网在空中张开成圆，晨雾里河水泛着光，船舱里已躺着几条鱼，他赤着上身，动作有力，怀旧写实风格。","vid":"镜头从张开的渔网特写缓缓拉远，大哥用力一撒，渔网落水溅起水花，小船在晨雾里晃动。","copy":"大哥撒网，网兜在空中张成一张圆月。收网时鱼蹦乱跳，他说这是河的赏钱。","tags":"#打鱼大哥 #80年代 #亲情 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":979,"cat":"人物·亲情","theme":"砍柴大哥","img":"80年代的山路上，砍柴大哥挑着一担柴火往家走，扁担压弯了腰，柴捆上还插着镰刀，他擦着汗，山间的晨雾未散，阳光透过树梢洒下，怀旧写实风格。","vid":"镜头从颤动的柴捆特写缓缓拉远，大哥挑着柴走下山路，扁担吱呀，汗水顺着脸颊滴下，晨光洒在山路上。","copy":"柴担压得扁担吱呀，大哥一路歇了三回。他说山里的柴，烧出来格外旺。","tags":"#砍柴大哥 #80年代 #亲情 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},
{"id":980,"cat":"人物·亲情","theme":"放羊大爷","img":"80年代的山坡上，放羊大爷披着旧棉袄，手里拄着放羊鞭，羊群散在草地上吃草，他坐在石头上抽着旱烟，夕阳把羊群和人都染成金色，怀旧写实风格。","vid":"镜头从低头吃草的羊特写缓缓拉远，大爷甩了一下鞭子，羊群慢慢挪动，夕阳把影子拉得老长。","copy":"羊群低头吃草，大爷的旱烟冒着细烟。他数着羊，也数着一年又一年。","tags":"#放羊大爷 #80年代 #回忆 #乡愁记忆 #亲情 #上热门 #创作者分成计划"},

{"id":982,"cat":"人物·亲情","theme":"对门奶奶","img":"80年代的巷子口，对门奶奶坐在自家门槛上择菜，看见路过的孩子就招手，递上一把刚摘的豆角，她笑得满脸褶子，午后的阳光洒在巷子里，怀旧写实风格。","vid":"镜头从择菜的手部特写缓缓拉远，奶奶招手叫住孩子，塞过一把豆角，孩子笑着跑开，阳光在巷子里铺开。","copy":"对门奶奶总留着一把豆角，说是给孩子们尝鲜。后来巷子拆了，那口热乎还在嘴里。","tags":"#对门奶奶 #80年代 #亲情 #回忆 #乡愁记忆 #上热门 #创作者分成计划"},

const CATS = ["老物件","老场景·店铺","老行当·手艺","童年游戏·玩具","零食·小吃","农事·生产","日常·生活","交通·出行","娱乐·文化","人物·亲情"];
let curCat = "全部";
let kw = "";

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function cardText(d){
  return "【"+d.id+"】"+d.theme+"\n画面："+d.img+"\n视频："+d.vid+"\n文案："+d.copy+"\n话题："+d.tags;
}
function render(){
  const q = kw.toLowerCase();
  const list = DATA.filter(d => {
    if(curCat!=="全部" && d.cat!==curCat) return false;
    if(curUsed==="used" && usedIds.indexOf(d.id)<0) return false;
    if(curUsed==="unused" && usedIds.indexOf(d.id)>=0) return false;
    if(!q) return true;
    return (d.theme+d.img+d.vid+d.copy+d.tags).toLowerCase().includes(q);
  });
  document.getElementById("count").textContent = "共 "+list.length+" 组 · 已使用 "+list.filter(d=>usedIds.indexOf(d.id)>=0).length+" 组";
  document.getElementById("usedStat").textContent = "已使用 "+usedIds.length+" 组";
  const el = document.getElementById("list");
  el.innerHTML = list.map(d => {
    const isUsed = usedIds.indexOf(d.id)>=0;
    const ptime = (function(i){var day=new Date(2026,8,30);day.setDate(day.getDate()+Math.floor((i-1)/3));return day.getFullYear()+'-'+String(day.getMonth()+1).padStart(2,"0")+'-'+String(day.getDate()).padStart(2,"0")+' '+["早07:00","中12:00","晚19:00"][(i-1)%3];})(d.id);
    return '<div class="card'+(isUsed?' used':'')+'"><div class="head"><span class="no">'+String(d.id).padStart(3,"0")+'</span><span class="cat">'+esc(d.cat)+'</span><h2>'+esc(d.theme)+'</h2><span class="ptime">'+ptime+'</span><button class="use'+(isUsed?' on':'')+'" data-i="'+d.id+'">'+(isUsed?'已用✓ 取消':'标记已用')+'</button><button class="copy" data-i="'+d.id+'">复制全部</button></div>'+
    '<div class="row copyrow"><label>文案</label><p>'+esc(d.copy)+'</p><button class="cp" data-i="'+d.id+'" data-f="copy">复制</button></div>'+
    '<div class="row"><label>话题</label><p class="tags">'+esc(d.tags)+'</p><button class="cp" data-i="'+d.id+'" data-f="tags">复制</button></div>'+
    '<details><summary>画面 / 视频提示词</summary>'+
    '<div class="row"><label>文生图</label><p>'+esc(d.img)+'</p><button class="cp" data-i="'+d.id+'" data-f="img">复制</button></div>'+
    '<div class="row"><label>图生视频</label><p>'+esc(d.vid)+'</p><button class="cp" data-i="'+d.id+'" data-f="vid">复制</button></div></details></div>';
  }).join("");
}
let curUsed = "all";
let usedIds = (function(){ try{ return JSON.parse(localStorage.getItem("huajiu_used")||"[]"); }catch(e){ return []; } })();
function saveUsed(){ localStorage.setItem("huajiu_used", JSON.stringify(usedIds)); }
function toggleUsed(id){ const i = usedIds.indexOf(id); if(i>=0) usedIds.splice(i,1); else usedIds.push(id); saveUsed(); }
document.getElementById("q").addEventListener("input", e => { kw = e.target.value; render(); });
document.getElementById("copyAll").addEventListener("click", () => {
  const q = kw.toLowerCase();
  const list = DATA.filter(d => (curCat==="全部"||d.cat===curCat) && (!q || (d.theme+d.img+d.vid+d.copy+d.tags).toLowerCase().includes(q)));
  const txt = list.map(cardText).join("\n\n");
  navigator.clipboard.writeText(txt).then(()=>{ alert("已复制 "+list.length+" 组"); });
});
document.getElementById("list").addEventListener("click", e => {
  const ub = e.target.closest(".use");
  if(ub){ toggleUsed(+ub.dataset.i); render(); return; }
  const btn = e.target.closest(".cp, .copy");
  if(!btn) return;
  const d = DATA.find(x => x.id === +btn.dataset.i);
  const txt = btn.classList.contains("cp") ? d[btn.dataset.f] : cardText(d);
  navigator.clipboard.writeText(txt).then(()=>{ btn.textContent="已复制"; setTimeout(()=>btn.textContent = btn.classList.contains("cp") ? "复制" : "复制全部", 1200); });
});
(function(){
  const box = document.getElementById("cats");
  const mk = (name) => { const b = document.createElement("button"); b.textContent = name; if(name===curCat) b.classList.add("on"); b.onclick = ()=>{ curCat = name; document.querySelectorAll("#cats button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); render(); }; return b; };
  box.appendChild(mk("全部"));
  CATS.forEach(c => box.appendChild(mk(c)));
})();
["all","unused","used"].forEach(k => document.getElementById("uf-"+k).addEventListener("click", e => {
  curUsed = k;
  document.querySelectorAll("#usebar button").forEach(x=>x.classList.remove("on"));
  e.target.classList.add("on");
  render();
}));
render();
</script>
</body>
</html>
